<script>/* Simulasi interaktif Kimia Fase F — satu simulasi per bab. Setiap mount(root) mengembalikan fungsi pembersih. */
const SIMS = {};
(function () {
  const C = { ink: '#1B2A4A', mute: '#5B6B86', line: '#D5DDEA', paper: '#FFFFFF', a: '#6B3FA0', b: '#14798C', ok: '#2E8B57', bad: '#C0392B', red: '#D64545', blue: '#2F6FD6', green: '#2E9E5B', gold: '#D9A21B', grey: '#9AA6B8' };
  function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
  function fit(c) { const dpr = window.devicePixelRatio || 1; const w = c.clientWidth || 600; const h = c.clientHeight || 300; c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return { ctx, w, h }; }
  function fmt(x, d = 2) { if (!isFinite(x)) return '–'; if (x !== 0 && (Math.abs(x) < 1e-3 || Math.abs(x) >= 1e5)) { const e = Math.floor(Math.log10(Math.abs(x))); const m = x / Math.pow(10, e); return m.toFixed(2).replace('.', ',') + ' × 10<sup>' + e + '</sup>'; } return x.toFixed(d).replace('.', ','); }
  function slider(id, label, min, max, step, val, unit) { return `<label class="sim-ctl"><span>${label}: <b id="${id}-v">${val}</b> ${unit || ''}</span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></label>`; }
  function chart(ctx, x0, y0, w, h, series, o) {
    ctx.save(); ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.font = '12px "Plus Jakarta Sans", sans-serif'; ctx.fillStyle = C.mute;
    ctx.strokeRect(x0, y0, w, h);
    const X = v => x0 + (v - o.xmin) / (o.xmax - o.xmin) * w; const Y = v => y0 + h - (v - o.ymin) / (o.ymax - o.ymin) * h;
    (o.yticks || []).forEach(t => { ctx.fillText(String(t), x0 - 26, Y(t) + 4); ctx.beginPath(); ctx.moveTo(x0, Y(t)); ctx.lineTo(x0 + w, Y(t)); ctx.strokeStyle = '#EEF2F8'; ctx.stroke(); });
    (o.xticks || []).forEach(t => ctx.fillText(String(t), X(t) - 6, y0 + h + 16));
    if (o.xlabel) ctx.fillText(o.xlabel, x0 + w / 2 - ctx.measureText(o.xlabel).width / 2, y0 + h + 32);
    if (o.ylabel) { ctx.save(); ctx.translate(x0 - 40, y0 + h / 2); ctx.rotate(-Math.PI / 2); ctx.fillText(o.ylabel, -ctx.measureText(o.ylabel).width / 2, 0); ctx.restore(); }
    series.forEach(s => { if (!s.data.length) return; ctx.beginPath(); ctx.strokeStyle = s.color; ctx.lineWidth = 2.5; s.data.forEach((p, i) => { const px = X(p[0]), py = Y(Math.max(o.ymin, Math.min(o.ymax, p[1]))); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }); ctx.stroke(); });

</script><script>/* Simulasi tambahan Kelas XII (per sub-materi) */
(function () {
  const C = { ink: '#1B2A4A', mute: '#5B6B86', line: '#D5DDEA', a: '#14798C', p: '#6B3FA0', ok: '#2E8B57', bad: '#C0392B', red: '#D64545', blue: '#2F6FD6', green: '#2E9E5B', gold: '#D9A21B', grey: '#9AA6B8' };
  function fit(c) { const dpr = window.devicePixelRatio || 1; const w = c.clientWidth || 600; const h = c.clientHeight || 300; c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return { ctx, w, h }; }
  const n2 = (x, d = 2) => (isFinite(x) ? x.toFixed(d).replace('.', ',') : '–');
  const fmtH = x => (x > 0 ? '+' : '') + n2(x, Math.abs(x - Math.round(x)) > 1e-6 ? 1 : 0);
  function slider(id, label, min, max, step, val, unit) { return `<label class="sim-ctl"><span>${label}: <b id="${id}-v">${String(val).replace('.', ',')}</b> ${unit || ''}</span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></label>`; }
  function mix(a, b, t) { t = Math.max(0, Math.min(1, t)); const pa = [1, 3, 5].map(i => parseInt(a.substr(i, 2), 16)); const pb = [1, 3, 5].map(i => parseInt(b.substr(i, 2), 16)); return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
  function onResize(fn) { let t; const h = () => { clearTimeout(t); t = setTimeout(fn, 120); }; window.addEventListener('resize', h); return () => window.removeEventListener('resize', h); }
  function tube(ctx, x, y, w, h, color) { ctx.save(); ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x + 3, y + h * .3); ctx.lineTo(x + 3, y + h - w / 2); ctx.arc(x + w / 2, y + h - w / 2, w / 2 - 3, Math.PI, 0, true); ctx.lineTo(x + w - 3, y + h * .3); ctx.closePath(); ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + h - w / 2); ctx.arc(x + w / 2, y + h - w / 2, w / 2, Math.PI, 0, true); ctx.lineTo(x + w, y); ctx.stroke(); ctx.restore(); }
  const SUBD = '₀₁₂₃₄₅₆₇₈₉'; const sub = s => String(s).replace(/\d/g, d => SUBD[+d]);
  const frac = c => { const a = Math.abs(c); const m = { 0.5: '½', 1.5: '3/2', 2.5: '5/2', 3.5: '7/2' }; return m[a] || (a === 1 ? '' : String(a)); };
  const S = SIMS;

  // ===== XII-1b Hukum Hess =====
  S['XII-1b'] = {
    title: 'Teka-teki Hukum Hess', intro: 'Susun persamaan target dari persamaan yang diketahui: balik dan/atau kalikan setiap persamaan, lalu jumlahkan. Nilai ΔH ikut berubah sesuai operasi.',
    mount(root) {
      const P = [
        { n: 'Pembentukan CO', t: { C: -1, O2: -0.5, CO: 1 }, e: [[{ C: -1, O2: -1, CO2: 1 }, -394], [{ CO: -1, O2: -0.5, CO2: 1 }, -283]] },
        { n: 'Pembentukan SO₃', t: { S: -1, O2: -1.5, SO3: 1 }, e: [[{ S: -1, O2: -1, SO2: 1 }, -297], [{ SO2: -2, O2: -1, SO3: 2 }, -198]] },
        { n: 'Grafit → intan', t: { 'C(grafit)': -1, 'C(intan)': 1 }, e: [[{ 'C(grafit)': -1, O2: -1, CO2: 1 }, -393.5], [{ 'C(intan)': -1, O2: -1, CO2: 1 }, -395.4]] },
        { n: 'Pembentukan etana', t: { C: -2, H2: -3, C2H6: 1 }, e: [[{ C: -1, O2: -1, CO2: 1 }, -394], [{ H2: -1, O2: -0.5, H2O: 1 }, -286], [{ C2H6: -1, O2: -3.5, CO2: 2, H2O: 3 }, -1560]] },
      ];

      function draw() {

        root.querySelector('#eqs').innerHTML = p.e.map((e, i) => { const f = st[i].k * (st[i].r ? -1 : 1); const m = {}; Object.keys(e[0]).forEach(s => { m[s] = e[0][s] * f; net[s] = (net[s] || 0) + m[s]; }); dH += e[1] * f; return `<div class="sim-panel" style="margin-bottom:8px"><div class="note">Persamaan ${i + 1}: ${eqs(e[0])}   ΔH = ${fmtH(e[1])} kJ</div><div class="btns wrap"><button class="btn ghost" data-r="${i}">${st[i].r ? 'Dibalik ✓' : 'Balik'}</button>${[0, 0.5, 1, 2, 3].map(k => `<button class="chip ${st[i].k === k ? 'on' : ''}" data-k="${i}:${k}">×${k === 0.5 ? '½' : k}</button>`).join('')}</div><div><b>${st[i].k === 0 ? '(tidak dipakai)' : eqs(m)}</b>   ΔH = <b>${fmtH(e[1] * f)} kJ</b></div></div>`; }).join('');

        root.querySelector('#sum').innerHTML = `<div class="kv"><span>Target</span><b>${eqs(p.t)}</b></div><div class="kv"><span>Hasil penjumlahanmu</span><b>${eqs(net)}</b></div><div class="kv"><span>ΔH total</span><b>${fmtH(dH)} kJ</b></div><div class="note" style="color:${ok ? C.ok : C.mute}">${ok ? `<b>Tepat!</b> ΔH reaksi target = ${fmtH(dH)} kJ. Zat yang muncul di kedua ruas saling menghilangkan.` : 'Belum sama dengan target. Lihat zat mana yang harus berada di kiri atau kanan, dan berapa koefisiennya.'}</div>`;
        root.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { st[+b.dataset.r].r = !st[+b.dataset.r].r; draw(); });
        root.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const [i, k] = b.dataset.k.split(':'); st[+i].k = +k; draw(); });
      }
      function load(i) { pi = i; st = P[i].e.map(() => ({ r: false, k: 1 })); root.querySelectorAll('[data-p]').forEach(b => b.classList.toggle('on', +b.dataset.p === i)); draw(); }
      root.innerHTML = `<div class="chips">${P.map((p, i) => `<button class="chip" data-p="${i}">${p.n}</button>`).join('')}</div><div class="sim-grid"><div id="eqs"></div><div class="sim-panel sim-out big" id="sum"></div></div>`;
      root.querySelectorAll('[data-p]').forEach(b => b.onclick = () => load(+b.dataset.p)); load(0); return () => { };
    },
  };

  // ===== XII-1c Energi ikatan =====
  S['XII-1c'] = {
    title: 'Energi Ikatan: Putus dan Bentuk', intro: 'Pilih reaksi, lalu tekan langkah demi langkah. Memutus ikatan memerlukan energi (naik), membentuk ikatan melepaskan energi (turun).',
    mount(root) {
      const BE = { 'H–H': 436, 'Cl–Cl': 242, 'H–Cl': 431, 'C–H': 413, 'O=O': 498, 'C=O': 799, 'O–H': 463, 'C=C': 614, 'C–C': 348, 'N≡N': 941, 'N–H': 391 };
      const RX = [
        { n: 'H₂ + Cl₂ → 2HCl', b: [['H–H', 1], ['Cl–Cl', 1]], f: [['H–Cl', 2]] },
        { n: '2H₂ + O₂ → 2H₂O', b: [['H–H', 2], ['O=O', 1]], f: [['O–H', 4]] },
        { n: 'CH₄ + 2O₂ → CO₂ + 2H₂O', b: [['C–H', 4], ['O=O', 2]], f: [['C=O', 2], ['O–H', 4]] },
        { n: 'C₂H₄ + H₂ → C₂H₆', b: [['C=C', 1], ['H–H', 1]], f: [['C–C', 1], ['C–H', 2]] },
        { n: 'N₂ + 3H₂ → 2NH₃', b: [['N≡N', 1], ['H–H', 3]], f: [['N–H', 6]] },
      ];
      let ri = 0, step = 0;
      root.innerHTML = `<div class="chips">${RX.map((r, i) => `<button class="chip ${i ? '' : 'on'}" data-i="${i}">${r.n}</button>`).join('')}</div><div class="sim-grid"><div class="sim-panel"><div class="btns"><button class="btn" id="nx">Langkah berikutnya</button><button class="btn ghost" id="rs">Ulangi</button></div><div class="sim-out" id="eo"></div></div><canvas class="sim-canvas" id="ec" style="height:340px"></canvas></div>`;
      function draw() {
        const r = RX[ri]; const Eb = r.b.reduce((a, x) => a + BE[x[0]] * x[1], 0), Ef = r.f.reduce((a, x) => a + BE[x[0]] * x[1], 0), dH = Eb - Ef;
        const { ctx, w, h } = fit(root.querySelector('#ec')); ctx.clearRect(0, 0, w, h); const top = Math.max(Eb, Ef) * 1.1; const Y = v => h - 40 - (v + Math.max(0, -dH) * 0 ) / top * (h - 80) * .9; const base = h * .55;
        const yR = base, yA = base - Eb / top * (h * .5), yP = base - dH / top * (h * .5);
        ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.font = '600 13px "Plus Jakarta Sans",sans-serif'; ctx.fillStyle = C.ink;
        const lvl = (x1, x2, y, t) => { ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke(); ctx.fillText(t, x1, y - 6); };
        lvl(30, w * .3, yR, 'Pereaksi');
        if (step >= 1) { lvl(w * .38, w * .62, yA, 'Atom-atom bebas'); ctx.strokeStyle = C.red; ctx.beginPath(); ctx.moveTo(w * .3, yR); ctx.lineTo(w * .38, yA); ctx.stroke(); ctx.fillStyle = C.red; ctx.fillText('+' + Eb + ' kJ (putus)', w * .2, (yR + yA) / 2); ctx.strokeStyle = C.ink; ctx.fillStyle = C.ink; }
        if (step >= 2) { lvl(w * .7, w - 30, yP, 'Produk'); ctx.strokeStyle = C.blue; ctx.beginPath(); ctx.moveTo(w * .62, yA); ctx.lineTo(w * .7, yP); ctx.stroke(); ctx.fillStyle = C.blue; ctx.fillText('−' + Ef + ' kJ (bentuk)', w * .63, (yA + yP) / 2 + 30); ctx.setLineDash([5, 4]); ctx.strokeStyle = C.mute; ctx.beginPath(); ctx.moveTo(w * .3, yR); ctx.lineTo(w * .7, yR); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = dH < 0 ? C.bad : C.a; ctx.font = '700 16px "Plus Jakarta Sans",sans-serif'; ctx.fillText('ΔH = ' + fmtH(dH) + ' kJ', w * .72, (yR + yP) / 2 + 6); }
        root.querySelector('#eo').innerHTML = `<table><tr><th>Ikatan putus</th><th>Energi</th></tr>${r.b.map(x => `<tr><td>${x[1]} × ${x[0]}</td><td>${x[1] * BE[x[0]]}</td></tr>`).join('')}<tr><th>Jumlah</th><th>${Eb}</th></tr></table>${step >= 2 ? `<table><tr><th>Ikatan terbentuk</th><th>Energi</th></tr>${r.f.map(x => `<tr><td>${x[1]} × ${x[0]}</td><td>${x[1] * BE[x[0]]}</td></tr>`).join('')}<tr><th>Jumlah</th><th>${Ef}</th></tr></table><div>ΔH = ${Eb} − ${Ef} = <b>${fmtH(dH)} kJ</b> (${dH < 0 ? 'eksoterm' : 'endoterm'})</div>` : `<div class="note">${step === 0 ? 'Tekan "Langkah berikutnya" untuk memutus ikatan pereaksi.' : 'Tekan lagi untuk membentuk ikatan produk.'}</div>`}<div class="note">Energi ikatan rata-rata (kJ/mol): ${Object.keys(BE).map(k => k + ' ' + BE[k]).join(', ')}</div>`;
      }
      root.querySelector('#nx').onclick = () => { step = Math.min(2, step + 1); draw(); }; root.querySelector('#rs').onclick = () => { step = 0; draw(); };
      root.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { ri = +b.dataset.i; step = 0; root.querySelectorAll('[data-i]').forEach(c => c.classList.toggle('on', c === b)); draw(); });
      draw(); return onResize(draw);
    },
  };

  // ===== XII-1d Nilai kalor bahan bakar =====
  S['XII-1d'] = {
    title: 'Pembanding Bahan Bakar Rumah Tangga', intro: 'Atur kebutuhan energi memasak per hari. Bandingkan massa bahan bakar yang diperlukan dan CO₂ yang dihasilkan, dengan memperhitungkan efisiensi kompor.',
    mount(root) {
      const F = [['LPG (propana-butana)', 50, 3.0, .55, '#2F6FD6'], ['Minyak tanah', 46, 3.15, .45, '#8E6C3A'], ['Kayu bakar', 16, 1.7, .15, '#7B5E3B'], ['Arang', 30, 3.3, .25, '#444'], ['Biogas (metana)', 55, 2.75, .55, '#2E9E5B'], ['Bioetanol', 30, 1.9, .5, '#D9A21B'], ['Hidrogen', 142, 0, .6, '#14798C']];
      root.innerHTML = `<div class="sim-grid"><div class="sim-panel">${slider('E', 'Energi yang diperlukan untuk memasak', 2000, 12000, 500, 5000, 'kJ/hari')}<div class="sim-out" id="fo"></div></div><canvas class="sim-canvas" id="fc" style="height:380px"></canvas></div>`;

        const { ctx, w, h } = fit(root.querySelector('#fc')); ctx.clearRect(0, 0, w, h); const mx = Math.max(...rows.map(r => r.m)), cx = Math.max(...rows.map(r => r.co2)); const lw = 150, bw = (w - lw - 30) / 2 - 10, rh = (h - 50) / rows.length;
        ctx.font = '600 13px "Plus Jakarta Sans",sans-serif'; ctx.fillStyle = C.ink; ctx.fillText('Massa bahan bakar (g)', lw, 18); ctx.fillText('CO₂ dihasilkan (g)', lw + bw + 20, 18);
        rows.forEach((r, i) => { const y = 32 + i * rh; ctx.fillStyle = C.ink; ctx.font = '12px "Plus Jakarta Sans",sans-serif'; ctx.fillText(r.n, 6, y + rh / 2); ctx.fillStyle = r.c; ctx.fillRect(lw, y + 4, r.m / mx * bw, rh - 10); ctx.fillStyle = '#9AA6B8'; ctx.fillRect(lw + bw + 20, y + 4, (r.co2 / cx) * bw || 1, rh - 10); ctx.fillStyle = C.ink; ctx.fillText(Math.round(r.m) + ' g', lw + r.m / mx * bw + 4 > lw + bw - 50 ? lw + 4 : lw + r.m / mx * bw + 4, y + rh / 2 + 2); ctx.fillText(Math.round(r.co2) + ' g', lw + bw + 24, y + rh / 2 + 2); });
        root.querySelector('#fo').innerHTML = `<table><tr><th>Bahan bakar</th><th>Nilai kalor (kJ/g)</th><th>Efisiensi kompor</th></tr>${rows.map(r => `<tr><td>${r.n}</td><td>${r.kal}</td><td>${Math.round(r.ef * 100)}%</td></tr>`).join('')}</table><div class="note">Massa = energi ÷ (efisiensi × nilai kalor). CO₂ dari kayu, biogas, dan bioetanol berasal dari tumbuhan yang menyerap CO₂ saat tumbuh, sehingga lebih ramah lingkungan bila sumbernya dikelola berkelanjutan. Asap kayu dan arang tetap berbahaya bagi pernapasan.</div>`;
      }
      root.querySelector('#E').addEventListener('input', up); up(); return onResize(up);
    },
  };

  // ===== XII-2b Biloks =====
  S['XII-2b'] = {
    title: 'Kalkulator Bilangan Oksidasi', intro: 'Pilih senyawa atau ion. Simulasi menuliskan langkah penentuan bilangan oksidasi unsur yang ditanyakan berdasarkan aturan biloks.',
    mount(root) {

      root.innerHTML = `<div class="chips">${L.map((x, i) => `<button class="chip ${i ? '' : 'on'}" data-i="${i}">${x[0]}</button>`).join('')}</div><div class="sim-panel sim-out big" id="bo" style="max-width:780px"></div>`;
      const sg = v => (v > 0 ? '+' : '') + v;

        const why = { K: 'logam golongan IA = +1', Na: 'logam golongan IA = +1', H: f === 'NaH' ? '' : 'H dalam senyawa nonlogam = +1', O: f === 'H₂O₂' ? '' : 'O umumnya = −2' };

      }
      root.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { root.querySelectorAll('[data-i]').forEach(c => c.classList.toggle('on', c === b)); up(+b.dataset.i); }); up(0); return () => { };
    },
  };

  // ===== XII-2c Penyetaraan redoks =====
  S['XII-2c'] = {
    title: 'Penyetaraan Redoks Langkah demi Langkah', intro: 'Pilih reaksi, lalu ikuti metode setengah reaksi satu langkah demi satu langkah. Coba tebak hasil setiap langkah sebelum menekan tombol.',

  S['XII-4b'] = {

        const locs = arr => arr.map(([p, g]) => [p, g]); const A = locs(subs).map(x => x[0]).sort((a, b) => a - b), B = subs.map(([p]) => n + 1 - p).sort((a, b) => a - b);
        let useB = false; for (let i = 0; i < A.length; i++) { if (A[i] !== B[i]) { useB = B[i] < A[i]; break; } if (i === A.length - 1) { const first = [...subs].sort((x, y) => nm[x[1]].localeCompare(nm[y[1]]))[0]; useB = (n + 1 - first[0]) < first[0]; } }
        const final = subs.map(([p, g]) => [useB ? n + 1 - p : p, g]);

        const name = Object.keys(groups).sort().map(k => { const ps = groups[k].sort((a, b) => a - b); return ps.join(',') + '-' + (ps.length === 2 ? 'di' : '') + k; }).join('-') + pre[n] + 'ana';

        const deg = Array(n + 1).fill(0); for (let i = 1; i <= n; i++) deg[i] = (i > 1) + (i < n); subs.forEach(([p]) => deg[p]++);
        ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + sp * (n - 1), y0); ctx.stroke();
        const used = {}; subs.forEach(([p, g], k) => { const dir = used[p] ? 1 : -1; used[p] = 1; const x = x0 + (p - 1) * sp; ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y0 + dir * 60 * g); ctx.stroke(); for (let j = 1; j <= g; j++) { const yy = y0 + dir * 60 * j; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, yy, 20, 0, 7); ctx.fill(); ctx.fillStyle = C.p; ctx.font = '700 13px "Plus Jakarta Sans",sans-serif'; const t = j === g ? 'CH₃' : 'CH₂'; ctx.fillText(t, x - ctx.measureText(t).width / 2, yy + 5); } });
        for (let i = 1; i <= n; i++) { const x = x0 + (i - 1) * sp; const H = 4 - deg[i]; const t = 'C' + (H > 0 ? 'H' + (H > 1 ? sub(H) : '') : ''); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y0, 22, 0, 7); ctx.fill(); ctx.fillStyle = C.ink; ctx.font = '700 14px "Plus Jakarta Sans",sans-serif'; ctx.fillText(t, x - ctx.measureText(t).width / 2, y0 + 5); ctx.fillStyle = C.a; ctx.font = '11px "Plus Jakarta Sans",sans-serif'; const lab = String(useB ? n + 1 - i : i); ctx.fillText(lab, x - 3, y0 + (Object.keys(used).includes(String(i)) ? 40 : 38) * (subs.some(s => s[0] === i) ? 0 : 1) + (subs.some(s => s[0] === i) ? -30 : 0)); }

  // ===== XII-4c Distilasi bertingkat =====
  S['XII-4c'] = {
    title: 'Menara Distilasi Bertingkat', intro: 'Klik setiap tingkat menara (atau geser suhu) untuk melihat fraksi minyak bumi yang mengembun, jumlah atom karbon, dan kegunaannya.',
    mount(root) {

      root.innerHTML = `<div class="sim-grid"><div class="sim-panel">${slider('T', 'Suhu tingkat menara', 0, 600, 5, 105, '°C')}<div class="sim-out big" id="do"></div></div><canvas class="sim-canvas" id="dc" style="height:420px;cursor:pointer"></canvas></div>`;

      function draw() {

        const cx = w * .35, cw = 120, top = 20, bot = h - 60, th = (bot - top) / F.length;

        F.forEach((f, i) => { const y = top + i * th; ctx.strokeStyle = C.mute; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx - cw / 2, y + th); ctx.lineTo(cx + cw / 2, y + th); ctx.stroke(); const on = f === sel; ctx.fillStyle = on ? f[5] : '#E6E9EF'; ctx.fillRect(cx + cw / 2, y + th / 2 - 6, 70, 12); ctx.fillStyle = on ? C.ink : C.mute; ctx.font = (on ? '700 ' : '') + '13px "Plus Jakarta Sans",sans-serif'; ctx.fillText(f[0], cx + cw / 2 + 78, y + th / 2 + 4); ctx.font = '11px "Plus Jakarta Sans",sans-serif'; ctx.fillStyle = C.mute; ctx.fillText(f[1], cx - cw / 2 - 70, y + th / 2 + 4); });
        for (let i = 0; i < 14; i++) { const yy = bot - ((t * 1.2 + i * 37) % (bot - top)); ctx.fillStyle = 'rgba(120,120,140,.35)'; ctx.beginPath(); ctx.arc(cx - 40 + (i * 23) % 80, yy, 4, 0, 7); ctx.fill(); }
        ctx.fillStyle = '#1B2A4A'; ctx.fillRect(cx - 50, bot, 100, 24); ctx.fillStyle = '#fff'; ctx.font = '600 12px "Plus Jakarta Sans",sans-serif'; ctx.fillText('minyak mentah', cx - 42, bot + 16); ctx.fillStyle = C.red; ctx.fillText('dipanaskan ± 400 °C', cx - 56, bot + 42);
        root.querySelector('#do').innerHTML = `<div class="kv"><span>Fraksi</span><b>${sel[0]}</b></div><div class="kv"><span>Titik didih</span><b>${sel[1]}</b></div><div class="kv"><span>Jumlah atom C</span><b>${sel[2]}</b></div><div class="kv"><span>Kegunaan</span><b>${sel[3]}</b></div><div class="note">Uap naik dan mendingin. Fraksi dengan rantai C lebih panjang memiliki gaya London lebih kuat sehingga titik didihnya lebih tinggi dan mengembun di bagian bawah menara.</div>`;

  // ===== XII-4d Bilangan oktan =====
  S['XII-4d'] = {
    title: 'Bilangan Oktan dan Ketukan Mesin', intro: 'Campurkan isooktana dan n-heptana atau pilih BBM, lalu pilih jenis mesin. Bahan bakar yang bilangan oktannya terlalu rendah membuat mesin mengetuk (knocking).',
    mount(root) {
      const ENG = { motor: ['Sepeda motor standar (kompresi ± 9:1)', 88], mobil: ['Mobil modern (kompresi ± 11:1)', 92], turbo: ['Mesin turbo/performa tinggi', 98] };
      root.innerHTML = `<div class="sim-grid"><div class="sim-panel">${slider('iso', 'Isooktana dalam campuran', 0, 100, 1, 90, '%')}<div class="chips"><button class="chip" data-o="90">Pertalite (RON 90)</button><button class="chip" data-o="92">Pertamax (RON 92)</button><button class="chip" data-o="98">Pertamax Turbo (RON 98)</button></div><label class="sim-ctl"><span>Jenis mesin</span><select id="e">${Object.keys(ENG).map(k => `<option value="${k}">${ENG[k][0]}</option>`).join('')}</select></label><div class="sim-out big" id="oo"></div></div><canvas class="sim-canvas" id="oc" style="height:320px"></canvas></div>`;
      let raf, t = 0;
      function draw() {
        const ron = +root.querySelector('#iso').value; root.querySelector('#iso-v').textContent = ron; const need = ENG[root.querySelector('#e').value][1]; const knock = ron < need;
        const { ctx, w, h } = fit(root.querySelector('#oc')); ctx.clearRect(0, 0, w, h); const cx = w / 2, ph = Math.sin(t / 10); const shake = knock ? Math.sin(t * 1.7) * 4 : 0;

        if (ph < -.85) { ctx.fillStyle = knock ? 'rgba(214,69,69,.85)' : 'rgba(255,170,40,.75)'; ctx.beginPath(); ctx.arc(cx + shake, 60, knock ? 34 : 22, 0, 7); ctx.fill(); }
        if (knock && Math.sin(t / 3) > .6) { ctx.fillStyle = C.bad; ctx.font = '800 22px "Plus Jakarta Sans",sans-serif'; ctx.fillText('TUK! TUK!', cx + 80, 90); }
        ctx.fillStyle = C.ink; ctx.font = '600 13px "Plus Jakarta Sans",sans-serif'; ctx.fillText('silinder mesin', cx - 46, 22);

      }
      root.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { root.querySelector('#iso').value = b.dataset.o; });
      function loop() { t++; draw(); raf = requestAnimationFrame(loop); }
      loop(); return () => cancelAnimationFrame(raf);
    },
  };

  // ===== XII-5b Tata nama turunan =====
  S['XII-5b'] = {
    title: 'Penamaan Senyawa Turunan Alkana', intro: 'Pilih gugus fungsi, jumlah atom C, dan posisi gugus. Amati rumus struktur, nama IUPAC, nama trivial, dan isomer fungsinya.',
    mount(root) {
      const pre = ['', 'met', 'et', 'prop', 'but', 'pent', 'heks'];
      const G = { ol: ['Alkohol (–OH)', 1, true], al: ['Aldehida (–CHO)', 1, false], on: ['Keton (–CO–)', 3, true], oat: ['Asam karboksilat (–COOH)', 1, false], kl: ['Haloalkana (–Cl)', 1, true] };
      const triv = { 'ol1': 'metil alkohol', 'ol2': 'etil alkohol (alkohol)', 'al1': 'formaldehida (formalin)', 'al2': 'asetaldehida', 'on3': 'aseton', 'oat1': 'asam format (semut)', 'oat2': 'asam asetat (cuka)', 'oat4': 'asam butirat', 'kl1': 'metil klorida' };
      const iso = { ol: 'eter (alkoksialkana)', al: 'keton', on: 'aldehida', oat: 'ester', kl: '–' };
      root.innerHTML = `<div class="chips">${Object.keys(G).map((k, i) => `<button class="chip ${i ? '' : 'on'}" data-g="${k}">${G[k][0]}</button>`).join('')}</div><div class="sim-grid"><div class="sim-panel">${slider('n', 'Jumlah atom C', 1, 6, 1, 3)}${slider('p', 'Posisi gugus pada C ke-', 1, 6, 1, 1)}<div class="sim-out big" id="go"></div></div><canvas class="sim-canvas" id="gc" style="height:240px"></canvas></div>`;
      let g = 'ol';
      function up() {
        const [lbl, nmin, haspos] = G[g]; const ns = root.querySelector('#n'); ns.min = nmin; let n = Math.max(nmin, +ns.value); ns.value = n; const ps = root.querySelector('#p'); ps.disabled = !haspos;
        let p = +ps.value; if (g === 'on') { p = Math.max(2, Math.min(n - 1, p)); } else if (haspos) p = Math.max(1, Math.min(n, p)); else p = 1; if (haspos && p > n + 1 - p) p = n + 1 - p; ps.max = n; ps.value = p; root.querySelector('#n-v').textContent = n; root.querySelector('#p-v').textContent = haspos ? p : '–';
        const base = pre[n] + 'an'; let name;
        if (g === 'ol') name = (n >= 3 ? p + '-' : '') + base + 'ol'; else if (g === 'al') name = base + 'al'; else if (g === 'on') name = (n >= 5 ? p + '-' : '') + base + 'on'; else if (g === 'oat') name = 'asam ' + base + 'oat'; else name = (n >= 3 ? p + '-' : '') + 'kloro' + pre[n] + 'ana';
        const atoms = []; for (let i = 1; i <= n; i++) { let t; const ends = (i === 1) + (i === n); let H = n === 1 ? 4 : 4 - (2 - ends);
          if (g === 'al' && i === n) t = n === 1 ? 'HCHO' : 'CHO'; else if (g === 'oat' && i === n) t = n === 1 ? 'HCOOH' : 'COOH'; else if (g === 'on' && i === p) t = 'CO'; else if ((g === 'ol' || g === 'kl') && i === p) { H -= 1; t = 'C' + (H ? 'H' + (H > 1 ? sub(H) : '') : '') + (g === 'ol' ? '(OH)' : '(Cl)'); if (n === 1) t = g === 'ol' ? 'CH₃OH' : 'CH₃Cl'; } else t = 'C' + 'H' + (H > 1 ? sub(H) : ''); atoms.push(t); }
        const struct = atoms.join('–');
        const Cc = n, H = g === 'ol' || g === 'kl' ? 2 * n + 1 : g === 'oat' ? 2 * n : 2 * n, O = g === 'oat' ? 2 : g === 'kl' ? 0 : 1; const formula = 'C' + (Cc > 1 ? sub(Cc) : '') + 'H' + sub(g === 'ol' ? 2 * n + 2 : g === 'kl' ? 2 * n + 1 : 2 * n) + (O ? 'O' + (O > 1 ? sub(O) : '') : '') + (g === 'kl' ? 'Cl' : '');
        const { ctx, w, h } = fit(root.querySelector('#gc')); ctx.clearRect(0, 0, w, h); ctx.fillStyle = C.ink; ctx.font = '700 22px "Plus Jakarta Sans",sans-serif'; const tw = ctx.measureText(struct).width; const fs = tw > w - 40 ? Math.floor(22 * (w - 40) / tw) : 22; ctx.font = `700 ${fs}px "Plus Jakarta Sans",sans-serif`; ctx.fillText(struct, (w - ctx.measureText(struct).width) / 2, h / 2);
        ctx.font = '13px "Plus Jakarta Sans",sans-serif'; ctx.fillStyle = C.mute; ctx.fillText('rumus struktur singkat', w / 2 - 70, h / 2 + 34);
        root.querySelector('#go').innerHTML = `<div class="kv"><span>Nama IUPAC</span><b style="font-size:1.15rem">${name}</b></div><div class="kv"><span>Nama trivial</span><b>${triv[g + n] || '–'}</b></div><div class="kv"><span>Rumus molekul</span><b>${formula}</b></div><div class="kv"><span>Isomer fungsi dengan</span><b>${n >= 2 || g === 'oat' ? iso[g] : '–'}</b></div><div class="note">${g === 'on' && n < 3 ? 'Keton minimal memiliki 3 atom C.' : g === 'al' || g === 'oat' ? 'Gugus –CHO dan –COOH selalu di ujung rantai (C nomor 1), sehingga nomor posisinya tidak ditulis.' : 'Penomoran dimulai dari ujung yang paling dekat dengan gugus fungsi.'}</div>`;
      }
      root.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { g = b.dataset.g; root.querySelectorAll('[data-g]').forEach(c => c.classList.toggle('on', c === b)); up(); });
      root.querySelectorAll('input').forEach(e => e.addEventListener('input', up)); up(); return onResize(up);
    },
  };

  // ===== XII-5c Oksidasi alkohol =====
  S['XII-5c'] = {
    title: 'Oksidasi Alkohol dengan Kalium Dikromat', intro: 'Pilih alkohol, lalu tambahkan larutan K₂Cr₂O₇ dalam suasana asam dan panaskan. Warna jingga berubah menjadi hijau jika alkohol teroksidasi.',
    mount(root) {

      root.innerHTML = `<div class="sim-grid"><div class="sim-panel"><label class="sim-ctl"><span>Alkohol</span><select id="a">${Object.keys(A).map(k => `<option value="${k}">${A[k][0]}</option>`).join('')}</select></label><div class="btns wrap"><button class="btn" id="ox">Tambah K₂Cr₂O₇/H⁺ dan panaskan</button><button class="btn ghost" id="rs">Ulangi</button></div><div class="sim-out" id="xo"></div></div><canvas class="sim-canvas" id="xc" style="height:300px"></canvas></div>`;
      let stage = 0, prog = 0, raf;
      function info() { const a = A[root.querySelector('#a').value]; const steps = a[2]; root.querySelector('#xo').innerHTML = `<div class="kv"><span>Rumus</span><b>${a[1]}</b></div>${stage === 0 ? '<div class="note">Belum direaksikan.</div>' : steps.length === 0 ? `<div style="color:${C.bad}"><b>Tidak teroksidasi.</b></div><div class="note">Alkohol tersier tidak memiliki atom H pada atom C yang mengikat –OH, sehingga warna tetap jingga.</div>` : `<div><b>Hasil oksidasi tahap 1:</b> ${steps[0]}</div>${steps[1] ? (stage >= 2 ? `<div><b>Oksidasi lanjut:</b> ${steps[1]}</div>` : '<div class="note">Alkohol primer dapat dioksidasi lebih lanjut. Tekan tombol sekali lagi.</div>') : '<div class="note">Keton tidak dapat dioksidasi lebih lanjut.</div>'}<div class="note">Cr₂O₇²⁻ (jingga) tereduksi menjadi Cr³⁺ (hijau). Reaksi ini dipakai pada alat uji napas pengemudi.</div>`}`; }
      function draw() { const a = A[root.querySelector('#a').value]; const { ctx, w, h } = fit(root.querySelector('#xc')); ctx.clearRect(0, 0, w, h); const reacts = a[2].length > 0 && stage > 0; const col = reacts ? mix('#F39C12', '#27AE60', Math.min(1, prog)) : (stage > 0 ? '#F39C12' : '#F5F8FC'); tube(ctx, w / 2 - 30, 20, 60, 230, col); if (stage > 0) { for (let i = 0; i < 3; i++) { ctx.fillStyle = 'rgba(255,150,40,.7)'; ctx.beginPath(); ctx.ellipse(w / 2, 280 - i * 4, 18 - i * 5, 12, 0, 0, 7); ctx.fill(); } } ctx.fillStyle = C.mute; ctx.font = '12px "Plus Jakarta Sans",sans-serif'; ctx.fillText(stage ? 'dipanaskan' : 'alkohol', w / 2 + 40, 240); if (stage > 0 && prog < 1) prog += .01; }
      root.querySelector('#ox').onclick = () => { const a = A[root.querySelector('#a').value]; stage = Math.min(a[2].length > 1 ? 2 : 1, stage + 1); if (stage === 1) prog = 0; info(); };
      root.querySelector('#rs').onclick = () => { stage = 0; prog = 0; info(); }; root.querySelector('#a').onchange = () => { stage = 0; prog = 0; info(); };
      const loop = () => { draw(); raf = requestAnimationFrame(loop); }; info(); loop(); return () => cancelAnimationFrame(raf);
    },
  };

  // ===== XII-5d Esterifikasi =====
  S['XII-5d'] = {
    title: 'Pabrik Aroma: Reaksi Esterifikasi', intro: 'Pilih asam karboksilat dan alkohol. Simulasi menuliskan persamaan reaksi, nama ester yang terbentuk, dan aromanya (jika dikenal).',

      const AL = { met: ['metanol', 'CH₃', 'metil'], et: ['etanol', 'C₂H₅', 'etil'], prop: ['1-propanol', 'C₃H₇', 'propil'], pent: ['1-pentanol', 'C₅H₁₁', 'pentil'], iso: ['3-metil-1-butanol', 'CH₂CH₂CH(CH₃)₂', 'isoamil (3-metilbutil)'], okt: ['1-oktanol', 'C₈H₁₇', 'oktil'] };

      root.innerHTML = `<div class="sim-grid"><div class="sim-panel"><label class="sim-ctl"><span>Asam karboksilat</span><select id="c">${Object.keys(AC).map(k => `<option value="${k}" ${k === 'but' ? 'selected' : ''}>${AC[k][0]}</option>`).join('')}</select></label><label class="sim-ctl"><span>Alkohol</span><select id="l">${Object.keys(AL).map(k => `<option value="${k}" ${k === 'et' ? 'selected' : ''}>${AL[k][0]}</option>`).join('')}</select></label><div class="sim-out big" id="eo"></div></div><canvas class="sim-canvas" id="ec" style="height:260px"></canvas></div>`;

  // ===== XII-6b Resonansi benzena =====
  S['XII-6b'] = {
    title: 'Kestabilan Benzena dan Energi Resonansi', intro: 'Amati dua struktur Kekulé yang bergantian dan model elektron terdelokalisasi. Grafik membandingkan kalor hidrogenasi untuk menunjukkan energi resonansi.',
    mount(root) {
      root.innerHTML = `<div class="chips"><button class="chip on" data-m="k">Struktur Kekulé bergantian</button><button class="chip" data-m="d">Model delokalisasi</button></div><div class="sim-grid"><canvas class="sim-canvas" id="rc" style="height:300px"></canvas><canvas class="sim-canvas" id="hc" style="height:300px"></canvas></div><div class="sim-out" style="margin-top:10px"><div>Jika benzena memiliki 3 ikatan rangkap biasa, kalor hidrogenasinya diperkirakan 3 × (−120) = −360 kJ/mol. Kenyataannya hanya −208 kJ/mol.</div><div>Selisih <b>152 kJ/mol</b> adalah <b>energi resonansi</b>: benzena lebih stabil sehingga cenderung mengalami substitusi, bukan adisi.</div></div>`;
      let mode = 'k', t = 0, raf;
      function hex(ctx, cx, cy, R, dbl) { const p = [...Array(6)].map((_, i) => [cx + R * Math.cos(Math.PI / 6 + i * Math.PI / 3), cy + R * Math.sin(Math.PI / 6 + i * Math.PI / 3)]); ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.beginPath(); p.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.closePath(); ctx.stroke(); if (dbl !== null) { for (let i = dbl; i < 6; i += 2) { const a = p[i], b = p[(i + 1) % 6]; const ix = cx + (a[0] - cx) * .78, iy = cy + (a[1] - cy) * .78, jx = cx + (b[0] - cx) * .78, jy = cy + (b[1] - cy) * .78; ctx.beginPath(); ctx.moveTo(ix, iy); ctx.lineTo(jx, jy); ctx.stroke(); } } p.forEach(q => { ctx.fillStyle = C.mute; ctx.font = '12px "Plus Jakarta Sans",sans-serif'; ctx.fillText('H', cx + (q[0] - cx) * 1.35 - 4, cy + (q[1] - cy) * 1.35 + 4); }); }
      function draw() {
        const { ctx, w, h } = fit(root.querySelector('#rc')); ctx.clearRect(0, 0, w, h); const cx = w / 2, cy = h / 2, R = Math.min(w, h) * .3;
        if (mode === 'k') { const a = (Math.sin(t / 50) + 1) / 2; ctx.globalAlpha = 1 - a; hex(ctx, cx, cy, R, 0); ctx.globalAlpha = a; hex(ctx, cx, cy, R, 1); ctx.globalAlpha = 1; ctx.fillStyle = C.mute; ctx.fillText('⇄ dua struktur resonansi', 12, h - 12); }
        else { hex(ctx, cx, cy, R, null); ctx.strokeStyle = C.a; ctx.lineWidth = 3; ctx.setLineDash([8, 6]); ctx.lineDashOffset = -t / 2; ctx.beginPath(); ctx.arc(cx, cy, R * .62, 0, 7); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = C.mute; ctx.font = '12px "Plus Jakarta Sans",sans-serif'; ctx.fillText('6 elektron π tersebar merata di seluruh cincin', 12, h - 12); }
        const g = fit(root.querySelector('#hc')); g.ctx.clearRect(0, 0, g.w, g.h); const D = [['Sikloheksena', -120, '#9AA6B8'], ['Sikloheksatriena (hipotetis)', -360, '#D64545'], ['Benzena (nyata)', -208, '#14798C']]; const bw = (g.w - 80) / 3;
        g.ctx.font = '12px "Plus Jakarta Sans",sans-serif'; D.forEach((d, i) => { const x = 50 + i * bw, hh = -d[1] / 380 * (g.h - 80); g.ctx.fillStyle = d[2]; g.ctx.fillRect(x + 10, 30, bw - 30, hh); g.ctx.fillStyle = C.ink; g.ctx.fillText(d[1] + ' kJ/mol', x + 14, 30 + hh + 16); const words = d[0].split(' '); words.forEach((wd, j) => g.ctx.fillText(wd, x + 10, g.h - 34 + j * 14)); });

        const y1 = 30 + 208 / 380 * (g.h - 80), y2 = 30 + 360 / 380 * (g.h - 80); g.ctx.strokeStyle = C.p; g.ctx.setLineDash([4, 4]); g.ctx.beginPath(); g.ctx.moveTo(50 + 2 * bw + 10, y1); g.ctx.lineTo(50 + bw + 10, y1); g.ctx.stroke(); g.ctx.setLineDash([]); g.ctx.fillStyle = C.p; g.ctx.font = '700 13px "Plus Jakarta Sans",sans-serif'; g.ctx.fillText('152 kJ/mol', 50 + bw + bw / 2 - 20, (y1 + y2) / 2);
      }
      root.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; root.querySelectorAll('[data-m]').forEach(c => c.classList.toggle('on', c === b)); });
      const loop = () => { t++; draw(); raf = requestAnimationFrame(loop); }; loop(); return () => cancelAnimationFrame(raf);
    },
  };

  // ===== XII-6c Reaksi substitusi =====
  S['XII-6c'] = {
    title: 'Reaksi Substitusi Benzena', intro: 'Pilih jenis reaksi. Amati atom H pada cincin benzena digantikan oleh gugus baru, serta persamaan reaksi dan kegunaan produknya.',
    mount(root) {
      const R = { nit: ['Nitrasi', 'HNO₃ pekat', 'H₂SO₄ pekat', 'NO₂', 'H₂O', 'Nitrobenzena', 'Bahan baku anilina dan zat warna'], hal: ['Halogenasi', 'Cl₂', 'FeCl₃', 'Cl', 'HCl', 'Klorobenzena', 'Bahan baku pestisida dan fenol'], sul: ['Sulfonasi', 'H₂SO₄ pekat', 'dipanaskan', 'SO₃H', 'H₂O', 'Asam benzenasulfonat', 'Bahan baku deterjen dan obat sulfa'], alk: ['Alkilasi Friedel-Crafts', 'CH₃Cl', 'AlCl₃', 'CH₃', 'HCl', 'Toluena', 'Pelarut dan bahan baku TNT'] };
      root.innerHTML = `<div class="chips">${Object.keys(R).map((k, i) => `<button class="chip ${i ? '' : 'on'}" data-r="${k}">${R[k][0]}</button>`).join('')}</div><div class="sim-grid"><div class="sim-panel sim-out big" id="so"></div><canvas class="sim-canvas" id="sc" style="height:300px"></canvas></div>`;
      let k = 'nit', t = 0, raf;
      function draw() {
        const r = R[k]; const { ctx, w, h } = fit(root.querySelector('#sc')); ctx.clearRect(0, 0, w, h); const cx = w * .4, cy = h / 2, Rr = Math.min(w, h) * .2; const a = Math.min(1, (t % 240) / 120);
        const p = [...Array(6)].map((_, i) => [cx + Rr * Math.cos(-Math.PI / 2 + i * Math.PI / 3), cy + Rr * Math.sin(-Math.PI / 2 + i * Math.PI / 3)]);
        ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.beginPath(); p.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.closePath(); ctx.stroke(); ctx.beginPath(); ctx.arc(cx, cy, Rr * .6, 0, 7); ctx.lineWidth = 2; ctx.stroke();
        p.forEach((q, i) => { const ex = cx + (q[0] - cx) * 1.45, ey = cy + (q[1] - cy) * 1.45; if (i === 1) return; ctx.fillStyle = C.mute; ctx.font = '13px "Plus Jakarta Sans",sans-serif'; ctx.fillText('H', ex - 4, ey + 4); });
        const q = p[1]; const hx = cx + (q[0] - cx) * 1.45 + a * 120, hy = cy + (q[1] - cy) * 1.45 - a * 60; ctx.fillStyle = C.bad; ctx.globalAlpha = 1 - a * .3; ctx.font = '700 14px "Plus Jakarta Sans",sans-serif'; ctx.fillText('H', hx, hy); ctx.globalAlpha = 1;
        const gx = cx + (q[0] - cx) * 1.6 + (1 - a) * 160, gy = cy + (q[1] - cy) * 1.6 + (1 - a) * 80; ctx.fillStyle = C.a; ctx.font = '800 18px "Plus Jakarta Sans",sans-serif'; ctx.fillText(r[3].replace(/(\d)/g, d => SUBD[+d]), gx, gy); ctx.strokeStyle = C.a; ctx.lineWidth = 2.5; if (a > .95) { ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(cx + (q[0] - cx) * 1.4, cy + (q[1] - cy) * 1.4); ctx.stroke(); }
        if (a > .95) { ctx.fillStyle = C.ink; ctx.font = '700 15px "Plus Jakarta Sans",sans-serif'; ctx.fillText(r[5], cx - 50, h - 18); }
        t++;
      }
      function info() { const r = R[k]; root.querySelector('#so').innerHTML = `<div class="kv"><span>Pereaksi</span><b>${r[1]}</b></div><div class="kv"><span>Katalis/kondisi</span><b>${r[2]}</b></div><div>C₆H₆ + ${r[1].split(' ')[0]} → C₆H₅–${r[3].replace(/(\d)/g, d => SUBD[+d])} + ${r[4]}</div><div class="kv"><span>Produk</span><b>${r[5]}</b></div><div class="kv"><span>Kegunaan</span><b>${r[6]}</b></div><div class="note">Pada substitusi, cincin aromatik tetap utuh sehingga kestabilannya terjaga.</div>`; }
      root.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { k = b.dataset.r; t = 0; root.querySelectorAll('[data-r]').forEach(c => c.classList.toggle('on', c === b)); info(); });
      const loop = () => { draw(); raf = requestAnimationFrame(loop); }; info(); loop(); return () => cancelAnimationFrame(raf);
    },
  };

  window.SIM_LIST = Object.assign(window.SIM_LIST || {}, {
    'XII-1': ['XII-1', 'XII-1b', 'XII-1c', 'XII-1d'],
    'XII-2': ['XII-2b', 'XII-2c', 'XII-2', 'XII-2d'],
    'XII-3': ['XII-3b', 'XII-3', 'XII-3c'],
    'XII-4': ['XII-4', 'XII-4b', 'XII-4c', 'XII-4d'],
    'XII-5': ['XII-5b', 'XII-5', 'XII-5c', 'XII-5d'],
    'XII-6': ['XII-6b', 'XII-6', 'XII-6c'],
  });
})();

<script>/* Aplikasi halaman kelas: presentasi bergambar, simulasi (beberapa per bab), kuis, panduan guru */
(function () {
  const D = window.KELAS;
  const $ = (s, r = document) => r.querySelector(s);
  let cur = null, tab = 'presentasi', slideI = 0, slides = [], cleanup = null, simSel = null, shownSim = null;
  const TABS = [['presentasi', 'Presentasi'], ['simulasi', 'Simulasi'], ['kuis', 'Kuis'], ['panduan', 'Panduan Guru & LKPD']];
  const TAGN = { M: 'Memahami', A: 'Mengaplikasi', R: 'Merefleksi' };
  const simsOf = b => (window.SIM_LIST && window.SIM_LIST[b.kode]) || [b.kode];

  function side() {
    const el = $('#side'); let html = '';
    [1, 2].forEach(s => {
      html += `<h2>Semester ${s}</h2><div class="grid">`;
      D.bab.filter(b => b.sem === s).forEach(b => { html += `<button class="tile" data-k="${b.kode}" aria-label="Bab ${b.no}: ${b.judul}"><span class="z">${b.no}</span><span class="ms">${b.jp} JP</span><span class="sym">${b.sym}</span><span class="nm">${b.judul}</span></button>`; });

    });
    el.innerHTML = html;
    el.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => go(t.dataset.k, tab)));
  }

  // ---------- slides ----------
  const fig = (im, cls = '') => im ? `<figure class="ph ${cls}"><img data-f="${im.f}" data-u="${im.url}" alt="${im.alt}" onerror="this.parentNode.classList.add('noimg')"><figcaption>${im.cap ? '<span>' + im.cap + '</span>' : ''}<a href="${im.src}" target="_blank" rel="noopener">Foto: Wikimedia Commons</a></figcaption></figure>` : '';
  const simBtn = (id, label) => id && SIMS[id] ? `<p><button class="btn" data-sim="${id}">${label || 'Coba simulasi: ' + SIMS[id].title}</button></p>` : '';
  function buildSlides(b) {
    if (!b.slides) return autoSlides(b);
    return b.slides.map(s => {
      const body = Array.isArray(s.body) ? `<ul>${s.body.map(x => `<li>${x}</li>`).join('')}</ul>` : (s.body ? `<p class="lead">${s.body}</p>` : '');
      if (s.lay === 'hero') return { cls: 'bleed', html: `<div class="slide hero">${fig(s.img, 'bg')}<div class="hero-txt"><p class="kicker">${s.k || ''}</p><h3>${s.t}</h3>${body}${simBtn(s.sim)}</div></div>` };
      if (s.lay === 'split' || s.lay === 'splitR') return { cls: 'bleed', html: `<div class="slide split ${s.lay === 'splitR' ? 'rev' : ''}">${fig(s.img)}<div class="txt"><p class="kicker">${s.k || 'Materi'}</p><h3>${s.t}</h3>${s.html || body}${simBtn(s.sim)}</div></div>` };
      if (s.lay === 'gallery') return { cls: '', html: `<div class="slide gallery"><p class="kicker">${s.k || ''}</p><h3>${s.t}</h3><div class="gal">${s.imgs.map(im => fig(im)).join('')}</div>${s.html ? `<div class="gal-txt">${s.html}</div>` : body}${simBtn(s.sim)}</div>` };
      if (s.lay === 'contoh') return { cls: '', html: `<div class="slide"><p class="kicker">Contoh soal</p><h3>Ayo hitung bersama</h3><p class="lead">${s.q}</p><div class="reveal"><button class="btn ghost" data-rev>Tampilkan pembahasan</button><div class="ans">${s.a}</div></div></div>` };
      if (s.lay === 'refleksi') return { cls: '', html: `<div class="slide"><p class="kicker">Merefleksi</p><h3>Refleksi 3–2–1</h3><ol><li>Tuliskan <b>3</b> hal yang kamu pelajari dari bab ini.</li><li>Tuliskan <b>2</b> hal yang menurutmu menarik atau bermanfaat.</li><li>Tuliskan <b>1</b> pertanyaan yang masih ingin kamu ketahui.</li></ol><p class="lead" style="margin-top:1em"><b>Alur konsep:</b> ${b.rangkuman}</p><p><button class="btn" data-go="kuis">Kerjakan kuis</button> <button class="btn ghost" data-go="simulasi">Buka semua simulasi</button></p></div>` };
      return { cls: '', html: `<div class="slide"><p class="kicker">${s.k || 'Materi'}</p><h3>${s.t}</h3>${s.html || body}${simBtn(s.sim)}</div>` };
    }).concat([{ cls: '', html: `<div class="slide"><p class="kicker">Tujuan pembelajaran bab ini</p><h3>Sudahkah kita mencapainya?</h3><ul>${b.tp.map(t => `<li><b>${t.k}</b> ${t.t}</li>`).join('')}</ul></div>` }]);
  }
  function autoSlides(b) {
    const S = [];
    S.push(`<div class="slide cover"><div class="big-no">${b.no}</div><p class="kicker">Kimia Kelas ${D.kelas}, Semester ${b.sem}</p><h3>${b.judul}</h3><p>${b.topik}</p></div>`);

    S.push(`<div class="slide"><p class="kicker">Yang akan kita capai</p><h3>Tujuan pembelajaran</h3><ul>${b.tp.map(t => `<li><b>${t.k}</b> ${t.t}</li>`).join('')}</ul></div>`);
    b.materi.forEach(m => S.push(`<div class="slide"><p class="kicker">Materi</p><h3>${m.h}</h3>${m.html}</div>`));

    return S.map(h => ({ cls: '', html: h }));
  }
  function renderDeck(root) {

    const sc = () => { $('#sc', root).innerHTML = `<span>Terjawab ${ans}/${b.quiz.length}</span><span>Benar <b>${right}</b></span><span>Nilai <b>${Math.round(right / b.quiz.length * 100)}</b></span>${ans === b.quiz.length ? `<span>${right / b.quiz.length >= .66 ? 'Tuntas. Pertahankan!' : 'Pelajari lagi bagian yang salah, lalu ulangi.'}</span>` : ''}`; };

        ans++; const ex = qe.querySelector('.ex'); ex.hidden = false; ex.innerHTML = `<b style="color:${j === k ? 'var(--ok)' : 'var(--bad)'}">${j === k ? 'Benar.' : 'Belum tepat. Jawaban: ' + q.a + '.'}</b> ${q.b}`; sc();
      }));

    $('#qr', root).onclick = () => renderQuiz(root, b); sc();
  }

  // ---------- guide ----------
  function renderGuide(root, b) {
    const L = b.lkpd;
    root.innerHTML = `<div class="panel"><h3>Rencana pertemuan (${b.pertemuan.length + 1} pertemuan, ${b.jp} JP)</h3>
      ${b.pertemuan.map((m, i) => `<details class="meet"><summary>Pertemuan ${i + 1} (${m.jp} JP), TP ${m.tp}: ${m.sub}</summary><p><b>Pemantik:</b> ${m.aps}</p><ol>${m.inti.map(x => `<li><span class="tag ${x.tag}">${TAGN[x.tag]}</span>${x.t}</li>`).join('')}</ol><p><b>Asesmen formatif:</b> ${m.form}</p></details>`).join('')}
      <details class="meet"><summary>Pertemuan ${b.pertemuan.length + 1} (2 JP): asesmen sumatif bab</summary><p>Peserta didik mengerjakan 8 soal pilihan ganda dan 2 soal uraian, dilanjutkan umpan balik, remedial, dan pengayaan.</p></details>

      <p><b>Keselamatan kerja</b></p><ul>${L.keselamatan.map(x => `<li>${x}</li>`).join('')}</ul>
      <p><b>Langkah kerja</b></p><ol>${L.langkah.map(x => `<li>${x}</li>`).join('')}</ol>
      <p><b>Pertanyaan analisis</b></p><ol>${L.pertanyaan.map(x => `<li>${x}</li>`).join('')}</ol>

  side();
  const [k0, t0, s0] = location.hash.slice(1).split('/'); if (s0) simSel = s0; go(k0 || D.bab[0].kode, t0 || 'presentasi');
