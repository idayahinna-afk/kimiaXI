<script>window.KELAS={"kelas":"XII","bab":[{"kode":"XII-1","no":1,"sem":1,"jp":30,"judul":"Termokimia","sym":"Tk","topik":"Energi di balik reaksi: dari kompor dapur hingga energi terbarukan","pemantik":["Dari mana panas pada penghangat tangan instan berasal?","Bahan bakar mana yang paling hemat untuk memasak?","Bagaimana menghitung energi suatu reaksi tanpa melakukannya langsung?"],"pemahaman":"Setiap reaksi kimia disertai perubahan energi yang dapat diukur dan dihitung; pemahaman ini membantu kita memilih bahan bakar yang efisien dan ramah lingkungan.","tp":[{"k":"12.1.1","t":"Membedakan sistem dan lingkungan serta reaksi eksoterm dan endoterm berdasarkan percobaan"},{"k":"12.1.2","t":"Menuliskan persamaan termokimia dan jenis-jenis perubahan entalpi standar"},{"k":"12.1.3","t":"Menentukan perubahan entalpi reaksi menggunakan kalorimeter"},{"k":"12.1.4","t":"Menentukan perubahan entalpi reaksi berdasarkan hukum Hess, data entalpi pembentukan standar, dan energi ikatan"},{"k":"12.1.5","t":"Menganalisis nilai kalor bahan bakar serta dampak penggunaannya terhadap lingkungan"}],"materi":[{"h":"Sistem, Lingkungan, Eksoterm, dan Endoterm","html":"<p>Sistem adalah bagian yang diamati (zat yang bereaksi); lingkungan adalah segala sesuatu di luar sistem. Entalpi (H) adalah energi total sistem pada tekanan tetap; yang dapat diukur adalah perubahannya (ΔH).</p><ul><li><b>Eksoterm:</b> sistem melepas kalor ke lingkungan, suhu lingkungan naik, ΔH &lt; 0 (pembakaran, penetralan, pelarutan NaOH).</li><li><b>Endoterm:</b> sistem menyerap kalor dari lingkungan, suhu lingkungan turun, ΔH &gt; 0 (fotosintesis, pelarutan urea/NH<sub>4</sub>NO<sub>3</sub>).</li></ul>"},{"h":"Persamaan Termokimia dan Entalpi Standar","html":"<p>Persamaan termokimia mencantumkan fase zat dan nilai ΔH. Keadaan standar: 25 °C (298 K), 1 atm.</p><ul><li>ΔH<sub>f</sub>° (pembentukan): pembentukan 1 mol senyawa dari unsur-unsurnya. ΔH<sub>f</sub>° unsur bebas = 0.</li><li>ΔH<sub>d</sub>° (penguraian): kebalikan pembentukan, nilai sama dengan tanda berlawanan.</li><li>ΔH<sub>c</sub>° (pembakaran): pembakaran sempurna 1 mol zat.</li></ul>"},{"h":"Kalorimetri","html":"<div class=\"formula\">q<sub>larutan</sub> = m × c × ΔT;    ΔH = −q<sub>larutan</sub> ÷ mol</div><div class=\"formula\">Kalorimeter bom: q = C<sub>kalorimeter</sub> × ΔT</div><p>Tanda negatif karena kalor yang diterima larutan berasal dari reaksi (eksoterm).</p>"},{"h":"Hukum Hess, ΔH<sub>f</sub>°, dan Energi Ikatan","html":"<p>Hukum Hess: ΔH reaksi hanya bergantung pada keadaan awal dan akhir. Persamaan reaksi dapat dibalik (tanda ΔH berubah), dikalikan (ΔH ikut dikalikan), lalu dijumlahkan.</p><div class=\"formula\">ΔH reaksi = Σ ΔH<sub>f</sub>° produk − Σ ΔH<sub>f</sub>° pereaksi</div><div class=\"formula\">ΔH reaksi = Σ energi ikatan yang putus (pereaksi) − Σ energi ikatan yang terbentuk (produk)</div>"},{"h":"Nilai Kalor Bahan Bakar","html":"<p>Nilai kalor adalah kalor yang dihasilkan pembakaran 1 gram bahan bakar (kJ/g). Bahan bakar fosil (LPG, bensin, batu bara) menghasilkan CO<sub>2</sub> yang memicu pemanasan global; pembakaran tidak sempurna menghasilkan CO yang beracun.</p><ul><li>Alternatif: biogas (kotoran ternak), biodiesel (minyak sawit/jarak), bioetanol, energi surya dan angin.</li></ul>"}],"contoh":[{"q":"Diketahui ΔH<sub>f</sub>° C<sub>2</sub>H<sub>5</sub>OH(l) = −278 kJ/mol, CO<sub>2</sub>(g) = −394 kJ/mol, H<sub>2</sub>O(l) = −286 kJ/mol. Hitung ΔH pembakaran etanol.","a":"C<sub>2</sub>H<sub>5</sub>OH + 3O<sub>2</sub> → 2CO<sub>2</sub> + 3H<sub>2</sub>O. ΔH = [2(−394) + 3(−286)] − (−278) = (−788 − 858) + 278 = −1.368 kJ/mol."}],"rangkuman":"Sistem &amp; lingkungan → eksoterm/endoterm → persamaan termokimia &amp; jenis ΔH → kalorimetri → hukum Hess, ΔH<sub>f</sub>°, energi ikatan → nilai kalor bahan bakar.","lkpd":{"judul":"Menentukan Perubahan Entalpi Penetralan dengan Kalorimeter Sederhana","tujuan":"Menentukan ΔH reaksi penetralan HCl dan NaOH menggunakan kalorimeter gelas styrofoam.","dasar":"Kalor reaksi dapat diukur dari perubahan suhu larutan: q<sub>larutan</sub> = m × c × ΔT. Pada tekanan tetap, ΔH reaksi = −q<sub>larutan</sub>/mol zat yang bereaksi. Kalor jenis larutan dianggap sama dengan air, yaitu 4,2 J g<sup>−1</sup> °C<sup>−1</sup>, dan massa jenis larutan 1 g/mL.","alat":["Gelas styrofoam 2 buah (bertumpuk) dengan tutup","Termometer 0–100 °C","Gelas ukur 50 mL (2 buah)","Pengaduk"],"bahan":["Larutan HCl 1 M (50 mL)","Larutan NaOH 1 M (50 mL)"],"keselamatan":["HCl dan NaOH bersifat korosif; gunakan sarung tangan dan kacamata pelindung.","Jika terkena kulit, bilas dengan air mengalir."],"langkah":["Masukkan 50 mL HCl 1 M ke dalam kalorimeter. Ukur suhunya (T<sub>1</sub>).","Ukur suhu 50 mL NaOH 1 M di gelas ukur terpisah (T<sub>2</sub>). Suhu awal rata-rata T<sub>awal</sub> = (T<sub>1</sub> + T<sub>2</sub>)/2.","Tuangkan NaOH ke dalam kalorimeter, tutup, dan aduk perlahan.","Amati termometer dan catat suhu tertinggi yang dicapai (T<sub>akhir</sub>).","Ulangi percobaan sekali lagi bila waktu memungkinkan."],"pertanyaan":["Hitunglah kalor yang diserap larutan (q = m × c × ΔT) dengan massa larutan 100 g.","Hitunglah mol air yang terbentuk dan ΔH penetralan per mol H<sub>2</sub>O.","Tuliskan persamaan termokimia reaksi penetralan tersebut.","Bandingkan hasilmu dengan nilai literatur (± −57 kJ/mol). Sebutkan sumber kesalahan yang mungkin.","Apakah reaksi ini eksoterm atau endoterm? Jelaskan dengan diagram tingkat energi."]},"quiz":[{"q":"Pernyataan yang benar tentang reaksi eksoterm adalah …","o":["kalor mengalir dari lingkungan ke sistem, ΔH &gt; 0","kalor mengalir dari sistem ke lingkungan, ΔH &lt; 0","suhu lingkungan turun","entalpi produk lebih besar daripada reaktan","memerlukan pemanasan terus-menerus"],"a":"B","b":"Pada reaksi eksoterm sistem melepas kalor sehingga H produk &lt; H reaktan."},{"q":"Perubahan entalpi pembentukan standar (ΔH<sub>f</sub>°) adalah perubahan entalpi pada …","o":["penguraian 1 mol senyawa menjadi unsurnya","pembentukan 1 mol senyawa dari unsur-unsurnya pada keadaan standar","pembakaran 1 mol zat","penetralan 1 mol asam","pelarutan 1 mol zat"],"a":"B","b":"Definisi ΔH<sub>f</sub>°."},{"q":"Sebanyak 50 mL HCl 1 M direaksikan dengan 50 mL NaOH 1 M dalam kalorimeter; suhu naik 5 °C (c = 4,2 J g<sup>−1</sup> °C<sup>−1</sup>, ρ = 1 g/mL). ΔH penetralan adalah …","o":["−21 kJ/mol","−42 kJ/mol","−84 kJ/mol","+42 kJ/mol","−2,1 kJ/mol"],"a":"B","b":"q = 100 × 4,2 × 5 = 2.100 J; mol H<sub>2</sub>O = 0,05; ΔH = −2,1 kJ/0,05 = −42 kJ/mol."},{"q":"Diketahui: C(s) + O<sub>2</sub>(g) → CO<sub>2</sub>(g) ΔH = −394 kJ; CO(g) + ½O<sub>2</sub>(g) → CO<sub>2</sub>(g) ΔH = −283 kJ. ΔH reaksi C(s) + ½O<sub>2</sub>(g) → CO(g) adalah …","o":["−677 kJ","−111 kJ","+111 kJ","−394 kJ","+677 kJ"],"a":"B","b":"Reaksi 1 dikurangi reaksi 2: −394 − (−283) = −111 kJ."},{"q":"Diketahui ΔH<sub>f</sub>° CH<sub>4</sub> = −75 kJ/mol, CO<sub>2</sub> = −394 kJ/mol, H<sub>2</sub>O(l) = −286 kJ/mol. ΔH pembakaran CH<sub>4</sub> adalah …","o":["−605 kJ/mol","−755 kJ/mol","−891 kJ/mol","−1.041 kJ/mol","+891 kJ/mol"],"a":"C","b":"ΔH = [−394 + 2(−286)] − (−75) = −891 kJ/mol."},{"q":"Diketahui energi ikatan H–H = 436 kJ/mol, Cl–Cl = 242 kJ/mol, H–Cl = 431 kJ/mol. ΔH reaksi H<sub>2</sub> + Cl<sub>2</sub> → 2HCl adalah …","o":["−184 kJ","+184 kJ","−247 kJ","−431 kJ","+247 kJ"],"a":"A","b":"ΔH = (436 + 242) − 2(431) = −184 kJ."},{"q":"Kompres dingin instan bekerja berdasarkan pelarutan amonium nitrat dalam air. Proses ini termasuk …","o":["eksoterm, suhu sistem naik","endoterm, sistem menyerap kalor dari lingkungan","eksoterm, lingkungan menyerap kalor","tidak ada perubahan energi","reaksi pembakaran"],"a":"B","b":"Pelarutan NH<sub>4</sub>NO<sub>3</sub> menyerap kalor sehingga terasa dingin."},{"q":"Jika ΔH<sub>c</sub> CH<sub>4</sub> = −891 kJ/mol, kalor yang dilepaskan pada pembakaran 0,5 mol CH<sub>4</sub> adalah …","o":["222,75 kJ","445,5 kJ","891 kJ","1.782 kJ","89,1 kJ"],"a":"B","b":"q = 0,5 × 891 = 445,5 kJ."}],"pertemuan":[{"tp":"12.1.1","jp":2,"sub":"Sistem dan lingkungan","aps":"Peserta didik menyentuh gelas berisi larutan urea dan larutan NaOH encer.","inti":[{"tag":"M","t":"Peserta didik mengidentifikasi sistem dan lingkungan pada percobaan pemantik."},{"tag":"A","t":"Kelompok melakukan percobaan pelarutan urea, NaOH, dan reaksi kapur tohor dengan air serta mencatat perubahan suhu."},{"tag":"R","t":"Peserta didik menentukan arah aliran kalor pada setiap percobaan."}],"form":"Lembar pengamatan suhu"},{"tp":"12.1.1","jp":2,"sub":"Eksoterm, endoterm, dan diagram tingkat energi","aps":"Mengapa kompres dingin instan terasa dingin?","inti":[{"tag":"M","t":"Peserta didik mempelajari ciri reaksi eksoterm dan endoterm serta tanda ΔH."},{"tag":"A","t":"Peserta didik menggambar diagram tingkat energi untuk data percobaan sebelumnya."},{"tag":"R","t":"Peserta didik meluruskan miskonsepsi tentang arah kalor."}],"form":"Diagram tingkat energi"},{"tp":"12.1.2","jp":2,"sub":"Persamaan termokimia","aps":"Apa bedanya persamaan reaksi biasa dengan persamaan termokimia?","inti":[{"tag":"M","t":"Peserta didik mempelajari aturan penulisan persamaan termokimia."},{"tag":"A","t":"Peserta didik menuliskan persamaan termokimia dari data."},{"tag":"R","t":"Peserta didik menjelaskan pengaruh koefisien terhadap nilai ΔH."}],"form":"Latihan persamaan termokimia"},{"tp":"12.1.2","jp":2,"sub":"Jenis-jenis perubahan entalpi standar","aps":"Permainan kartu pasangan \"jenis ΔH – contoh persamaan\".","inti":[{"tag":"M","t":"Peserta didik mempelajari ΔH<sub>f</sub>°, ΔH<sub>d</sub>°, ΔH<sub>c</sub>°, dan ΔH netralisasi."},{"tag":"A","t":"Peserta didik mencocokkan kartu dan menuliskan persamaan untuk setiap jenis ΔH."},{"tag":"R","t":"Peserta didik menjelaskan mengapa ΔH<sub>f</sub>° unsur bebas = 0."}],"form":"Hasil permainan kartu dan kuis"},{"tp":"12.1.3","jp":3,"sub":"Kalorimetri","aps":"Bagaimana mengukur energi yang dilepaskan reaksi?","inti":[{"tag":"M","t":"Peserta didik mempelajari prinsip kalorimeter sederhana dan kalorimeter bom."},{"tag":"M","t":"Guru memodelkan perhitungan q = m·c·ΔT dan ΔH."},{"tag":"A","t":"Peserta didik mengerjakan soal kalorimetri."},{"tag":"R","t":"Peserta didik menjelaskan asal tanda negatif pada ΔH."}],"form":"Latihan kalorimetri"},{"tp":"12.1.3","jp":3,"sub":"Praktikum kalorimeter sederhana","aps":"Prediksi: berapa ΔH penetralan HCl–NaOH?","inti":[{"tag":"A","t":"Kelompok melakukan praktikum sesuai LKPD."},{"tag":"A","t":"Kelompok menghitung ΔH dan membandingkan dengan literatur."},{"tag":"R","t":"Kelompok menganalisis sumber kesalahan dan cara memperbaiki kalorimeter."}],"form":"LKPD dan rubrik praktikum"},{"tp":"12.1.4","jp":3,"sub":"Hukum Hess","aps":"Dua rute mendaki bukit: apakah ketinggian akhirnya berbeda?","inti":[{"tag":"M","t":"Peserta didik memahami hukum Hess melalui analogi rute perjalanan."},{"tag":"M","t":"Guru memodelkan cara membalik, mengalikan, dan menjumlahkan persamaan."},{"tag":"A","t":"Peserta didik menyelesaikan soal hukum Hess dan menggambar siklus/diagram."},{"tag":"R","t":"Peserta didik menuliskan strategi menyelesaikan soal Hess."}],"form":"Latihan hukum Hess"},{"tp":"12.1.4","jp":3,"sub":"ΔH dari data entalpi pembentukan standar","aps":"Berapa energi pembakaran gas metana di kompor?","inti":[{"tag":"M","t":"Peserta didik mempelajari rumus ΔH = Σ ΔH<sub>f</sub>° produk − Σ ΔH<sub>f</sub>° pereaksi."},{"tag":"A","t":"Peserta didik menghitung ΔH pembakaran berbagai bahan bakar."},{"tag":"R","t":"Peserta didik membandingkan kalor pembakaran per mol dan per gram."}],"form":"Latihan ΔH<sub>f</sub>°"},{"tp":"12.1.4","jp":2,"sub":"ΔH dari energi ikatan","aps":"Mengapa pemutusan ikatan memerlukan energi?","inti":[{"tag":"M","t":"Peserta didik mempelajari energi ikatan rata-rata."},{"tag":"A","t":"Peserta didik menghitung ΔH reaksi dari energi ikatan."},{"tag":"R","t":"Peserta didik menjelaskan mengapa hasilnya berbeda sedikit dari data ΔH<sub>f</sub>°."}],"form":"Latihan energi ikatan"},{"tp":"12.1.4","jp":2,"sub":"Pemecahan masalah ΔH","aps":"Tantangan kelompok \"Tiga cara, satu jawaban\".","inti":[{"tag":"A","t":"Kelompok menyelesaikan satu soal ΔH dengan tiga cara (Hess, ΔH<sub>f</sub>°, energi ikatan) dan mempresentasikannya."},{"tag":"R","t":"Pembahasan soal dan umpan balik."}],"form":"Rubrik pemecahan masalah"},{"tp":"12.1.5","jp":2,"sub":"Nilai kalor bahan bakar","aps":"LPG, kayu bakar, atau biogas: mana yang paling efisien?","inti":[{"tag":"M","t":"Peserta didik mempelajari nilai kalor dan efisiensi bahan bakar."},{"tag":"A","t":"Kelompok menghitung dan membandingkan nilai kalor serta emisi berbagai bahan bakar rumah tangga."}],"form":"Tabel perbandingan bahan bakar"},{"tp":"12.1.5","jp":2,"sub":"Diskusi energi bersih","aps":"Apa yang dapat dilakukan keluarga kita untuk menghemat energi?","inti":[{"tag":"A","t":"Kelompok mempresentasikan rekomendasi energi bersih untuk rumah tangga dan sekolah."},{"tag":"R","t":"Refleksi pribadi tentang perubahan kecil untuk menghemat energi."}],"form":"Rubrik presentasi"}],"media":[["Gelas styrofoam, termometer","Alat praktikum","Kalorimeter sederhana"],["Kompres dingin/hangat instan","Benda nyata","Pemantik eksoterm-endoterm"],["PhET \"Energy Forms and Changes\"","Simulasi interaktif","Konsep aliran energi"],["Diagram tingkat energi dan siklus Hess","Media visual","Visualisasi hukum Hess"],["Data nilai kalor bahan bakar","Tabel/infografis","Kajian energi terbarukan"]],"glosarium":[["Sistem","Bagian yang menjadi pusat perhatian dalam pengamatan perubahan energi."],["Entalpi (H)","Jumlah energi total sistem pada tekanan tetap."],["Kalorimeter","Alat untuk mengukur kalor reaksi."],["Hukum Hess","Perubahan entalpi reaksi hanya bergantung pada keadaan awal dan akhir, tidak pada jalannya reaksi."],["Energi ikatan","Energi yang diperlukan untuk memutuskan 1 mol ikatan dalam wujud gas."]],"slides":[{"lay":"hero","k":"Bab 1","t":"Termokimia","sim":"","img":{"f":"Gas_stove_blue_flames.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Gas_stove_blue_flames.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Gas_stove_blue_flames.jpg","alt":"Gas stove blue flames","cap":""},"body":"Energi di balik setiap reaksi: dari kompor dapur hingga energi terbarukan"},{"lay":"split","k":"Pertanyaan pemantik","t":"Dari mana panas pada penghangat tangan instan berasal?","sim":"","img":{"f":"Hand_warmer.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Hand_warmer.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Hand_warmer.jpg","alt":"Hand warmer","cap":""},"body":["Bahan bakar mana yang paling hemat untuk memasak: LPG, kayu, atau biogas?","Bagaimana menghitung energi suatu reaksi tanpa melakukannya langsung?"]},{"lay":"splitR","k":"Materi","t":"Sistem, Lingkungan, Eksoterm, dan Endoterm","sim":"XII-1","img":{"f":"ThermiteReaction.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/ThermiteReaction.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:ThermiteReaction.jpg","alt":"Reaksi termit: sangat eksoterm","cap":"Reaksi termit: sangat eksoterm"},"html":"<p>Sistem adalah bagian yang diamati (zat yang bereaksi); lingkungan adalah segala sesuatu di luar sistem. Entalpi (H) adalah energi total sistem pada tekanan tetap; yang dapat diukur adalah perubahannya (ΔH).</p><ul><li><b>Eksoterm:</b> sistem melepas kalor ke lingkungan, suhu lingkungan naik, ΔH &lt; 0 (pembakaran, penetralan, pelarutan NaOH).</li><li><b>Endoterm:</b> sistem menyerap kalor dari lingkungan, suhu lingkungan turun, ΔH &gt; 0 (fotosintesis, pelarutan urea/NH<sub>4</sub>NO<sub>3</sub>).</li></ul>"},{"lay":"text","k":"Materi","t":"Persamaan Termokimia dan Entalpi Standar","sim":"XII-1","html":"<p>Persamaan termokimia mencantumkan fase zat dan nilai ΔH. Keadaan standar: 25 °C (298 K), 1 atm.</p><ul><li>ΔH<sub>f</sub>° (pembentukan): pembentukan 1 mol senyawa dari unsur-unsurnya. ΔH<sub>f</sub>° unsur bebas = 0.</li><li>ΔH<sub>d</sub>° (penguraian): kebalikan pembentukan, nilai sama dengan tanda berlawanan.</li><li>ΔH<sub>c</sub>° (pembakaran): pembakaran sempurna 1 mol zat.</li></ul>"},{"lay":"split","k":"Materi","t":"Kalorimetri","sim":"XII-1","img":{"f":"Bombenkalorimeter_mit_bombe.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Bombenkalorimeter_mit_bombe.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Bombenkalorimeter_mit_bombe.jpg","alt":"Kalorimeter bom","cap":"Kalorimeter bom"},"html":"<div class=\"formula\">q<sub>larutan</sub> = m × c × ΔT;    ΔH = −q<sub>larutan</sub> ÷ mol</div><div class=\"formula\">Kalorimeter bom: q = C<sub>kalorimeter</sub> × ΔT</div><p>Tanda negatif karena kalor yang diterima larutan berasal dari reaksi (eksoterm).</p>"},{"lay":"splitR","k":"Materi","t":"Hukum Hess, ΔH<sub>f</sub>°, dan Energi Ikatan","sim":"XII-1b","img":{"f":"Hess_Germain_Henri.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Hess_Germain_Henri.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Hess_Germain_Henri.jpg","alt":"Germain Henri Hess (1802–1850)","cap":"Germain Henri Hess (1802–1850)"},"html":"<p>Hukum Hess: ΔH reaksi hanya bergantung pada keadaan awal dan akhir. Persamaan reaksi dapat dibalik (tanda ΔH berubah), dikalikan (ΔH ikut dikalikan), lalu dijumlahkan.</p><div class=\"formula\">ΔH reaksi = Σ ΔH<sub>f</sub>° produk − Σ ΔH<sub>f</sub>° pereaksi</div><div class=\"formula\">ΔH reaksi = Σ energi ikatan yang putus (pereaksi) − Σ energi ikatan yang terbentuk (produk)</div>"},{"lay":"gallery","k":"Energi ikatan","t":"Memutus dan membentuk ikatan","sim":"XII-1c","imgs":[{"f":"Methane-3D-balls.png","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Methane-3D-balls.png?width=1280","src":"https://commons.wikimedia.org/wiki/File:Methane-3D-balls.png","alt":"CH₄: 4 ikatan C–H","cap":"CH₄: 4 ikatan C–H"},{"f":"Water-3D-balls.png","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Water-3D-balls.png?width=1280","src":"https://commons.wikimedia.org/wiki/File:Water-3D-balls.png","alt":"H₂O: 2 ikatan O–H","cap":"H₂O: 2 ikatan O–H"},{"f":"Gas_Stove_Burner_Blue_Flame_(28409479226).jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Gas_Stove_Burner_Blue_Flame_(28409479226).jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Gas_Stove_Burner_Blue_Flame_(28409479226).jpg","alt":"Pembakaran metana: eksoterm","cap":"Pembakaran metana: eksoterm"}],"body":"ΔH = Σ energi ikatan yang putus − Σ energi ikatan yang terbentuk."},{"lay":"split","k":"Materi","t":"Nilai Kalor Bahan Bakar","sim":"XII-1d","img":{"f":"Biogas.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Biogas.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Biogas.jpg","alt":"Biogas dari kotoran ternak","cap":"Biogas dari kotoran ternak"},"html":"<p>Nilai kalor adalah kalor yang dihasilkan pembakaran 1 gram bahan bakar (kJ/g). Bahan bakar fosil (LPG, bensin, batu bara) menghasilkan CO<sub>2</sub> yang memicu pemanasan global; pembakaran tidak sempurna menghasilkan CO yang beracun.</p><ul><li>Alternatif: biogas (kotoran ternak), biodiesel (minyak sawit/jarak), bioetanol, energi surya dan angin.</li></ul>"},{"lay":"contoh","k":"","t":"","sim":"","q":"Diketahui ΔH<sub>f</sub>° C<sub>2</sub>H<sub>5</sub>OH(l) = −278 kJ/mol, CO<sub>2</sub>(g) = −394 kJ/mol, H<sub>2</sub>O(l) = −286 kJ/mol. Hitung ΔH pembakaran etanol.","a":"C<sub>2</sub>H<sub>5</sub>OH + 3O<sub>2</sub> → 2CO<sub>2</sub> + 3H<sub>2</sub>O. ΔH = [2(−394) + 3(−286)] − (−278) = (−788 − 858) + 278 = −1.368 kJ/mol."},{"lay":"hero","k":"Praktikum","t":"Kalorimeter gelas styrofoam","sim":"XII-1","img":{"f":"Flame_from_the_burner_of_a_gas_stove.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Flame_from_the_burner_of_a_gas_stove.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Flame_from_the_burner_of_a_gas_stove.jpg","alt":"Flame from the burner of a gas stove","cap":""},"body":"Ukur kenaikan suhu reaksi penetralan HCl–NaOH, lalu hitung ΔH per mol air."},{"lay":"refleksi","k":"","t":"","sim":""}]},{"kode":"XII-2","no":2,"sem":1,"jp":30,"judul":"Reaksi Redoks dan Sel Volta","sym":"Rd","topik":"Listrik dari reaksi kimia: rahasia di balik baterai ponselmu","pemantik":["Apa yang sebenarnya \"habis\" di dalam baterai ponsel?","Bagaimana buah dapat menyalakan lampu LED?","Mengapa baterai bekas tidak boleh dibuang sembarangan?"],"pemahaman":"Reaksi redoks melibatkan perpindahan elektron; bila aliran elektron itu dialirkan melalui kawat, energi kimia berubah menjadi energi listrik yang menghidupkan baterai dan kendaraan listrik.","tp":[{"k":"12.2.1","t":"Menentukan bilangan oksidasi unsur dan menganalisis reaksi redoks"},{"k":"12.2.2","t":"Menyetarakan persamaan reaksi redoks dengan metode perubahan bilangan oksidasi dan setengah reaksi"},{"k":"12.2.3","t":"Menjelaskan susunan dan prinsip kerja sel volta serta menuliskan notasi sel"},{"k":"12.2.4","t":"Menghitung potensial sel standar dan meramalkan kespontanan reaksi redoks"},{"k":"12.2.5","t":"Menganalisis penerapan sel volta dalam kehidupan dan merancang baterai sederhana dari bahan di sekitar"}],"materi":[{"h":"Konsep Redoks dan Bilangan Oksidasi","html":"<p>Oksidasi: pelepasan elektron/kenaikan biloks. Reduksi: penerimaan elektron/penurunan biloks. Oksidator mengalami reduksi; reduktor mengalami oksidasi.</p><ul><li>Aturan biloks: unsur bebas = 0; ion monoatom = muatannya; H = +1 (kecuali hidrida logam −1); O = −2 (kecuali peroksida −1, OF<sub>2</sub> +2); logam golongan IA = +1, IIA = +2; jumlah biloks senyawa = 0, ion poliatom = muatannya.</li></ul>"},{"h":"Penyetaraan Reaksi Redoks","html":"<ul><li><b>Metode PBO:</b> tentukan biloks yang berubah → samakan jumlah atom → samakan kenaikan dan penurunan biloks → setarakan muatan (H<sup>+</sup> untuk asam, OH<sup>−</sup> untuk basa) → setarakan H dengan H<sub>2</sub>O.</li><li><b>Metode setengah reaksi:</b> pisahkan oksidasi dan reduksi → setarakan atom selain O dan H → setarakan O dengan H<sub>2</sub>O → setarakan H dengan H<sup>+</sup> → setarakan muatan dengan elektron → samakan elektron dan jumlahkan. Suasana basa: tambahkan OH<sup>−</sup> pada kedua ruas untuk menetralkan H<sup>+</sup>.</li></ul>"},{"h":"Sel Volta","html":"<p>Sel volta mengubah energi kimia reaksi redoks spontan menjadi energi listrik. Anode (−): oksidasi; katode (+): reduksi (\"KaRAOks\": katode reduksi, anode oksidasi). Elektron mengalir dari anode ke katode melalui kawat; jembatan garam menjaga kenetralan muatan.</p><div class=\"formula\">Notasi sel: anode | ion anode || ion katode | katode,   contoh Zn | Zn<sup>2+</sup> || Cu<sup>2+</sup> | Cu</div><p>Deret volta: Li–K–Ba–Ca–Na–Mg–Al–Mn–(H<sub>2</sub>O)–Zn–Cr–Fe–Cd–Co–Ni–Sn–Pb–(H)–Cu–Hg–Ag–Pt–Au. Logam di kiri dapat mereduksi ion logam di kanannya.</p>"},{"h":"Potensial Sel","html":"<div class=\"formula\">E°sel = E°katode − E°anode = E°reduksi − E°oksidasi</div><p>Reaksi berlangsung spontan bila E°sel &gt; 0. Katode adalah elektrode dengan E° lebih besar.</p>"},{"h":"Sel Volta dalam Kehidupan","html":"<ul><li>Baterai kering (sel Leclanché): anode Zn, katode C dengan MnO<sub>2</sub>, elektrolit pasta NH<sub>4</sub>Cl.</li><li>Aki: anode Pb, katode PbO<sub>2</sub>, elektrolit H<sub>2</sub>SO<sub>4</sub>; dapat diisi ulang.</li><li>Baterai litium-ion pada ponsel dan kendaraan listrik; sel bahan bakar hidrogen.</li><li>Baterai bekas termasuk limbah B3: jangan dibuang sembarangan, serahkan ke tempat pengumpulan khusus.</li></ul>"}],"contoh":[{"q":"Setarakan MnO<sub>4</sub><sup>-</sup> + SO<sub>3</sub><sup>2-</sup> → MnO<sub>2</sub> + SO<sub>4</sub><sup>2-</sup> (suasana basa).","a":"Reduksi: MnO<sub>4</sub><sup>-</sup> + 2H<sub>2</sub>O + 3e<sup>-</sup> → MnO<sub>2</sub> + 4OH<sup>-</sup> (×2). Oksidasi: SO<sub>3</sub><sup>2-</sup> + 2OH<sup>-</sup> → SO<sub>4</sub><sup>2-</sup> + H<sub>2</sub>O + 2e<sup>-</sup> (×3). Hasil: 2MnO<sub>4</sub><sup>-</sup> + 3SO<sub>3</sub><sup>2-</sup> + H<sub>2</sub>O → 2MnO<sub>2</sub> + 3SO<sub>4</sub><sup>2-</sup> + 2OH<sup>-</sup>."}],"rangkuman":"Konsep redoks → bilangan oksidasi → penyetaraan redoks → sel volta → potensial sel → penerapan sel volta.","lkpd":{"judul":"Merangkai Sel Volta Sederhana Zn–Cu","tujuan":"Merangkai sel volta, mengukur potensial sel, dan menentukan anode serta katode.","dasar":"Sel volta mengubah energi kimia reaksi redoks spontan menjadi energi listrik. Oksidasi terjadi di anode (kutub negatif) dan reduksi di katode (kutub positif). Jembatan garam menjaga kenetralan muatan larutan. E°sel = E°katode − E°anode. Diketahui E° Zn<sup>2+</sup>/Zn = −0,76 V dan E° Cu<sup>2+</sup>/Cu = +0,34 V.","alat":["Gelas kimia 100 mL (2 buah)","Lempeng seng dan tembaga","Kabel penjepit buaya","Voltmeter/multimeter","Tabung U atau kertas saring untuk jembatan garam","Amplas"],"bahan":["Larutan ZnSO<sub>4</sub> 1 M","Larutan CuSO<sub>4</sub> 1 M","Larutan KNO<sub>3</sub> jenuh (jembatan garam)","Jeruk nipis/kentang (untuk percobaan tambahan)"],"keselamatan":["Larutan CuSO<sub>4</sub> dan ZnSO<sub>4</sub> berbahaya bagi lingkungan; tampung sisa larutan di wadah limbah.","Gunakan sarung tangan dan kacamata pelindung."],"langkah":["Amplas lempeng Zn dan Cu hingga bersih.","Isi gelas kimia pertama dengan 50 mL ZnSO<sub>4</sub> 1 M dan celupkan lempeng Zn; isi gelas kedua dengan 50 mL CuSO<sub>4</sub> 1 M dan celupkan lempeng Cu.","Hubungkan kedua larutan dengan jembatan garam (kertas saring yang dibasahi KNO<sub>3</sub> jenuh).","Hubungkan lempeng Zn dan Cu ke voltmeter. Catat nilai potensial dan arah jarum/tanda.","Angkat jembatan garam dan amati perubahan pada voltmeter.","Tambahan: tancapkan lempeng Zn dan Cu pada jeruk nipis/kentang, ukur potensialnya, lalu coba rangkaian seri."],"pertanyaan":["Tuliskan reaksi di anode, katode, dan reaksi sel.","Hitung E°sel teoretis dan bandingkan dengan hasil pengukuran. Jelaskan perbedaannya.","Tuliskan notasi sel volta tersebut.","Apa fungsi jembatan garam? Apa yang terjadi bila jembatan garam diangkat?","Bagaimana cara memperbesar tegangan pada baterai buah?"]},"quiz":[{"q":"Bilangan oksidasi Mn dalam KMnO<sub>4</sub> adalah …","o":["+2","+4","+6","+7","+5"],"a":"D","b":"+1 + Mn + 4(−2) = 0 → Mn = +7."},{"q":"Bilangan oksidasi Cr dalam K<sub>2</sub>Cr<sub>2</sub>O<sub>7</sub> adalah …","o":["+3","+4","+6","+7","+12"],"a":"C","b":"2(+1) + 2Cr + 7(−2) = 0 → Cr = +6."},{"q":"Pada reaksi Zn + Cu<sup>2+</sup> → Zn<sup>2+</sup> + Cu, zat yang bertindak sebagai oksidator adalah …","o":["Zn","Cu<sup>2+</sup>","Zn<sup>2+</sup>","Cu","tidak ada"],"a":"B","b":"Cu<sup>2+</sup> mengalami reduksi sehingga bertindak sebagai oksidator."},{"q":"Pada penyetaraan reaksi MnO<sub>4</sub><sup>-</sup> + Fe<sup>2+</sup> → Mn<sup>2+</sup> + Fe<sup>3+</sup> (suasana asam), perbandingan koefisien MnO<sub>4</sub><sup>-</sup> : Fe<sup>2+</sup> adalah …","o":["1 : 1","1 : 2","1 : 3","1 : 5","2 : 5"],"a":"D","b":"MnO<sub>4</sub><sup>-</sup> + 5Fe<sup>2+</sup> + 8H<sup>+</sup> → Mn<sup>2+</sup> + 5Fe<sup>3+</sup> + 4H<sub>2</sub>O."},{"q":"Diketahui E° Zn<sup>2+</sup>/Zn = −0,76 V dan E° Cu<sup>2+</sup>/Cu = +0,34 V. Potensial sel standar Zn–Cu adalah …","o":["−1,10 V","−0,42 V","+0,42 V","+1,10 V","+0,76 V"],"a":"D","b":"E°sel = 0,34 − (−0,76) = +1,10 V."},{"q":"Notasi sel yang benar untuk sel volta Zn–Cu adalah …","o":["Cu | Cu<sup>2+</sup> || Zn<sup>2+</sup> | Zn","Zn | Zn<sup>2+</sup> || Cu<sup>2+</sup> | Cu","Zn<sup>2+</sup> | Zn || Cu | Cu<sup>2+</sup>","Zn | Cu || Zn<sup>2+</sup> | Cu<sup>2+</sup>","Cu | Zn || Cu<sup>2+</sup> | Zn<sup>2+</sup>"],"a":"B","b":"Anode (oksidasi) ditulis di kiri, katode di kanan."},{"q":"Diketahui E° Zn<sup>2+</sup>/Zn = −0,76 V dan E° Cu<sup>2+</sup>/Cu = +0,34 V. Reaksi yang TIDAK berlangsung spontan adalah …","o":["Zn + Cu<sup>2+</sup> → Zn<sup>2+</sup> + Cu","Cu + Zn<sup>2+</sup> → Cu<sup>2+</sup> + Zn","keduanya spontan","keduanya tidak spontan","tidak dapat ditentukan"],"a":"B","b":"E°sel = −0,76 − 0,34 = −1,10 V (negatif) → tidak spontan."},{"q":"Pada aki (accumulator) kendaraan, anode dan elektrolitnya adalah …","o":["Zn dan NH<sub>4</sub>Cl","Pb dan H<sub>2</sub>SO<sub>4</sub>","PbO<sub>2</sub> dan HCl","Li dan KOH","C dan MnO<sub>2</sub>"],"a":"B","b":"Anode Pb, katode PbO<sub>2</sub>, elektrolit H<sub>2</sub>SO<sub>4</sub>."}],"pertemuan":[{"tp":"12.2.1","jp":2,"sub":"Konsep redoks dan bilangan oksidasi","aps":"Demonstrasi LED menyala dengan rangkaian jeruk nipis.","inti":[{"tag":"M","t":"Peserta didik meninjau perkembangan konsep redoks."},{"tag":"M","t":"Peserta didik mempelajari aturan bilangan oksidasi dengan kartu aturan."},{"tag":"A","t":"Peserta didik menentukan biloks dalam berbagai senyawa dan ion."},{"tag":"R","t":"Peserta didik menandai aturan biloks yang paling sering terlupa."}],"form":"Latihan biloks"},{"tp":"12.2.1","jp":2,"sub":"Oksidator, reduktor, dan reaksi autoredoks","aps":"Permainan \"Detektif Biloks\".","inti":[{"tag":"A","t":"Kelompok mengidentifikasi oksidator, reduktor, hasil oksidasi, dan hasil reduksi dari berbagai reaksi."},{"tag":"R","t":"Pembahasan reaksi autoredoks (disproporsionasi)."}],"form":"Hasil permainan dan kuis"},{"tp":"12.2.2","jp":3,"sub":"Penyetaraan redoks metode PBO","aps":"Mengapa reaksi redoks sulit disetarakan dengan cara biasa?","inti":[{"tag":"M","t":"Guru memodelkan langkah metode perubahan bilangan oksidasi."},{"tag":"A","t":"Peserta didik menyetarakan reaksi berpasangan (think-pair-share)."},{"tag":"R","t":"Peserta didik menuliskan langkah PBO dengan bahasanya sendiri."}],"form":"Latihan PBO"},{"tp":"12.2.2","jp":2,"sub":"Metode setengah reaksi (suasana asam)","aps":"Bagaimana menyetarakan reaksi ion dalam larutan asam?","inti":[{"tag":"M","t":"Guru memodelkan metode setengah reaksi suasana asam."},{"tag":"A","t":"Peserta didik menyetarakan reaksi secara mandiri."},{"tag":"R","t":"Peserta didik membandingkan kedua metode."}],"form":"Latihan setengah reaksi"},{"tp":"12.2.2","jp":2,"sub":"Suasana basa dan latihan campuran","aps":"Apa yang berbeda bila reaksi berlangsung dalam suasana basa?","inti":[{"tag":"M","t":"Peserta didik mempelajari penyesuaian dengan ion OH<sup>-</sup>."},{"tag":"A","t":"Peserta didik mengerjakan latihan campuran berjenjang."},{"tag":"R","t":"Tutor sebaya untuk peserta didik yang belum tuntas."}],"form":"Kuis penyetaraan"},{"tp":"12.2.3","jp":3,"sub":"Susunan dan prinsip kerja sel volta","aps":"Bagaimana reaksi Zn dengan larutan CuSO<sub>4</sub> dapat menghasilkan listrik?","inti":[{"tag":"M","t":"Peserta didik mengamati simulasi sel galvani untuk mengidentifikasi anode, katode, aliran elektron, dan jembatan garam."},{"tag":"A","t":"Peserta didik menggambar sel volta dan menuliskan notasi sel."},{"tag":"R","t":"Peserta didik menjelaskan fungsi jembatan garam."}],"form":"Gambar sel volta dan notasi"},{"tp":"12.2.3","jp":3,"sub":"Praktikum sel volta Zn–Cu","aps":"Prediksi: berapa volt yang akan terbaca?","inti":[{"tag":"A","t":"Kelompok merangkai sel volta dan mengukur potensial sesuai LKPD."},{"tag":"A","t":"Kelompok menguji pengaruh jembatan garam dan baterai buah."},{"tag":"R","t":"Kelompok membandingkan hasil dengan nilai teoretis."}],"form":"LKPD dan rubrik praktikum"},{"tp":"12.2.4","jp":3,"sub":"Potensial elektrode dan potensial sel","aps":"Logam mana yang paling mudah melepas elektron?","inti":[{"tag":"M","t":"Peserta didik mempelajari potensial elektrode standar dan deret volta."},{"tag":"A","t":"Peserta didik menghitung E°sel berbagai pasangan elektrode."},{"tag":"R","t":"Peserta didik menjelaskan cara menentukan katode dari data E°."}],"form":"Latihan E°sel"},{"tp":"12.2.4","jp":3,"sub":"Kespontanan reaksi redoks","aps":"Apakah besi dapat menggantikan tembaga dari larutannya?","inti":[{"tag":"M","t":"Peserta didik mempelajari hubungan tanda E°sel dengan kespontanan."},{"tag":"A","t":"Peserta didik meramalkan kespontanan reaksi dan memilih logam pelindung."},{"tag":"R","t":"Pembahasan soal sulit dan penguatan."}],"form":"Kuis kespontanan"},{"tp":"12.2.5","jp":3,"sub":"Proyek baterai sederhana","aps":"Bagaimana memperbesar tegangan baterai buah?","inti":[{"tag":"A","t":"Kelompok merancang baterai dari buah/sayur dan menguji variabel (jenis buah, elektrode, rangkaian seri)."},{"tag":"A","t":"Kelompok mendokumentasikan hasil untuk pameran."},{"tag":"R","t":"Kelompok mengevaluasi kelebihan dan keterbatasan rancangan."}],"form":"Rubrik produk proyek"},{"tp":"12.2.5","jp":2,"sub":"Pameran proyek dan pengelolaan limbah baterai","aps":"Ke mana baterai bekas di rumahmu dibuang?","inti":[{"tag":"A","t":"Pameran proyek baterai dan presentasi."},{"tag":"M","t":"Diskusi jenis baterai (kering, aki, litium) dan bahaya limbah B3."},{"tag":"R","t":"Komitmen pengelolaan baterai bekas."}],"form":"Rubrik presentasi"}],"media":[["Simulasi sel galvani daring","Simulasi interaktif","Aliran elektron dan fungsi jembatan garam"],["Lempeng Zn/Cu, voltmeter, jembatan garam","Alat praktikum","Merangkai sel volta"],["Jeruk nipis/kentang, LED","Bahan lokal","Proyek baterai buah"],["Contoh baterai kering dan aki (bekas, aman)","Benda nyata","Identifikasi komponen sel"],["Kartu aturan biloks","Media cetak","Latihan menentukan biloks"]],"glosarium":[["Bilangan oksidasi","Muatan yang dimiliki atom jika elektron ikatan dianggap milik atom yang lebih elektronegatif."],["Oksidator","Zat yang mengalami reduksi dan mengoksidasi zat lain."],["Anode","Elektrode tempat terjadinya oksidasi."],["Jembatan garam","Penghubung dua setengah sel yang menjaga kenetralan muatan."],["Potensial elektrode standar","Potensial reduksi elektrode pada 25 °C, 1 M, dan 1 atm terhadap elektrode hidrogen standar."]],"slides":[{"lay":"hero","k":"Bab 2","t":"Reaksi Redoks dan Sel Volta","sim":"","img":{"f":"VoltaBattery.JPG","url":"https://commons.wikimedia.org/wiki/Special:FilePath/VoltaBattery.JPG?width=1280","src":"https://commons.wikimedia.org/wiki/File:VoltaBattery.JPG","alt":"VoltaBattery","cap":""},"body":"Listrik dari reaksi kimia: rahasia di balik baterai ponselmu"},{"lay":"split","k":"Pertanyaan pemantik","t":"Bagaimana buah dapat menyalakan lampu LED?","sim":"","img":{"f":"Lemon_battery_experiment.JPG","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Lemon_battery_experiment.JPG?width=1280","src":"https://commons.wikimedia.org/wiki/File:Lemon_battery_experiment.JPG","alt":"Lemon battery experiment","cap":""},"body":["Apa yang sebenarnya \"habis\" di dalam baterai ponsel?","Mengapa baterai bekas tidak boleh dibuang sembarangan?"]},{"lay":"splitR","k":"Materi","t":"Konsep Redoks dan Bilangan Oksidasi","sim":"XII-2b","img":{"f":"Reaction_of_zinc_metal_and_copper(II)_sulfate.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Reaction_of_zinc_metal_and_copper(II)_sulfate.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Reaction_of_zinc_metal_and_copper(II)_sulfate.jpg","alt":"Logam Zn dalam larutan CuSO₄","cap":"Logam Zn dalam larutan CuSO₄"},"html":"<p>Oksidasi: pelepasan elektron/kenaikan biloks. Reduksi: penerimaan elektron/penurunan biloks. Oksidator mengalami reduksi; reduktor mengalami oksidasi.</p><ul><li>Aturan biloks: unsur bebas = 0; ion monoatom = muatannya; H = +1 (kecuali hidrida logam −1); O = −2 (kecuali peroksida −1, OF<sub>2</sub> +2); logam golongan IA = +1, IIA = +2; jumlah biloks senyawa = 0, ion poliatom = muatannya.</li></ul>"},{"lay":"text","k":"Materi","t":"Penyetaraan Reaksi Redoks","sim":"XII-2c","html":"<ul><li><b>Metode PBO:</b> tentukan biloks yang berubah → samakan jumlah atom → samakan kenaikan dan penurunan biloks → setarakan muatan (H<sup>+</sup> untuk asam, OH<sup>−</sup> untuk basa) → setarakan H dengan H<sub>2</sub>O.</li><li><b>Metode setengah reaksi:</b> pisahkan oksidasi dan reduksi → setarakan atom selain O dan H → setarakan O dengan H<sub>2</sub>O → setarakan H dengan H<sup>+</sup> → setarakan muatan dengan elektron → samakan elektron dan jumlahkan. Suasana basa: tambahkan OH<sup>−</sup> pada kedua ruas untuk menetralkan H<sup>+</sup>.</li></ul>"},{"lay":"split","k":"Materi","t":"Sel Volta","sim":"XII-2","img":{"f":"Alessandro_Volta.jpeg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Alessandro_Volta.jpeg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Alessandro_Volta.jpeg","alt":"Alessandro Volta (1745–1827)","cap":"Alessandro Volta (1745–1827)"},"html":"<p>Sel volta mengubah energi kimia reaksi redoks spontan menjadi energi listrik. Anode (−): oksidasi; katode (+): reduksi (\"KaRAOks\": katode reduksi, anode oksidasi). Elektron mengalir dari anode ke katode melalui kawat; jembatan garam menjaga kenetralan muatan.</p><div class=\"formula\">Notasi sel: anode | ion anode || ion katode | katode,   contoh Zn | Zn<sup>2+</sup> || Cu<sup>2+</sup> | Cu</div><p>Deret volta: Li–K–Ba–Ca–Na–Mg–Al–Mn–(H<sub>2</sub>O)–Zn–Cr–Fe–Cd–Co–Ni–Sn–Pb–(H)–Cu–Hg–Ag–Pt–Au. Logam di kiri dapat mereduksi ion logam di kanannya.</p>"},{"lay":"splitR","k":"Materi","t":"Potensial Sel","sim":"XII-2","img":{"f":"Daniell-element---Elemento-Daniell.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Daniell-element---Elemento-Daniell.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Daniell-element---Elemento-Daniell.jpg","alt":"Sel Daniell (Zn–Cu)","cap":"Sel Daniell (Zn–Cu)"},"html":"<div class=\"formula\">E°sel = E°katode − E°anode = E°reduksi − E°oksidasi</div><p>Reaksi berlangsung spontan bila E°sel &gt; 0. Katode adalah elektrode dengan E° lebih besar.</p>"},{"lay":"gallery","k":"Materi","t":"Sel Volta dalam Kehidupan","sim":"XII-2d","imgs":[{"f":"Golden_Power_Power_Plus_AA_alkaline_batteries.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Golden_Power_Power_Plus_AA_alkaline_batteries.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Golden_Power_Power_Plus_AA_alkaline_batteries.jpg","alt":"Baterai alkalin","cap":"Baterai alkalin"},{"f":"Lead-acid_automotive_battery,_55_Ah.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Lead-acid_automotive_battery%2C_55_Ah.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Lead-acid_automotive_battery%2C_55_Ah.jpg","alt":"Aki (Pb–PbO₂–H₂SO₄)","cap":"Aki (Pb–PbO₂–H₂SO₄)"},{"f":"LiIon-18650-match.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/LiIon-18650-match.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:LiIon-18650-match.jpg","alt":"Sel litium-ion 18650","cap":"Sel litium-ion 18650"}],"html":"<ul><li>Baterai kering (sel Leclanché): anode Zn, katode C dengan MnO<sub>2</sub>, elektrolit pasta NH<sub>4</sub>Cl.</li><li>Aki: anode Pb, katode PbO<sub>2</sub>, elektrolit H<sub>2</sub>SO<sub>4</sub>; dapat diisi ulang.</li><li>Baterai litium-ion pada ponsel dan kendaraan listrik; sel bahan bakar hidrogen.</li><li>Baterai bekas termasuk limbah B3: jangan dibuang sembarangan, serahkan ke tempat pengumpulan khusus.</li></ul>"},{"lay":"contoh","k":"","t":"","sim":"","q":"Setarakan MnO<sub>4</sub><sup>-</sup> + SO<sub>3</sub><sup>2-</sup> → MnO<sub>2</sub> + SO<sub>4</sub><sup>2-</sup> (suasana basa).","a":"Reduksi: MnO<sub>4</sub><sup>-</sup> + 2H<sub>2</sub>O + 3e<sup>-</sup> → MnO<sub>2</sub> + 4OH<sup>-</sup> (×2). Oksidasi: SO<sub>3</sub><sup>2-</sup> + 2OH<sup>-</sup> → SO<sub>4</sub><sup>2-</sup> + H<sub>2</sub>O + 2e<sup>-</sup> (×3). Hasil: 2MnO<sub>4</sub><sup>-</sup> + 3SO<sub>3</sub><sup>2-</sup> + H<sub>2</sub>O → 2MnO<sub>2</sub> + 3SO<sub>4</sub><sup>2-</sup> + 2OH<sup>-</sup>."},{"lay":"hero","k":"Proyek","t":"Baterai dari buah","sim":"XII-2d","img":{"f":"Lemon_battery_(2).JPG","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Lemon_battery_(2).JPG?width=1280","src":"https://commons.wikimedia.org/wiki/File:Lemon_battery_(2).JPG","alt":"Lemon battery (2)","cap":""},"body":"Rancang baterai dari jeruk nipis atau kentang yang mampu menyalakan LED."},{"lay":"refleksi","k":"","t":"","sim":""}]},{"kode":"XII-3","no":3,"sem":1,"jp":20,"judul":"Elektrolisis dan Korosi","sym":"El","topik":"Listrik untuk mengubah zat dan musuh bernama karat","pemantik":["Bagaimana sendok besi dapat dilapisi perak?","Mengapa pagar besi di dekat pantai lebih cepat berkarat?","Bagaimana aluminium untuk kaleng minuman diproduksi?"],"pemahaman":"Energi listrik dapat digunakan untuk memaksa reaksi redoks yang tidak spontan, sehingga logam dapat dimurnikan dan disepuh; sebaliknya, reaksi redoks spontan pada logam menyebabkan korosi yang perlu dicegah.","tp":[{"k":"12.3.1","t":"Menuliskan reaksi elektrolisis lelehan dan larutan dengan elektrode inert maupun aktif"},{"k":"12.3.2","t":"Menerapkan hukum Faraday dalam perhitungan elektrolisis"},{"k":"12.3.3","t":"Menjelaskan penerapan elektrolisis dalam industri"},{"k":"12.3.4","t":"Menganalisis faktor penyebab korosi dan cara pencegahannya melalui percobaan"}],"materi":[{"h":"Sel Elektrolisis","html":"<p>Sel elektrolisis mengubah energi listrik menjadi energi kimia (reaksi tidak spontan). Katode (−): reduksi; anode (+): oksidasi.</p><table><tr><th>Elektrode</th><th>Kondisi</th><th>Reaksi yang terjadi</th></tr><tr><td>Katode</td><td>Kation logam IA, IIA, Al, Mn dalam larutan</td><td>Air direduksi: 2H<sub>2</sub>O + 2e<sup>-</sup> → H<sub>2</sub> + 2OH<sup>-</sup></td></tr><tr><td>Katode</td><td>Kation logam lain dan H<sup>+</sup></td><td>Kation direduksi, misalnya Cu<sup>2+</sup> + 2e<sup>-</sup> → Cu</td></tr><tr><td>Katode</td><td>Lelehan (tanpa air)</td><td>Kation logam direduksi</td></tr><tr><td>Anode inert (C, Pt, Au)</td><td>Anion sisa asam oksi (SO<sub>4</sub><sup>2-</sup>, NO<sub>3</sub><sup>-</sup>)</td><td>Air dioksidasi: 2H<sub>2</sub>O → 4H<sup>+</sup> + O<sub>2</sub> + 4e<sup>-</sup></td></tr><tr><td>Anode inert</td><td>Ion halida (Cl<sup>-</sup>, Br<sup>-</sup>, I<sup>-</sup>)</td><td>Halida dioksidasi: 2Cl<sup>-</sup> → Cl<sub>2</sub> + 2e<sup>-</sup></td></tr><tr><td>Anode inert</td><td>Ion OH<sup>-</sup></td><td>4OH<sup>-</sup> → 2H<sub>2</sub>O + O<sub>2</sub> + 4e<sup>-</sup></td></tr><tr><td>Anode aktif (selain C, Pt, Au)</td><td>Semua jenis larutan</td><td>Logam anode teroksidasi: M → M<sup>n+</sup> + ne<sup>-</sup></td></tr></table>"},{"h":"Hukum Faraday","html":"<div class=\"formula\">Mol elektron = Q ÷ F = (i × t) ÷ 96.500</div><div class=\"formula\">Hukum Faraday I: w = (e × i × t) ÷ 96.500,  dengan e = Ar ÷ jumlah elektron (massa ekuivalen)</div><div class=\"formula\">Hukum Faraday II (sel seri): w<sub>1</sub> : w<sub>2</sub> = e<sub>1</sub> : e<sub>2</sub></div>"},{"h":"Penerapan Elektrolisis","html":"<ul><li><b>Penyepuhan:</b> benda yang disepuh sebagai katode, logam penyepuh sebagai anode, elektrolit berisi ion logam penyepuh.</li><li><b>Pemurnian tembaga:</b> tembaga kotor sebagai anode, tembaga murni sebagai katode.</li><li><b>Produksi logam dan bahan kimia:</b> aluminium (proses Hall-Héroult dari Al<sub>2</sub>O<sub>3</sub> dalam kriolit cair), natrium (lelehan NaCl), serta NaOH dan Cl<sub>2</sub> (elektrolisis larutan NaCl).</li></ul>"},{"h":"Korosi dan Pencegahannya","html":"<p>Korosi besi adalah reaksi elektrokimia. Anode: Fe → Fe<sup>2+</sup> + 2e<sup>-</sup>; katode: O<sub>2</sub> + 2H<sub>2</sub>O + 4e<sup>-</sup> → 4OH<sup>-</sup>. Fe<sup>2+</sup> teroksidasi lebih lanjut menjadi karat Fe<sub>2</sub>O<sub>3</sub>·xH<sub>2</sub>O. Korosi dipercepat oleh air, oksigen, elektrolit (garam, asam), dan kontak dengan logam yang kurang aktif.</p><ul><li>Pencegahan: pengecatan, pelumuran oli/minyak, pembalutan plastik, galvanisasi (pelapisan Zn), tin plating (pelapisan Sn pada kaleng), perlindungan katodik (dihubungkan dengan Mg), dan pembuatan paduan (baja tahan karat).</li></ul>"}],"contoh":[{"q":"Berapa lama arus 2 A harus dialirkan untuk mengendapkan 1,27 g Cu dari larutan CuSO<sub>4</sub>? (Ar Cu = 63,5)","a":"mol Cu = 0,02 → mol e<sup>−</sup> = 0,04 → Q = 0,04 × 96.500 = 3.860 C → t = 3.860/2 = 1.930 s (± 32 menit)."}],"rangkuman":"Sel elektrolisis → reaksi di katode &amp; anode → hukum Faraday → penerapan industri → korosi &amp; pencegahannya.","lkpd":{"judul":"Faktor-Faktor Penyebab Korosi Besi","tujuan":"Menyelidiki faktor-faktor yang memengaruhi korosi besi dan cara pencegahannya.","dasar":"Korosi besi merupakan reaksi elektrokimia. Besi teroksidasi di daerah anode (Fe → Fe<sup>2+</sup> + 2e<sup>-</sup>), sedangkan oksigen tereduksi di daerah katode (O<sub>2</sub> + 2H<sub>2</sub>O + 4e<sup>-</sup> → 4OH<sup>-</sup>). Hasil akhirnya adalah karat (Fe<sub>2</sub>O<sub>3</sub>·xH<sub>2</sub>O). Air, oksigen, dan elektrolit (garam/asam) mempercepat korosi.","alat":["Tabung reaksi 6 buah dan rak","Sumbat tabung","Amplas","Label"],"bahan":["Paku besi 6 buah (baru, ukuran sama)","Akuades","Air garam","Air yang telah dididihkan","Minyak goreng","Silika gel atau kapur tohor (zat pengering)","Kapas","Cat/vernis atau paku berlapis seng"],"keselamatan":["Kapur tohor bersifat korosif dan panas jika terkena air; gunakan sarung tangan.","Hati-hati menggunakan air mendidih."],"langkah":["Amplas paku hingga bersih, kecuali paku yang dicat/berlapis seng.","Tabung 1: paku + akuades (sebagian terendam). Tabung 2: paku + air garam. Tabung 3: paku + air yang baru dididihkan lalu ditutup lapisan minyak dan disumbat.","Tabung 4: paku + zat pengering (silika gel) yang ditutup kapas lalu disumbat. Tabung 5: paku terbuka di udara. Tabung 6: paku dicat/berlapis seng + akuades.","Amati setiap hari selama 3–5 hari dan dokumentasikan dengan kamera ponsel."],"pertanyaan":["Pada tabung mana korosi paling cepat dan paling lambat terjadi? Jelaskan.","Faktor apa saja yang diperlukan agar besi berkarat?","Mengapa air garam mempercepat korosi?","Jelaskan cara kerja pelapisan seng (galvanisasi) dalam mencegah korosi.","Berikan rekomendasi pencegahan korosi untuk pagar besi sekolah."]},"quiz":[{"q":"Pada elektrolisis larutan NaCl dengan elektrode karbon, zat yang dihasilkan di katode dan anode berturut-turut adalah …","o":["Na dan Cl<sub>2</sub>","H<sub>2</sub> dan Cl<sub>2</sub>","H<sub>2</sub> dan O<sub>2</sub>","Na dan O<sub>2</sub>","Cl<sub>2</sub> dan H<sub>2</sub>"],"a":"B","b":"Katode: air tereduksi menjadi H<sub>2</sub> dan OH<sup>−</sup>; anode: Cl<sup>−</sup> teroksidasi menjadi Cl<sub>2</sub>."},{"q":"Pada elektrolisis larutan CuSO<sub>4</sub> dengan elektrode karbon, reaksi di anode adalah …","o":["Cu<sup>2+</sup> + 2e<sup>-</sup> → Cu","2H<sub>2</sub>O → 4H<sup>+</sup> + O<sub>2</sub> + 4e<sup>-</sup>","2SO<sub>4</sub><sup>2-</sup> → S<sub>2</sub>O<sub>8</sub><sup>2-</sup> + 2e<sup>-</sup>","Cu → Cu<sup>2+</sup> + 2e<sup>-</sup>","2H<sub>2</sub>O + 2e<sup>-</sup> → H<sub>2</sub> + 2OH<sup>-</sup>"],"a":"B","b":"Ion sulfat sukar dioksidasi sehingga air yang teroksidasi."},{"q":"Larutan CuSO<sub>4</sub> dielektrolisis dengan arus 10 A selama 965 detik. Massa tembaga yang mengendap di katode adalah … (Ar Cu = 63,5; 1 F = 96.500 C)","o":["0,635 g","3,175 g","6,35 g","31,75 g","1,59 g"],"a":"B","b":"Q = 9.650 C = 0,1 F; mol Cu = 0,05; massa = 0,05 × 63,5 = 3,175 g."},{"q":"Muatan listrik sebesar 0,1 F dialirkan ke dalam larutan AgNO<sub>3</sub>. Massa perak yang mengendap adalah … (Ar Ag = 108)","o":["1,08 g","5,4 g","10,8 g","21,6 g","108 g"],"a":"C","b":"Ag<sup>+</sup> + e<sup>−</sup> → Ag; 0,1 mol × 108 = 10,8 g."},{"q":"Dua sel elektrolisis berisi larutan AgNO<sub>3</sub> dan CuSO<sub>4</sub> disusun seri. Jika pada sel pertama mengendap 2,16 g Ag, massa Cu yang mengendap adalah … (Ar Ag = 108, Cu = 63,5)","o":["0,3175 g","0,635 g","1,27 g","2,16 g","6,35 g"],"a":"B","b":"mol e<sup>−</sup> = 0,02; mol Cu = 0,01; massa = 0,635 g."},{"q":"Pada proses penyepuhan sendok besi dengan perak, sendok besi ditempatkan sebagai …","o":["anode","katode","jembatan garam","elektrolit","elektrode inert"],"a":"B","b":"Ion Ag<sup>+</sup> direduksi dan melapisi benda di katode."},{"q":"Pipa besi di dalam tanah dihubungkan dengan logam magnesium untuk mencegah korosi. Metode ini disebut …","o":["galvanisasi","pengecatan","perlindungan katodik","tin plating","elektrolisis"],"a":"C","b":"Mg lebih mudah teroksidasi sehingga berkorban melindungi besi."},{"q":"Paku besi akan paling cepat berkarat jika diletakkan dalam …","o":["udara kering","minyak","air garam","air yang dididihkan dan ditutup","wadah berisi silika gel"],"a":"C","b":"Air garam merupakan elektrolit yang mempercepat korosi."}],"pertemuan":[{"tp":"12.3.1","jp":3,"sub":"Sel elektrolisis dan reaksi di elektrode","aps":"Demonstrasi elektrolisis larutan KI dengan indikator PP dan amilum.","inti":[{"tag":"M","t":"Peserta didik membandingkan sel volta dan sel elektrolisis."},{"tag":"M","t":"Peserta didik menyusun aturan reaksi di katode dan anode berdasarkan data E° dan hasil demonstrasi."},{"tag":"A","t":"Peserta didik menuliskan reaksi elektrolisis lelehan dan larutan dengan elektrode inert."},{"tag":"R","t":"Peserta didik menjelaskan warna yang muncul pada demonstrasi."}],"form":"Latihan reaksi elektrolisis"},{"tp":"12.3.1","jp":2,"sub":"Elektrolisis dengan elektrode aktif","aps":"Apa yang terjadi bila anode terbuat dari tembaga?","inti":[{"tag":"M","t":"Peserta didik mempelajari reaksi pada anode aktif."},{"tag":"A","t":"Peserta didik menuliskan reaksi elektrolisis berbagai larutan dengan elektrode inert dan aktif."},{"tag":"R","t":"Peserta didik menyusun diagram alur penentuan reaksi elektrode."}],"form":"Kuis reaksi elektrolisis"},{"tp":"12.3.2","jp":3,"sub":"Hukum Faraday I","aps":"Berapa lama waktu menyepuh sebuah cincin?","inti":[{"tag":"M","t":"Guru memodelkan hubungan muatan listrik, mol elektron, dan massa zat."},{"tag":"A","t":"Peserta didik menghitung massa endapan dan volume gas hasil elektrolisis."},{"tag":"R","t":"Peserta didik merangkum langkah perhitungan Faraday."}],"form":"Latihan hukum Faraday I"},{"tp":"12.3.2","jp":3,"sub":"Hukum Faraday II dan studi kasus penyepuhan","aps":"Dua sel disusun seri: apakah massa endapannya sama?","inti":[{"tag":"M","t":"Peserta didik mempelajari hukum Faraday II."},{"tag":"A","t":"Kelompok menyelesaikan studi kasus penyepuhan (menghitung waktu, arus, dan biaya)."},{"tag":"R","t":"Pembahasan dan umpan balik."}],"form":"Penilaian studi kasus"},{"tp":"12.3.3","jp":3,"sub":"Elektrolisis dalam industri","aps":"Bagaimana tembaga untuk kabel listrik dimurnikan?","inti":[{"tag":"M","t":"Peserta didik menonton video penyepuhan, pemurnian tembaga, dan proses Hall-Héroult."},{"tag":"A","t":"Kelompok menyusun presentasi singkat tentang satu penerapan industri."},{"tag":"A","t":"Presentasi kelompok."},{"tag":"R","t":"Diskusi dampak lingkungan industri elektrolisis."}],"form":"Rubrik presentasi"},{"tp":"12.3.4","jp":2,"sub":"Mekanisme korosi dan memasang percobaan","aps":"Mengapa paku di dalam air garam cepat berkarat?","inti":[{"tag":"M","t":"Peserta didik mempelajari mekanisme elektrokimia korosi besi."},{"tag":"A","t":"Kelompok memasang percobaan korosi paku sesuai LKPD untuk diamati 3–5 hari."}],"form":"Rancangan percobaan dalam LKPD"},{"tp":"12.3.4","jp":2,"sub":"Hasil percobaan korosi dan pencegahannya","aps":"Paku mana yang paling cepat berkarat?","inti":[{"tag":"A","t":"Kelompok menganalisis data dan dokumentasi percobaan korosi."},{"tag":"M","t":"Peserta didik mempelajari cara pencegahan korosi (pengecatan, galvanisasi, perlindungan katodik)."},{"tag":"R","t":"Kelompok menyusun rekomendasi pencegahan korosi untuk fasilitas sekolah."}],"form":"LKPD dan rekomendasi kelompok"}],"media":[["Baterai 9 V, elektrode karbon pensil, larutan KI, PP, amilum","Alat demonstrasi","Elektrolisis larutan KI"],["Paku, air garam, silika gel, minyak","Alat praktikum","Percobaan korosi"],["Kamera ponsel","Media digital","Dokumentasi korosi harian"],["Video penyepuhan dan proses Hall-Héroult","Media audiovisual","Penerapan industri"],["Benda berkarat dan benda sepuhan","Benda nyata","Pemantik pembelajaran"]],"glosarium":[["Elektrolisis","Peristiwa penguraian zat oleh arus listrik searah."],["Elektrode inert","Elektrode yang tidak ikut bereaksi, misalnya Pt dan C."],["Faraday (F)","Muatan listrik 1 mol elektron, yaitu 96.500 C."],["Korosi","Kerusakan logam akibat reaksi redoks dengan lingkungannya."],["Galvanisasi","Pelapisan besi dengan seng untuk mencegah korosi."]],"slides":[{"lay":"hero","k":"Bab 3","t":"Elektrolisis dan Korosi","sim":"","img":{"f":"Shipboard-corrosion.JPG","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Shipboard-corrosion.JPG?width=1280","src":"https://commons.wikimedia.org/wiki/File:Shipboard-corrosion.JPG","alt":"Shipboard-corrosion","cap":""},"body":"Listrik untuk mengubah zat, dan musuh bernama karat"},{"lay":"split","k":"Pertanyaan pemantik","t":"Mengapa atap seng dan pagar di dekat pantai cepat berkarat?","sim":"","img":{"f":"Rusted_Iron_Sheet.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Rusted_Iron_Sheet.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Rusted_Iron_Sheet.jpg","alt":"Rusted Iron Sheet","cap":""},"body":["Bagaimana sendok besi bisa dilapisi perak?","Bagaimana aluminium untuk kaleng minuman diproduksi?"]},{"lay":"splitR","k":"Materi","t":"Sel Elektrolisis","sim":"XII-3b","img":{"f":"Hofmann_voltameter_1866.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Hofmann_voltameter_1866.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Hofmann_voltameter_1866.jpg","alt":"Voltameter Hofmann: elektrolisis air","cap":"Voltameter Hofmann: elektrolisis air"},"html":"<p>Sel elektrolisis mengubah energi listrik menjadi energi kimia (reaksi tidak spontan). Katode (−): reduksi; anode (+): oksidasi.</p><table><tr><th>Elektrode</th><th>Kondisi</th><th>Reaksi yang terjadi</th></tr><tr><td>Katode</td><td>Kation logam IA, IIA, Al, Mn dalam larutan</td><td>Air direduksi: 2H<sub>2</sub>O + 2e<sup>-</sup> → H<sub>2</sub> + 2OH<sup>-</sup></td></tr><tr><td>Katode</td><td>Kation logam lain dan H<sup>+</sup></td><td>Kation direduksi, misalnya Cu<sup>2+</sup> + 2e<sup>-</sup> → Cu</td></tr><tr><td>Katode</td><td>Lelehan (tanpa air)</td><td>Kation logam direduksi</td></tr><tr><td>Anode inert (C, Pt, Au)</td><td>Anion sisa asam oksi (SO<sub>4</sub><sup>2-</sup>, NO<sub>3</sub><sup>-</sup>)</td><td>Air dioksidasi: 2H<sub>2</sub>O → 4H<sup>+</sup> + O<sub>2</sub> + 4e<sup>-</sup></td></tr><tr><td>Anode inert</td><td>Ion halida (Cl<sup>-</sup>, Br<sup>-</sup>, I<sup>-</sup>)</td><td>Halida dioksidasi: 2Cl<sup>-</sup> → Cl<sub>2</sub> + 2e<sup>-</sup></td></tr><tr><td>Anode inert</td><td>Ion OH<sup>-</sup></td><td>4OH<sup>-</sup> → 2H<sub>2</sub>O + O<sub>2</sub> + 4e<sup>-</sup></td></tr><tr><td>Anode aktif (selain C, Pt, Au)</td><td>Semua jenis larutan</td><td>Logam anode teroksidasi: M → M<sup>n+</sup> + ne<sup>-</sup></td></tr></table>"},{"lay":"split","k":"Materi","t":"Hukum Faraday","sim":"XII-3","img":{"f":"Portrait_of_Michael_Faraday_(1791-1867)_Wellcome_M0011250.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Portrait_of_Michael_Faraday_(1791-1867)_Wellcome_M0011250.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Portrait_of_Michael_Faraday_(1791-1867)_Wellcome_M0011250.jpg","alt":"Michael Faraday (1791–1867)","cap":"Michael Faraday (1791–1867)"},"html":"<div class=\"formula\">Mol elektron = Q ÷ F = (i × t) ÷ 96.500</div><div class=\"formula\">Hukum Faraday I: w = (e × i × t) ÷ 96.500,  dengan e = Ar ÷ jumlah elektron (massa ekuivalen)</div><div class=\"formula\">Hukum Faraday II (sel seri): w<sub>1</sub> : w<sub>2</sub> = e<sub>1</sub> : e<sub>2</sub></div>"},{"lay":"gallery","k":"Materi","t":"Penerapan Elektrolisis","sim":"XII-3","imgs":[{"f":"PCB_copper_layer_electroplating_machine.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/PCB_copper_layer_electroplating_machine.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:PCB_copper_layer_electroplating_machine.jpg","alt":"Mesin penyepuhan tembaga","cap":"Mesin penyepuhan tembaga"},{"f":"Bundles_of_cathode_copper.png","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Bundles_of_cathode_copper.png?width=1280","src":"https://commons.wikimedia.org/wiki/File:Bundles_of_cathode_copper.png","alt":"Katode tembaga murni","cap":"Katode tembaga murni"},{"f":"Aluminum_ingots_at_Norwegian_Aluminium_Company.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Aluminum_ingots_at_Norwegian_Aluminium_Company.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Aluminum_ingots_at_Norwegian_Aluminium_Company.jpg","alt":"Batangan aluminium","cap":"Batangan aluminium"}],"html":"<ul><li><b>Penyepuhan:</b> benda yang disepuh sebagai katode, logam penyepuh sebagai anode, elektrolit berisi ion logam penyepuh.</li><li><b>Pemurnian tembaga:</b> tembaga kotor sebagai anode, tembaga murni sebagai katode.</li><li><b>Produksi logam dan bahan kimia:</b> aluminium (proses Hall-Héroult dari Al<sub>2</sub>O<sub>3</sub> dalam kriolit cair), natrium (lelehan NaCl), serta NaOH dan Cl<sub>2</sub> (elektrolisis larutan NaCl).</li></ul>"},{"lay":"splitR","k":"Materi","t":"Korosi dan Pencegahannya","sim":"XII-3c","img":{"f":"Anode_sacrificielle_en_zinc_(2).JPG","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Anode_sacrificielle_en_zinc_(2).JPG?width=1280","src":"https://commons.wikimedia.org/wiki/File:Anode_sacrificielle_en_zinc_(2).JPG","alt":"Anode korban seng pada kapal","cap":"Anode korban seng pada kapal"},"html":"<p>Korosi besi adalah reaksi elektrokimia. Anode: Fe → Fe<sup>2+</sup> + 2e<sup>-</sup>; katode: O<sub>2</sub> + 2H<sub>2</sub>O + 4e<sup>-</sup> → 4OH<sup>-</sup>. Fe<sup>2+</sup> teroksidasi lebih lanjut menjadi karat Fe<sub>2</sub>O<sub>3</sub>·xH<sub>2</sub>O. Korosi dipercepat oleh air, oksigen, elektrolit (garam, asam), dan kontak dengan logam yang kurang aktif.</p><ul><li>Pencegahan: pengecatan, pelumuran oli/minyak, pembalutan plastik, galvanisasi (pelapisan Zn), tin plating (pelapisan Sn pada kaleng), perlindungan katodik (dihubungkan dengan Mg), dan pembuatan paduan (baja tahan karat).</li></ul>"},{"lay":"gallery","k":"Korosi dan pencegahannya","t":"Mengapa sebagian logam berkarat lebih cepat?","sim":"XII-3c","imgs":[{"f":"Steel-copper_galvanic_corrosion.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Steel-copper_galvanic_corrosion.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Steel-copper_galvanic_corrosion.jpg","alt":"Besi–tembaga: korosi galvanik","cap":"Besi–tembaga: korosi galvanik"},{"f":"Galvanized_lamppost.JPG","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Galvanized_lamppost.JPG?width=1280","src":"https://commons.wikimedia.org/wiki/File:Galvanized_lamppost.JPG","alt":"Tiang lampu galvanis (dilapisi Zn)","cap":"Tiang lampu galvanis (dilapisi Zn)"},{"f":"Rust_on_iron.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Rust_on_iron.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Rust_on_iron.jpg","alt":"Karat Fe₂O₃·xH₂O","cap":"Karat Fe₂O₃·xH₂O"}],"body":"Besi yang bersentuhan dengan logam kurang aktif (Cu) berkarat lebih cepat; dilapisi logam lebih aktif (Zn) justru terlindungi."},{"lay":"contoh","k":"","t":"","sim":"","q":"Berapa lama arus 2 A harus dialirkan untuk mengendapkan 1,27 g Cu dari larutan CuSO<sub>4</sub>? (Ar Cu = 63,5)","a":"mol Cu = 0,02 → mol e<sup>−</sup> = 0,04 → Q = 0,04 × 96.500 = 3.860 C → t = 3.860/2 = 1.930 s (± 32 menit)."},{"lay":"refleksi","k":"","t":"","sim":""}]},{"kode":"XII-4","no":4,"sem":2,"jp":18,"judul":"Senyawa Karbon dan Hidrokarbon","sym":"Hk","topik":"Karbon, si atom serba bisa: dari LPG hingga bensin","pemantik":["Mengapa LPG, bensin, dan lilin yang sama-sama tersusun atas C dan H memiliki wujud berbeda?","Apa arti angka oktan pada bensin?","Mengapa knalpot kendaraan yang tidak terawat berbahaya?"],"pemahaman":"Kemampuan unik atom karbon membentuk rantai menghasilkan jutaan senyawa dengan sifat berbeda, termasuk bahan bakar yang kita gunakan setiap hari dan dampaknya bagi kualitas udara.","tp":[{"k":"12.4.1","t":"Menjelaskan kekhasan atom karbon dan mengidentifikasi atom C primer, sekunder, tersier, dan kuarterner"},{"k":"12.4.2","t":"Memberi nama dan menuliskan struktur alkana, alkena, dan alkuna menurut aturan IUPAC"},{"k":"12.4.3","t":"Menentukan isomer struktur dan isomer geometri senyawa hidrokarbon"},{"k":"12.4.4","t":"Menjelaskan sifat fisik dan reaksi-reaksi senyawa hidrokarbon"},{"k":"12.4.5","t":"Menganalisis fraksi minyak bumi, bilangan oktan, dan dampak pembakaran bahan bakar"}],"materi":[{"h":"Kekhasan Atom Karbon","html":"<p>Atom karbon memiliki 4 elektron valensi sehingga dapat membentuk 4 ikatan kovalen, membentuk rantai panjang (lurus, bercabang, siklik), serta ikatan tunggal, rangkap dua, dan rangkap tiga. Akibatnya jumlah senyawa karbon sangat banyak.</p><ul><li>Atom C primer (mengikat 1 atom C lain), sekunder (2), tersier (3), dan kuarterner (4).</li></ul>"},{"h":"Alkana, Alkena, dan Alkuna","html":"<table><tr><th>Golongan</th><th>Rumus umum</th><th>Ikatan</th><th>Contoh</th></tr><tr><td>Alkana</td><td>C<sub>n</sub>H<sub>2n+2</sub></td><td>Tunggal (jenuh)</td><td>metana CH<sub>4</sub>, propana C<sub>3</sub>H<sub>8</sub></td></tr><tr><td>Alkena</td><td>C<sub>n</sub>H<sub>2n</sub></td><td>Satu rangkap dua</td><td>etena C<sub>2</sub>H<sub>4</sub></td></tr><tr><td>Alkuna</td><td>C<sub>n</sub>H<sub>2n−2</sub></td><td>Satu rangkap tiga</td><td>etuna C<sub>2</sub>H<sub>2</sub></td></tr></table>"},{"h":"Tata Nama IUPAC","html":"<ul><li>Tentukan rantai terpanjang (untuk alkena/alkuna: harus memuat ikatan rangkap).</li><li>Beri nomor dari ujung yang paling dekat dengan cabang (alkena/alkuna: paling dekat ikatan rangkap).</li><li>Tulis nama: nomor cabang–nama cabang (urut abjad, gunakan di-, tri- bila sama) + nama rantai induk. Contoh: 2,2,4-trimetilpentana; 4-metil-2-pentena.</li></ul>"},{"h":"Isomer","html":"<ul><li>Isomer rangka (beda rantai), isomer posisi (beda letak ikatan rangkap/gugus), isomer geometri cis-trans pada alkena yang setiap atom C rangkapnya mengikat dua gugus berbeda (cis-2-butena dan trans-2-butena).</li></ul>"},{"h":"Sifat dan Reaksi Hidrokarbon","html":"<ul><li>Titik didih naik dengan bertambahnya Mr; untuk isomer, makin banyak cabang titik didih makin rendah.</li><li>Reaksi: substitusi (alkana + halogen), adisi (alkena/alkuna + H<sub>2</sub>, X<sub>2</sub>, HX; aturan Markovnikov), eliminasi, dan pembakaran.</li></ul>"},{"h":"Minyak Bumi","html":"<p>Minyak bumi berasal dari pelapukan organisme laut selama jutaan tahun dan dipisahkan melalui distilasi bertingkat berdasarkan perbedaan titik didih: gas (LPG), bensin, kerosin, solar, oli, dan residu (aspal).</p><p>Bilangan oktan menyatakan mutu bensin terhadap ketukan (knocking): campuran isooktana (oktan 100) dan n-heptana (oktan 0). Pembakaran tidak sempurna menghasilkan CO yang beracun; emisi CO<sub>2</sub> memicu efek rumah kaca.</p>"}],"contoh":[{"q":"Beri nama: CH<sub>3</sub>–CH(CH<sub>3</sub>)–CH=CH–CH<sub>3</sub>.","a":"Rantai induk 5 C memuat ikatan rangkap, penomoran dari kanan: rangkap pada C2, metil pada C4 → 4-metil-2-pentena (4-metilpent-2-ena)."}],"rangkuman":"Kekhasan atom C → alkana, alkena, alkuna → tata nama → isomer → sifat &amp; reaksi → minyak bumi.","lkpd":{"judul":"Uji Keberadaan Unsur Karbon dan Hidrogen dalam Senyawa Organik","tujuan":"Membuktikan adanya unsur C dan H dalam senyawa organik melalui uji pembakaran.","dasar":"Senyawa organik yang dibakar dengan oksidator (CuO) akan menghasilkan CO<sub>2</sub> dan H<sub>2</sub>O. Gas CO<sub>2</sub> mengeruhkan air kapur (Ca(OH)<sub>2</sub>) membentuk endapan CaCO<sub>3</sub>, sedangkan uap air mengubah warna kertas kobalt(II) klorida dari biru menjadi merah muda (atau CuSO<sub>4</sub> anhidrat dari putih menjadi biru).","alat":["Tabung reaksi besar dan sumbat berlubang","Pipa penghubung (selang/pipa kaca bengkok)","Pembakar spiritus","Statif dan klem","Tabung reaksi berisi air kapur"],"bahan":["Gula pasir (sukrosa) atau serbuk lilin","Serbuk CuO","Air kapur jernih","Kertas kobalt klorida atau CuSO<sub>4</sub> anhidrat"],"keselamatan":["Gunakan kacamata pelindung saat memanaskan.","Lepaskan pipa dari air kapur sebelum api dimatikan untuk mencegah air kapur tersedot balik."],"langkah":["Campurkan satu sendok gula dengan dua sendok CuO, masukkan ke tabung reaksi besar.","Tutup tabung dengan sumbat berpipa dan alirkan ujung pipa ke tabung berisi air kapur.","Panaskan campuran perlahan dan amati perubahan pada air kapur.","Amati juga bagian dalam mulut tabung dan uji tetesan cairan dengan kertas kobalt klorida/CuSO<sub>4</sub> anhidrat.","Sebelum mematikan api, angkat pipa dari air kapur."],"pertanyaan":["Tuliskan reaksi antara CO<sub>2</sub> dan air kapur.","Apa fungsi CuO dalam percobaan ini?","Berdasarkan pengamatan, unsur apa saja yang terdapat dalam gula? Jelaskan buktinya.","Mengapa atom karbon dapat membentuk begitu banyak senyawa?"]},"quiz":[{"q":"Nama IUPAC untuk senyawa CH<sub>3</sub>–CH(CH<sub>3</sub>)–CH<sub>2</sub>–CH<sub>3</sub> adalah …","o":["2-metilbutana","3-metilbutana","pentana","2-etilpropana","isobutana"],"a":"A","b":"Rantai terpanjang 4 C, cabang metil pada C nomor 2."},{"q":"Jumlah isomer struktur C<sub>5</sub>H<sub>12</sub> adalah …","o":["2","3","4","5","6"],"a":"B","b":"n-pentana, 2-metilbutana, dan 2,2-dimetilpropana."},{"q":"Nama senyawa CH<sub>2</sub>=CH–CH<sub>2</sub>–CH<sub>3</sub> adalah …","o":["2-butena","1-butena","butana","1-butuna","propena"],"a":"B","b":"Ikatan rangkap pada atom C nomor 1 → 1-butena (but-1-ena)."},{"q":"Reaksi CH<sub>4</sub> + Cl<sub>2</sub> → CH<sub>3</sub>Cl + HCl termasuk reaksi …","o":["adisi","substitusi","eliminasi","oksidasi","polimerisasi"],"a":"B","b":"Atom H diganti oleh atom Cl."},{"q":"Reaksi CH<sub>2</sub>=CH<sub>2</sub> + HBr → CH<sub>3</sub>–CH<sub>2</sub>Br termasuk reaksi …","o":["substitusi","eliminasi","adisi","kondensasi","pembakaran"],"a":"C","b":"Ikatan rangkap terbuka dan atom H serta Br ditambahkan."},{"q":"Di antara isomer C<sub>5</sub>H<sub>12</sub>, yang memiliki titik didih paling tinggi adalah …","o":["2,2-dimetilpropana","2-metilbutana","n-pentana","semua sama","3-metilbutana"],"a":"C","b":"Rantai lurus memiliki luas permukaan kontak terbesar sehingga gaya London paling kuat."},{"q":"Bensin dengan bilangan oktan 80 berarti an bahan bakar"},{"f":"Traffic_Exhaust_fumes_Pollution_1.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Traffic_Exhaust_fumes_Pollution_1.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Traffic_Exhaust_fumes_Pollution_1.jpg","alt":"Emisi gas buang","cap":"Emisi gas buang"}],"body":"Bensin beroktan sesuai mencegah ketukan mesin; pembakaran tidak sempurna menghasilkan gas CO yang beracun."},{"lay":"contoh","k":"","t":"","sim":"","q":"Beri nama: CH<sub>3</sub>–CH(CH<sub>3</sub>)–CH=CH–CH<sub>3</sub>.","a":"Rantai induk 5 C memuat ikatan rangkap, penomoran dari kanan: rangkap pada C2, metil pada C4 → 4-metil-2-pentena (4-metilpent-2-ena)."},{"lay":"refleksi","k":"","t":"","sim":""}]},{"kode":"XII-5","no":5,"sem":2,"jp":20,"judul":"Senyawa Turunan Hidrokarbon","sym":"Gf","topik":"Kimia organik di dapur dan lemari kita: kenali, manfaatkan, waspadai","pemantik":["Apa kesamaan hand sanitizer, cuka, dan pembersih kuteks?","Dari mana aroma buah pada permen?","Bagaimana cara mengenali makanan yang mengandung formalin?"],"pemahaman":"Penggantian atom H pada hidrokarbon dengan gugus fungsi menghasilkan senyawa dengan sifat dan kegunaan khas, sehingga kita perlu mengenalinya untuk memanfaatkan secara tepat dan menghindari penyalahgunaannya.","tp":[{"k":"12.5.1","t":"Mengidentifikasi gugus fungsi senyawa turunan alkana (haloalkana, alkohol, eter, aldehida, keton, asam karboksilat, dan ester)"},{"k":"12.5.2","t":"Memberi nama IUPAC dan trivial serta menentukan isomer senyawa turunan alkana"},{"k":"12.5.3","t":"Membedakan senyawa turunan alkana melalui uji laboratorium"},{"k":"12.5.4","t":"Menjelaskan reaksi senyawa turunan alkana serta kegunaan dan dampaknya dalam kehidupan"}],"materi":[{"h":"Gugus Fungsi","html":"<table><tr><th>Golongan</th><th>Gugus fungsi</th><th>Rumus umum</th><th>Contoh dan kegunaan</th></tr><tr><td>Haloalkana</td><td>–X</td><td>R–X</td><td>Kloroform (pelarut), freon (pendingin)</td></tr><tr><td>Alkohol</td><td>–OH</td><td>R–OH</td><td>Etanol (antiseptik, bahan bakar)</td></tr><tr><td>Eter</td><td>–O–</td><td>R–O–R′</td><td>Dietil eter (pelarut, anestesi dahulu)</td></tr><tr><td>Aldehida</td><td>–CHO</td><td>R–CHO</td><td>Metanal/formalin (pengawet spesimen)</td></tr><tr><td>Keton</td><td>–CO–</td><td>R–CO–R′</td><td>Propanon/aseton (pelarut)</td></tr><tr><td>Asam karboksilat</td><td>–COOH</td><td>R–COOH</td><td>Asam asetat (cuka)</td></tr><tr><td>Ester</td><td>–COO–</td><td>R–COO–R′</td><td>Etil butirat (aroma nanas)</td></tr></table>"},{"h":"Tata Nama dan Isomer","html":"<ul><li>Alkohol: akhiran -ol (2-propanol/propan-2-ol). Eter: alkoksi alkana (metoksietana). Aldehida: akhiran -al. Keton: akhiran -on. Asam karboksilat: asam alkanoat. Ester: alkil alkanoat.</li><li>Isomer fungsi: alkohol–eter (C<sub>n</sub>H<sub>2n+2</sub>O), aldehida–keton (C<sub>n</sub>H<sub>2n</sub>O), asam karboksilat–ester (C<sub>n</sub>H<sub>2n</sub>O<sub>2</sub>).</li></ul>"},{"h":"Uji Pembeda","html":"<ul><li>Alkohol bereaksi dengan logam Na menghasilkan H<sub>2</sub>; eter tidak.</li><li>Aldehida positif terhadap pereaksi Fehling (endapan merah bata Cu<sub>2</sub>O) dan Tollens (cermin perak); keton negatif.</li></ul>"},{"h":"Reaksi-Reaksi Penting","html":"<ul><li>Oksidasi alkohol: primer → aldehida → asam karboksilat; sekunder → keton; tersier tidak teroksidasi.</li><li>Esterifikasi: asam karboksilat + alkohol ⇌ ester + air (katalis H<sub>2</sub>SO<sub>4</sub> pekat).</li><li>Substitusi haloalkana dan eliminasi (dehidrasi alkohol menjadi alkena).</li></ul>"},{"h":"Keamanan Penggunaan","html":"<p>Formalin dan boraks dilarang digunakan pada makanan. Ciri makanan berformalin antara lain tidak mudah busuk dalam waktu lama dan tidak dihinggapi lalat. Metanol sangat beracun dan dapat menyebabkan kebutaan. CFC merusak lapisan ozon.</p>"}],"contoh":[{"q":"Tuliskan reaksi pembuatan etil etanoat dan sebutkan nama reaksinya.","a":"CH<sub>3</sub>COOH + C<sub>2</sub>H<sub>5</sub>OH ⇌ CH<sub>3</sub>COOC<sub>2</sub>H<sub>5</sub> + H<sub>2</sub>O (katalis H<sub>2</sub>SO<sub>4</sub> pekat) — reaksi esterifikasi."}],"rangkuman":"Gugus fungsi → tata nama → isomer → uji pembeda → reaksi → kegunaan dan dampak.","lkpd":{"judul":"Membedakan Aldehida dan Keton dengan Pereaksi Fehling","tujuan":"Membedakan senyawa aldehida dan keton menggunakan pereaksi Fehling.","dasar":"Aldehida mudah dioksidasi menjadi asam karboksilat, sedangkan keton sukar dioksidasi. Pereaksi Fehling (larutan ion Cu<sup>2+</sup> dalam suasana basa, berwarna biru) akan membentuk endapan merah bata Cu<sub>2</sub>O bila direaksikan dengan aldehida. Glukosa memiliki gugus aldehida sehingga memberikan uji positif.","alat":["Tabung reaksi 3 buah dan rak","Pipet tetes","Gelas kimia 250 mL (penangas air)","Pembakar spiritus, kaki tiga, kasa","Penjepit tabung"],"bahan":["Pereaksi Fehling A dan B","Larutan glukosa 10%","Aseton","Akuades"],"keselamatan":["Aseton mudah terbakar; jauhkan dari api langsung dan gunakan penangas air.","Pereaksi Fehling bersifat korosif; gunakan sarung tangan dan kacamata."],"langkah":["Campurkan Fehling A dan Fehling B dengan volume sama (masing-masing 2 mL) di setiap tabung.","Tabung 1: tambahkan 1 mL glukosa. Tabung 2: tambahkan 1 mL aseton. Tabung 3: tambahkan 1 mL akuades (kontrol).","Panaskan ketiga tabung dalam penangas air ± 5 menit.","Amati perubahan warna dan endapan yang terbentuk."],"pertanyaan":["Zat mana yang memberikan hasil positif? Apa buktinya?","Mengapa aldehida dapat bereaksi dengan Fehling, sedangkan keton tidak?","Tuliskan rumus struktur propanal dan propanon. Apa hubungan kedua senyawa tersebut?","Sebutkan satu penerapan uji Fehling dalam bidang kesehatan."]},"quiz":[{"q":"Gugus fungsi –COOH merupakan ciri senyawa …","o":["alkohol","aldehida","keton","asam karboksilat","ester"],"a":"D","b":"Gugus karboksil."},{"q":"Senyawa CH<sub>3</sub>–O–CH<sub>3</sub> berisomer fungsi dengan …","o":["metanol","etanol","propanol","etanal","asam etanoat"],"a":"B","b":"Keduanya memiliki rumus molekul C<sub>2</sub>H<sub>6</sub>O."},{"q":"Pasangan senyawa berikut yang merupakan isomer fungsi adalah …","o":["propanal dan propanon","etanol dan metanol","butana dan butena","etanal dan etanol","propanol dan propana"],"a":"A","b":"Keduanya C<sub>3</sub>H<sub>6</sub>O dengan gugus fungsi berbeda."},{"q":"Senyawa yang menghasilkan endapan merah bata dengan pereaksi Fehling adalah …","o":["propanon","etanol","etanal","dietil eter","asam asetat"],"a":"C","b":"Aldehida mereduksi Cu<sup>2+</sup> menjadi Cu<sub>2</sub>O."},{"q":"Oksidasi 2-propanol menghasilkan …","o":["propanal","propanon","asam propanoat","propena","dipropil eter"],"a":"B","b":"Alkohol sekunder dioksidasi menjadi keton."},{"q":"Reaksi asam asetat dengan etanol (katalis H<sub>2</sub>SO<sub>4</sub>) menghasilkan …","o":["etil etanoat dan air","dietil eter","etanal","etena dan air","metil propanoat"],"a":"A","b":"Reaksi esterifikasi: CH<sub>3</sub>COOH + C<sub>2</sub>H<sub>5</sub>OH → CH<sub>3</sub>COOC<sub>2</sub>H<sub>5</sub> + H<sub>2</sub>O."},{"q":"Nama IUPAC senyawa CH<sub>3</sub>–CH(OH)–CH<sub>2</sub>–CH<sub>3</sub> adalah …","o":["1-butanol","2-butanol","3-butanol","2-metilpropanol","butanal"],"a":"B","b":"Gugus –OH pada atom C nomor 2 → butan-2-ol."},{"q":"Formalin (larutan metanal) seharusnya digunakan untuk …","o":["pengawet ikan segar","pengawet tahu","pengawet spesimen biologi/jenazah","penyedap makanan","pemanis"],"a":"C","b":"Formalin bersifat toksik dan dilarang untuk makanan."}],"pertemuan":[{"tp":"12.5.1","jp":3,"sub":"Gugus fungsi senyawa turunan alkana","aps":"Guru menunjukkan hand sanitizer, cuka, aseton, dan permen beraroma buah.","inti":[{"tag":"M","t":"Peserta didik mengelompokkan kartu struktur berdasarkan gugus fungsi."},{"tag":"A","t":"Peserta didik menyusun tabel gugus fungsi, rumus umum, contoh, dan kegunaan."},{"tag":"A","t":"Peserta didik mengidentifikasi gugus fungsi pada produk sehari-hari."},{"tag":"R","t":"Peserta didik menuliskan gugus fungsi yang paling sering dijumpai di n struktur dengan ikatan tunggal dan rangkap berselang-seling. Kini diketahui keenam ikatan C–C sama panjang karena elektron π terdelokalisasi (resonansi), sehingga benzena sangat stabil dan cenderung mengalami substitusi, bukan adisi.</p>"},{"h":"Tata Nama Turunan Benzena","html":"<table><tr><th>Rumus</th><th>Nama</th><th>Kegunaan</th></tr><tr><td>C<sub>6</sub>H<sub>5</sub>–CH<sub>3</sub></td><td>Toluena</td><td>Pelarut, bahan baku TNT</td></tr><tr><td>C<sub>6</sub>H<sub>5</sub>–OH</td><td>Fenol</td><td>Desinfektan (karbol), bahan plastik</td></tr><tr><td>C<sub>6</sub>H<sub>5</sub>–NH<sub>2</sub></td><td>Anilina</td><td>Bahan zat warna</td></tr><tr><td>C<sub>6</sub>H<sub>5</sub>–COOH</td><td>Asam benzoat</td><td>Bahan pengawet (garamnya: natrium benzoat)</td></tr><tr><td>C<sub>6</sub>H<sub>5</sub>–CHO</td><td>Benzaldehida</td><td>Aroma almon</td></tr><tr><td>C<sub>6</sub>H<sub>5</sub>–NO<sub>2</sub></td><td>Nitrobenzena</td><td>Bahan baku anilina</td></tr><tr><td>C<sub>6</sub>H<sub>5</sub>–Cl</td><td>Klorobenzena</td><td>Bahan baku pestisida dan fenol</td></tr></table>"},{"h":"Turunan Disubstitusi","html":"<p>Posisi dua substituen: orto (1,2), meta (1,3), dan para (1,4). Contoh: asam salisilat (asam o-hidroksibenzoat), p-diklorobenzena (kamper/kapur barus), parasetamol (p-hidroksiasetanilida).</p>"},{"h":"Reaksi Substitusi Benzena","html":"<ul><li>Nitrasi: benzena + HNO<sub>3</sub> (katalis H<sub>2</sub>SO<sub>4</sub>) → nitrobenzena + H<sub>2</sub>O.</li><li>Halogenasi: benzena + Cl<sub>2</sub> (katalis FeCl<sub>3</sub>) → klorobenzena + HCl.</li><li>Sulfonasi: benzena + H<sub>2</sub>SO<sub>4</sub> → asam benzenasulfonat + H<sub>2</sub>O.</li><li>Alkilasi Friedel-Crafts: benzena + CH<sub>3</sub>Cl (katalis AlCl<sub>3</sub>) → toluena + HCl.</li></ul>"},{"h":"Dampak Kesehatan dan Lingkungan","html":"<p>Benzena bersifat karsinogenik sehingga penggunaannya sebagai pelarut dibatasi. Zat aditif turunan benzena pada pangan (misalnya natrium benzoat) aman bila digunakan sesuai batas maksimum yang ditetapkan BPOM.</p>"}],"contoh":[{"q":"Tuliskan nama senyawa benzena yang mengikat gugus –OH dan –COOH pada posisi orto, serta kegunaannya.","a":"Asam o-hidroksibenzoat (asam salisilat); digunakan dalam obat kulit/jerawat dan bahan baku aspirin."}],"rangkuman":"Struktur benzena → tata nama turunan → reaksi substitusi → kegunaan &amp; dampak.","lkpd":{"judul":"Kajian Senyawa Turunan Benzena pada Label Produk","tujuan":"Mengidentifikasi senyawa turunan benzena dalam produk sehari-hari dan menganalisis kegunaan serta keamanannya.","dasar":"Banyak produk mengandung senyawa turunan benzena, misalnya natrium benzoat (pengawet), parasetamol dan asam asetilsalisilat (obat), serta asam salisilat (kosmetik). Penggunaannya aman bila sesuai takaran dan batas yang ditetapkan oleh BPOM.","alat":["Kemasan produk (minuman, saus, obat, kosmetik) minimal 4 jenis","Ponsel/laptop untuk penelusuran informasi","Lembar kerja"],"bahan":[],"keselamatan":["Jangan mengonsumsi produk yang dikaji.","Gunakan sumber informasi resmi dan terpercaya (BPOM, jurnal, buku teks)."],"langkah":["Kumpulkan minimal 4 kemasan produk yang mencantumkan komposisi.","Identifikasi senyawa dalam komposisi yang merupakan turunan benzena.","Gambarkan rumus struktur senyawa tersebut dan tentukan gugus substituennya.","Cari informasi tentang fungsi senyawa dan batas aman penggunaannya dari sumber resmi.","Susun hasil kajian dalam tabel dan presentasikan."],"pertanyaan":["Senyawa turunan benzena apa yang paling sering kamu temukan? Mengapa?","Apa fungsi gugus –COONa pada natrium benzoat dibandingkan asam benzoat?","Bagaimana sikapmu sebagai konsumen dalam memilih produk yang mengandung bahan tambahan?"]},"quiz":[{"q":"Rumus molekul benzena adalah …","o":["C<sub>6</sub>H<sub>12</sub>","C<sub>6</sub>H<sub>6</sub>","C<sub>6</sub>H<sub>14</sub>","C<sub>5</sub>H<sub>5</sub>","C<sub>6</sub>H<sub>10</sub>"],"a":"B","b":"Benzena: C<sub>6</sub>H<sub>6</sub>."},{"q":"Senyawa C<sub>6</sub>H<sub>5</sub>
