  // ---- XI-2b Pembentuk ikatan ----
  S['XI-2b'] = {
    title: 'Pembentuk Ikatan Kimia', intro: 'Pilih dua unsur. Simulasi menentukan jenis ikatan dari selisih keelektronegatifan dan sifat logam/nonlogam, lalu menampilkan rumus senyawanya.',
    mount(root) {
      const E = { Na: [.93, 'L', 1, 1], K: [.82, 'L', 1, 1], Mg: [1.31, 'L', 2, 2], Ca: [1, 'L', 2, 2], Al: [1.61, 'L', 3, 3], H: [2.2, 'N', 1, 1], C: [2.55, 'N', 4, 4], N: [3.04, 'N', 3, 5], O: [3.44, 'N', 2, 6], F: [3.98, 'N', 1, 7], Cl: [3.16, 'N', 1, 7], S: [2.58, 'N', 2, 6] };
      const opt = v => Object.keys(E).map(k => `<option ${k === v ? 'selected' : ''}>${k}</option>`).join('');
      root.innerHTML = `<div class="sim-grid"><div class="sim-panel"><label class="sim-ctl"><span>Unsur 1</span><select id="a">${opt('Na')}</select></label><label class="sim-ctl"><span>Unsur 2</span><select id="b">${opt('Cl')}</select></label><div class="sim-out big" id="bo"></div></div><canvas class="sim-canvas" id="bc" style="height:300px"></canvas></div>`;
      let raf, t = 0;
      const sb = n => n > 1 ? '<sub>' + n + '</sub>' : '';
      function info() {
        const a = root.querySelector('#a').value, b = root.querySelector('#b').value; const A = E[a], B = E[b]; const d = Math.abs(A[0] - B[0]);
        if (A[1] === 'L' && B[1] === 'L') return { type: 'logam', f: a === b ? a : a + '–' + b + ' (paduan)', d, a, b };
        if (A[1] !== B[1]) { const [m, nm] = A[1] === 'L' ? [a, b] : [b, a]; const cq = E[m][2], aq = E[nm][2]; const g = (x, y) => y ? g(y, x % y) : x; const l = cq * aq / g(cq, aq); return { type: 'ion', f: m + sb(l / cq) + nm + sb(l / aq), d, a: m, b: nm, ion: `${m}${cq > 1 ? '<sup>' + cq + '+</sup>' : '<sup>+</sup>'} dan ${nm}<sup>${aq > 1 ? aq : ''}−</sup>` }; }
        if (a === b) { const f = a === 'H' ? 'H₂' : a + '<sub>2</sub>'; return { type: 'nonpolar', f, d: 0, a, b, ikat: { H: 'tunggal', F: 'tunggal', Cl: 'tunggal', O: 'rangkap dua', N: 'rangkap tiga', C: 'jaringan (intan/grafit)', S: 'S₈ (cincin)' }[a] }; }
        const special = { 'O,S': 'SO<sub>2</sub>', 'N,O': 'NO<sub>2</sub>', 'C,O': 'CO<sub>2</sub>', 'C,S': 'CS<sub>2</sub>', 'Cl,O': 'Cl<sub>2</sub>O', 'F,O': 'OF<sub>2</sub>', 'C,N': '(CN)<sub>2</sub>', 'N,S': 'S<sub>4</sub>N<sub>4</sub>', 'Cl,F': 'ClF', 'Cl,S': 'SCl<sub>2</sub>', 'F,S': 'SF<sub>6</sub>', 'C,F': 'CF<sub>4</sub>', 'C,Cl': 'CCl<sub>4</sub>', 'Cl,N': 'NCl<sub>3</sub>', 'F,N': 'NF<sub>3</sub>' };
        const key = [a, b].sort().join(','); let f = special[key];
        if (!f) { if (a === 'H' || b === 'H') { const X = a === 'H' ? b : a; f = ['C', 'N'].includes(X) ? X + 'H' + sb(E[X][2]) : 'H' + sb(E[X][2]) + X; } else { const [c, o] = A[2] >= B[2] ? [a, b] : [b, a]; f = c + o + sb(E[c][2] / E[o][2]); } }
        return { type: d < .4 ? 'nonpolar' : 'polar', f, d, a, b };
      }
      function draw() {
        const I = info(); const { ctx, w, h } = fit(root.querySelector('#bc')); ctx.clearRect(0, 0, w, h); const y = h / 2, xa = w * .3, xb = w * .7; const s = (Math.sin(t / 30) + 1) / 2;
        const atom = (x, lbl, col, r) => { const g = ctx.createRadialGradient(x - r / 3, y - r / 3, 3, x, y, r); g.addColorStop(0, '#fff'); g.addColorStop(1, col); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.fillStyle = C.ink; ctx.font = '700 22px "Plus Jakarta Sans",sans-serif'; ctx.fillText(lbl, x - ctx.measureText(lbl).width / 2, y + 8); };
        if (I.type === 'ion') { const ex = xa + 40 + (xb - 40 - (xa + 40)) * s; atom(xa, I.a + '⁺', '#C9B6E8', 38); atom(xb, I.b + '⁻', '#B6E3C9', 48); ctx.fillStyle = C.gold; ctx.beginPath(); ctx.arc(ex, y - 50 + Math.sin(s * Math.PI) * -20, 7, 0, 7); ctx.fill(); ctx.fillStyle = C.mute; ctx.font = '13px "Plus Jakarta Sans",sans-serif'; ctx.fillText('elektron berpindah dari logam ke nonlogam', w / 2 - 130, h - 24); }
        else if (I.type === 'logam') { for (let i = 0; i < 9; i++) { const x = w * .2 + (i % 3) * w * .3, yy = 70 + Math.floor(i / 3) * 80; ctx.fillStyle = '#C9CED6'; ctx.beginPath(); ctx.arc(x, yy, 22, 0, 7); ctx.fill(); ctx.fillStyle = C.ink; ctx.font = '600 13px "Plus Jakarta Sans",sans-serif'; ctx.fillText('+', x - 4, yy + 5); } for (let i = 0; i < 18; i++) { ctx.fillStyle = C.gold; ctx.beginPath(); ctx.arc((i * 97 + t * 2) % w, 50 + (i * 53 + t) % (h - 80), 4, 0, 7); ctx.fill(); } ctx.fillStyle = C.mute; ctx.font = '13px "Plus Jakarta Sans",sans-serif'; ctx.fillText('kation logam dalam "lautan elektron"', w / 2 - 110, h - 10); }
        else { const shift = I.type === 'polar' ? (E[I.a][0] > E[I.b][0] ? -1 : 1) * 30 * Math.min(1, I.d / 1.5) : 0; atom(xa + 30, I.a, '#C9B6E8', 40); atom(xb - 30, I.b, '#B6E3C9', 40); ctx.fillStyle = C.gold; [-8, 8].forEach(dy => { ctx.beginPath(); ctx.arc(w / 2 + shift, y + dy, 6, 0, 7); ctx.fill(); }); ctx.fillStyle = C.mute; ctx.font = '13px "Plus Jakarta Sans",sans-serif'; ctx.fillText(I.type === 'polar' ? 'pasangan elektron tertarik ke atom yang lebih elektronegatif' : 'pasangan elektron dipakai bersama secara seimbang', w / 2 - 170, h - 24); if (I.type === 'polar') { ctx.fillStyle = C.bad; ctx.font = '700 16px "Plus Jakarta Sans",sans-serif'; const neg = E[I.a][0] > E[I.b][0] ? xa + 30 : xb - 30, pos = neg === xa + 30 ? xb - 30 : xa + 30; ctx.fillText('δ−', neg - 10, y - 50); ctx.fillStyle = C.blue; ctx.fillText('δ+', pos - 10, y - 50); } }
        const names = { ion: 'Ikatan ion', logam: 'Ikatan logam', polar: 'Ikatan kovalen polar', nonpolar: 'Ikatan kovalen nonpolar' };
        root.querySelector('#bo').innerHTML = `<div class="kv"><span>Keelektronegatifan</span><b>${I.a} ${String(E[I.a][0]).replace('.', ',')} ; ${I.b} ${String(E[I.b][0]).replace('.', ',')}</b></div><div class="kv"><span>Selisih (ΔEN)</span><b>${n2(I.d, 2)}</b></div><div class="kv"><span>Jenis ikatan</span><b>${names[I.type]}</b></div><div class="kv"><span>Contoh senyawa/zat</span><b>${I.f}</b></div>${I.ion ? `<div class="kv"><span>Ion</span><b>${I.ion}</b></div>` : ''}${I.ikat ? `<div class="kv"><span>Jenis ikatan kovalen</span><b>${I.ikat}</b></div>` : ''}<div class="note">${I.type === 'ion' ? 'Senyawa ion: titik leleh tinggi, lelehan/larutannya menghantarkan listrik.' : I.type === 'logam' ? 'Logam: menghantarkan listrik dan panas, dapat ditempa.' : 'Senyawa kovalen: umumnya titik leleh rendah dan tidak menghantarkan listrik.'}</div>`;
      }
      function loop() { t++; draw(); raf = requestAnimationFrame(loop); }
      loop(); return () => cancelAnimationFrame(raf);
    },
  };

  // ---- XI-2c Titik didih hidrida ----
  S['XI-2c'] = {
    title: 'Grafik Titik Didih Senyawa Hidrida', intro: 'Bandingkan titik didih hidrida golongan IVA–VIIA. Temukan "anomali" yang disebabkan oleh ikatan hidrogen.',
    mount(root) {

  // ---- XI-2d Kelarutan ----
  S['XI-2d'] = {
    title: 'Uji Kelarutan: Like Dissolves Like', intro: 'Masukkan zat terlarut ke dalam pelarut dan amati apakah zat tersebut larut.',
    mount(root) {
      const Z = { garam: ['Garam dapur (NaCl)', 'ion', '#FFFFFF'], gula: ['Gula (polar)', 'polar', '#FFFFFF'], etanol: ['Etanol (polar)', 'polar', '#F0F4FF'], lilin: ['Lilin (nonpolar)', 'nonpolar', '#F7E9C5'], iodin: ['Iodin (nonpolar)', 'nonpolar', '#5B2C83'], minyak: ['Minyak goreng (nonpolar)', 'nonpolar', '#F2C14E'] };
      const P = { air: ['Air (polar)', 'polar'], heksana: ['Heksana / bensin (nonpolar)', 'nonpolar'] };
      root.innerHTML = `<div class="sim-grid"><div class="sim-panel"><label class="sim-ctl"><span>Zat terlarut</span><select id="z">${Object.keys(Z).map(k => `<option value="${k}">${Z[k][0]}</option>`).join('')}</select></label><label class="sim-ctl"><span>Pelarut</span><select id="p">${Object.keys(P).map(k => `<option value="${k}">${P[k][0]}</option>`).join('')}</select></label><button class="btn" id="go">Campurkan dan aduk</button><div class="sim-out" id="lo"></div></div><canvas class="sim-canvas" id="lc" style="height:300px"></canvas></div>`;
      let raf, t = 0, mixing = false, parts = [];
      function sol() { const z = Z[root.querySelector('#z').value], p = P[root.querySelector('#p').value]; return (z[1] === 'nonpolar') === (p[1] === 'nonpolar'); }
      function start() { mixing = true; t = 0; const { w } = fit(root.querySelector('#lc')); parts = [...Array(40)].map(() => ({ x: w / 2 + (Math.random() - .5) * 40, y: 70 + Math.random() * 20, vx: (Math.random() - .5) * 2, vy: Math.random() * 1.5 })); root.querySelector('#lo').innerHTML = ''; }
      function draw() {
        const zk = root.querySelector('#z').value, z = Z[zk]; const { ctx, w, h } = fit(root.querySelector('#lc')); ctx.clearRect(0, 0, w, h); const bx = w / 2 - 110, by = 60, bw = 220, bh = 220;
        const s = sol(); const solvent = root.querySelector('#p').value === 'air' ? '#DCEBF7' : '#F5F1E6'; let col = solvent; if (s && zk === 'iodin' && mixing) col = mix(solvent, '#8E44AD', Math.min(1, t / 120) * .6);

        parts.forEach(p => { if (s) { p.x += p.vx; p.y += p.vy; if (p.x < bx + 10 || p.x > bx + bw - 10) p.vx *= -1; if (p.y < by + 40 || p.y > by + bh - 10) p.vy *= -1; } else { p.y = Math.min(p.y + (z[0].includes('Minyak') || z[0].includes('Lilin') ? -0 : 1.2), by + bh - 12); if (z[0].includes('Minyak') || z[0].includes('Lilin')) p.y = by + 40 + (p.y - by - 40) * .97; }

        if (mixing) { t++; if (t === 150) root.querySelector('#lo').innerHTML = s ? `<div><b style="color:${C.ok}">Larut.</b> Zat terlarut dan pelarut sama-sama ${P[root.querySelector('#p').value][1] === 'polar' ? 'polar (atau ionik dalam air)' : 'nonpolar'}.</div><div class="note">Partikel zat terlarut dikelilingi molekul pelarut karena gaya tarik antarpartikelnya sebanding.</div>` : `<div><b style="color:${C.bad}">Tidak larut.</b> Kepolaran zat terlarut dan pelarut berbeda.</div><div class="note">Molekul pelarut lebih kuat menarik sesamanya, sehingga zat terlarut ${z[0].includes('Minyak') || z[0].includes('Lilin') ? 'memisah di permukaan' : 'mengendap di dasar'}.</div>`; }

  // ---- XI-3b Maxwell-Boltzmann ----
  S['XI-3b'] = {
    title: 'Distribusi Energi & Energi Aktivasi', intro: 'Kurva menunjukkan sebaran energi kinetik partikel. Daerah berwarna adalah partikel yang energinya ≥ Ea (dapat bereaksi). Bandingkan efek suhu dan katalis.',

      const kTof = T => 4 * T / 300; const f = (E, T) => { const kT = kTof(T); return 2 * Math.sqrt(E / Math.PI) * Math.pow(1 / kT, 1.5) * Math.exp(-E / kT); };
      const frac = (Ea, T) => { let s = 0; const dE = .02; for (let E = Ea; E < 250; E += dE) s += f(E, T) * dE; return s; };

        const { ctx, w, h } = fit(root.querySelector('#mc')); ctx.clearRect(0, 0, w, h); const ymax = f(2, 250) * 1.1;

        const curve = T => { const p = []; for (let x = 0.01; x <= 40; x += .2) p.push([x, f(x, T)]); return p; };
        const fill = (T, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(X(EaC), Y(0)); for (let x = EaC; x <= 40; x += .2) ctx.lineTo(X(x), Y(f(x, T))); ctx.lineTo(X(40), Y(0)); ctx.fill(); };

        const f1 = frac(EaC, 300), f2 = frac(EaC, T2);
        root.querySelector('#mo').innerHTML = `<div><span class="dot" style="background:${C.blue}"></span>300 K: fraksi ≥ Ea = <b>${n2(f1 * 100, 2)}%</b></div><div><span class="dot" style="background:${C.red}"></span>${T2} K: fraksi ≥ Ea = <b>${n2(f2 * 100, 2)}%</b></div><div>Laju relatif (${T2} K terhadap 300 K) ≈ <b>${n2(f2 / Math.max(f1, 1e-9), 1)} kali</b></div><div class="note">Suhu naik membuat kurva melebar ke kanan; katalis menggeser garis Ea ke kiri. Keduanya memperbanyak partikel yang dapat bereaksi.</div>`;
      }
      root.querySelectorAll('input').forEach(e => e.addEventListener('input', up)); up(); return onResize(up);
    },
  };

  // ---- XI-3c Laboratorium orde reaksi ----

        <label class="sim-ctl"><span>Tebakan orde A</span><select id="ga"><option>0</option><option>1</option><option>2</option></select></label><label class="sim-ctl"><span>Tebakan orde B</span><select id="gb"><option>0</option><option>1</option><option>2</option></select></label><button class="btn ghost" id="cek">Periksa jawaban</button><div class="note" id="fb"></div></div>

      function nr() { x = Math.floor(Math.random() * 3); y = Math.floor(Math.random() * 3); k = +(0.5 + Math.random() * 4).toFixed(2); data = []; tb(); root.querySelector('#fb').textContent = ''; }
      function tb() { root.querySelector('#tb').innerHTML = `<tr><th>Percobaan</th><th>[A] (M)</th><th>[B] (M)</th><th>Laju (M/s)</th></tr>` + (data.length ? data.map((d, i) => `<tr><td>${i + 1}</td><td>${String(d[0]).replace('.', ',')}</td><td>${String(d[1]).replace('.', ',')}</td><td>${sci(d[2])}</td></tr>`).join('') : '<tr><td colspan="4" class="note">Belum ada data.</td></tr>'); }

  // ---- XI-4b Kalkulator kesetimbangan (MRS) ----
  S['XI-4b'] = {
    title: 'Tabel M–R–S dan Tetapan Kesetimbangan', intro: 'Pilih reaksi, isi jumlah mol mula-mula dan volume, lalu geser banyaknya zat yang bereaksi sampai setimbang. Amati tabel M–R–S, nilai K_c, dan derajat disosiasi.',
    mount(root) {
      const RX = { pcl5: { n: 'PCl₅ ⇌ PCl₃ + Cl₂', r: [['PCl₅', 1]], p: [['PCl₃', 1], ['Cl₂', 1]] }, hi: { n: '2HI ⇌ H₂ + I₂', r: [['HI', 2]], p: [['H₂', 1], ['I₂', 1]] }, nh3: { n: 'N₂ + 3H₂ ⇌ 2NH₃', r: [['N₂', 1], ['H₂', 3]], p: [['NH₃', 2]] }, so3: { n: '2SO₂ + O₂ ⇌ 2SO₃', r: [['SO₂', 2], ['O₂', 1]], p: [['SO₃', 2]] } };
      root.innerHTML = `<div class="chips">${Object.keys(RX).map((k, i) => `<button class="chip ${i ? '' : 'on'}" data-r="${k}">${RX[k].n}</button>`).join('')}</div><div class="sim-grid"><div class="sim-panel"><div id="ins"></div>${slider('V', 'Volume wadah', 1, 5, 1, 2, 'L')}${slider('x', 'Banyaknya reaksi (x)', 0, 1, .01, .25, 'mol')}</div><div class="sim-panel" id="out" style="overflow-x:auto"></div></div>`;
      let key = 'pcl5';
      function ins() { const R = RX[key]; root.querySelector('#ins').innerHTML = R.r.map((s, i) => `<label class="sim-ctl"><span>Mol mula-mula ${s[0]}</span><input type="number" id="m${i}" value="${[0.4, 1.2][i] ?? 1}" step="0.1" min="0"></label>`).join(''); root.querySelectorAll('#ins input').forEach(e => e.addEventListener('input', up)); up(); }
      function up() {
        const R = RX[key]; const V = +root.querySelector('#V').value; const m0 = R.r.map((s, i) => +root.querySelector('#m' + i).value || 0); const xmax = Math.min(...m0.map((m, i) => m / R.r[i][1])); const xs = root.querySelector('#x'); xs.max = Math.max(.01, xmax).toFixed(2); let x = Math.min(+xs.value, xmax);
        root.querySelector('#V-v').textContent = V; root.querySelector('#x-v').textContent = String(x.toFixed(2)).replace('.', ',');
        const rows = [...R.r.map((s, i) => [s[0], m0[i], -s[1] * x, m0[i] - s[1] * x, s[1], 'r']), ...R.p.map(s => [s[0], 0, s[1] * x, s[1] * x, s[1], 'p'])];
        const conc = r => r[3] / V; const num = rows.filter(r => r[5] === 'p').reduce((a, r) => a * Math.pow(conc(r), r[4]), 1); const den = rows.filter(r => r[5] === 'r').reduce((a, r) => a * Math.pow(conc(r), r[4]), 1);
        const Kc = den > 0 ? num / den : Infinity; const alpha = R.r.length === 1 ? (R.r[0][1] * x) / m0[0] : null;
        const kexp = `K<sub>c</sub> = ${R.p.map(s => '[' + s[0] + ']' + (s[1] > 1 ? '<sup>' + s[1] + '</sup>' : '')).join('')} / ${R.r.map(s => '[' + s[0] + ']' + (s[1] > 1 ? '<sup>' + s[1] + '</sup>' : '')).join('')}`;
        root.querySelector('#out').innerHTML = `<table><tr><th></th>${rows.map(r => `<th>${r[0]}</th>`).join('')}</tr><tr><td>Mula-mula (mol)</td>${rows.map(r => `<td>${n2(r[1], 2)}</td>`).join('')}</tr><tr><td>Bereaksi (mol)</td>${rows.map(r => `<td>${r[2] >= 0 ? '+' : ''}${n2(r[2], 2)}</td>`).join('')}</tr><tr><td><b>Setimbang (mol)</b></td>${rows.map(r => `<td><b>${n2(r[3], 2)}</b></td>`).join('')}</tr><tr><td>Konsentrasi (M)</td>${rows.map(r => `<td>${n2(conc(r), 3)}</td>`).join('')}</tr></table><div class="sim-out big"><div>${kexp}</div><div class="kv"><span>Nilai K<sub>c</sub></span><b>${sci(Kc)}</b></div>${alpha !== null ? `<div class="kv"><span>Derajat disosiasi α</span><b>${n2(alpha, 2)}</b></div>` : ''}</div>`;
      }

  // ---- XI-4c Proses Haber ----
  S['XI-4c'] = {
    title: 'Optimasi Proses Haber-Bosch', intro: 'Atur suhu, tekanan, dan katalis seperti insinyur pabrik pupuk. Bandingkan persen NH₃ saat setimbang dengan kecepatan reaksinya.',
    mount(root) {
      root.innerHTML = `<div class="sim-grid"><div class="sim-panel">${slider('T', 'Suhu', 200, 700, 10, 450, '°C')}${slider('P', 'Tekanan', 50, 400, 10, 200, 'atm')}<label class="sim-ctl row"><input type="checkbox" id="cat" checked><span>Katalis besi (Fe)</span></label><div class="sim-out big" id="ho"></div></div><canvas class="sim-canvas" id="hc" style="height:330px"></canvas></div>`;
      function yieldNH3(Tc, P) { const T = Tc + 273; const Kp = Math.exp(-(-92000 + 198 * T) / (8.314 * T)); const g = x => { const n = 4 - 2 * x; const yN = 2 * x / n, yA = (1 - x) / n, yB = 3 * (1 - x) / n; return yN * yN / (yA * yB * yB * yB * P * P) - Kp; }; let lo = 0, hi = .9999; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; g(m) > 0 ? hi = m : lo = m; } const x = (lo + hi) / 2; return 2 * x / (4 - 2 * x) * 100; }
      function rate(Tc, cat) { const T = Tc + 273; const Ea = cat ? 70 : 230; return Math.exp(-Ea * 1000 / 8.314 * (1 / T - 1 / 723)); }

        const { ctx, w, h } = fit(root.querySelector('#hc')); ctx.clearRect(0, 0, w, h);
        const { X, Y } = axes(ctx, 56, 12, w - 76, h - 62, { xmin: 200, xmax: 700, ymin: 0, ymax: 100, yt: [0, 25, 50, 75, 100], xt: [200, 300, 400, 500, 600, 700], xl: 'suhu (°C)', yl: '% NH₃ saat setimbang' });

        ctx.fillStyle = 'rgba(107,63,160,.12)'; ctx.fillRect(X(400), 12, X(450) - X(400), h - 62); ctx.fillStyle = C.a; ctx.font = '600 12px "Plus Jakarta Sans",sans-serif'; ctx.fillText('kondisi industri', X(400) + 2, 28);
        ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(X(Tc), Y(y), 7, 0, 7); ctx.fill();
        root.querySelector('#ho').innerHTML = `<div class="kv"><span>% NH₃ saat setimbang</span><b>${n2(y, 1)}%</b></div><div class="kv"><span>Kecepatan mencapai setimbang</span><b>${r > 1 ? 'cepat' : r > .2 ? 'sedang' : r > .02 ? 'lambat' : 'sangat lambat'}</b></div><div class="kv"><span>Indeks produksi</span><b>${n2(prod * 100, 0)} / 100</b></div><div class="note">${Tc < 380 ? 'Persentase tinggi, tetapi reaksi terlalu lambat untuk industri.' : Tc > 550 ? 'Reaksi cepat, tetapi kesetimbangan bergeser ke kiri (reaksi eksoterm) sehingga NH₃ sedikit.' : 'Suhu kompromi: hasil cukup dan laju cukup cepat.'} ${P > 300 ? 'Tekanan sangat tinggi meningkatkan hasil, tetapi biaya dan risiko keselamatan besar.' : ''} Nilai dihitung dengan model gas ideal (perkiraan).</div>`;
      }

    },
  };

      const RX = [
        [['HCl', 'H₂O', 'H₃O⁺', 'Cl⁻'], ['asam', 'basa', 'asam konjugasi', 'basa konjugasi']],
        [['NH₃', 'H₂O', 'NH₄⁺', 'OH⁻'], ['basa', 'asam', 'asam konjugasi', 'basa konjugasi']],
        [['CH₃COOH', 'H₂O', 'CH₃COO⁻', 'H₃O⁺'], ['asam', 'basa', 'basa konjugasi', 'asam konjugasi']],
        [['HCO₃⁻', 'H₂O', 'H₂CO₃', 'OH⁻'], ['basa', 'asam', 'asam konjugasi', 'basa konjugasi']],
        [['HSO₄⁻', 'H₂O', 'SO₄²⁻', 'H₃O⁺'], ['asam', 'basa', 'basa konjugasi', 'asam konjugasi']],
        [['NH₄⁺', 'OH⁻', 'NH₃', 'H₂O'], ['asam', 'basa', 'basa konjugasi', 'asam konjugasi']],
      ];
      const roles = ['asam', 'basa', 'asam konjugasi', 'basa konjugasi'];
      let i = 0;
      function up() { const [sp] = RX[i]; const sel = j => `<select data-j="${j}"><option value="">pilih…</option>${roles.map(r => `<option>${r}</option>`).join('')}</select>`;
        root.innerHTML = `<div class="sim-panel" style="max-width:900px"><p class="note">Reaksi ${i + 1} dari ${RX.length}</p><div style="display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;font-size:1.3rem;font-weight:700">${sp.map((s, j) => `<div style="display:grid;gap:6px;text-align:center"><span>${s}</span>${sel(j)}</div>${j === 0 ? '<span>+</span>' : j === 1 ? '<span>⇌</span>' : j === 2 ? '<span>+</span>' : ''}`).join('')}</div>
          <div class="btns"><button class="btn" id="cek">Periksa</button><button class="btn ghost" id="nx">Reaksi berikutnya</button></div><div class="sim-out" id="fb"></div><p class="note">Ingat: asam memberi proton (H⁺) dan berubah menjadi basa konjugasinya; basa menerima proton dan berubah menjadi asam konjugasinya.</p></div>`;
        root.querySelector('#cek').onclick = () => { const ans = RX[i][1]; let ok = 0; root.querySelectorAll('select').forEach(s => { const r = s.value === ans[+s.dataset.j]; ok += r; s.style.borderColor = r ? C.ok : C.bad; s.style.borderWidth = '2px'; }); root.querySelector('#fb').innerHTML = ok === 4 ? `<b style="color:${C.ok}">Semua tepat!</b> Pasangan konjugasi: ${sp[0]}/${sp[ans.indexOf(ans[0] === 'asam' ? 'basa konjugasi' : 'asam konjugasi')]} dan ${sp[1]}/${sp[ans.indexOf(ans[1] === 'asam' ? 'basa konjugasi' : 'asam konjugasi')]}.` : `<b style="color:${C.bad}">${ok} dari 4 tepat.</b> Lihat spesi mana yang kehilangan atau mendapat H⁺.`; };
        root.querySelector('#nx').onclick = () => { i = (i + 1) % RX.length; up(); };
      }
      up(); return () => { };
    },
  };

  // ---- XI-5e Titrasi terpisah (pakai simulasi XI-5 bagian titrasi) ----
  S['XI-5e'] = {
    title: 'Titrasi Asam-Basa Virtual', intro: 'Teteskan NaOH 0,1 M dari buret ke dalam 25 mL asam. Hentikan tepat saat warna fenolftalein berubah merah muda pertama kali, lalu hitung konsentrasi asam.',
    mount(root) {
      root.innerHTML = `<div class="sim-grid"><div class="sim-panel"><label class="sim-ctl"><span>Sampel asam</span><select id="s"><option value="hcl">HCl (konsentrasi rahasia)</option><option value="cuka">Cuka dapur encer (CH₃COOH, rahasia)</option></select></label><div class="btns wrap"><button class="btn" data-d="1">+ 1 mL</button><button class="btn" data-d="0.1">+ 0,1 mL</button><button class="btn ghost" data-d="0.05">+ 1 tetes</button><button class="btn ghost" id="rs">Ulangi</button></div><div class="sim-out" id="to"></div><label class="sim-ctl"><span>Konsentrasi asam menurutmu (M)</span><input type="number" id="g" step="0.001"></label><button class="btn ghost" id="cek">Periksa</button><div class="note" id="fb"></div></div><canvas class="sim-canvas" id="tc" style="height:360px"></canvas></div>`;
      let Ca, V, weak, drop = 0, raf;
      function reset() { weak = root.querySelector('#s').value === 'cuka'; Ca = +(0.06 + Math.random() * 0.08).toFixed(3); V = 0; root.querySelector('#fb').textContent = ''; up(); }
      function pH() { const na = 25 * Ca, nb = V * 0.1, Vt = 25 + V, Kw = 1e-14, Ka = 1.8e-5; if (!weak) { const ex = (na - nb) / Vt; if (Math.abs(ex) < 1e-10) return 7; return ex > 0 ? -Math.log10(ex) : 14 + Math.log10(-ex); } if (nb === 0) return -Math.log10(Math.sqrt(Ka * Ca)); if (nb < na) return -Math.log10(Ka) + Math.log10(nb / (na - nb)); if (Math.abs(nb - na) < 1e-9) return 14 + Math.log10(Math.sqrt(Kw / Ka * na / Vt)); return 14 + Math.log10((nb - na) / Vt); }
      function up() { const p = pH(); root.querySelector('#to').innerHTML = `<div>Volume NaOH terpakai: <b>${n2(V, 2)} mL</b></div><div class="note">Pembacaan buret: ${n2(50 - V, 2)} mL (awal 50,00 mL)</div>`; draw(p); }
      function draw(p) { const { ctx, w, h } = fit(root.querySelector('#tc')); ctx.clearRect(0, 0, w, h); const cx = w / 2;
        ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.strokeRect(cx - 9, 10, 18, 190); ctx.fillStyle = '#E3EEF8'; const lv = (50 - V) / 50; ctx.fillRect(cx - 7, 12 + 186 * (1 - lv), 14, 186 * lv); for (let i = 0; i <= 10; i++) { ctx.beginPath(); ctx.moveTo(cx - 9, 12 + i * 18.6); ctx.lineTo(cx - 3, 12 + i * 18.6); ctx.stroke(); }
        ctx.beginPath(); ctx.moveTo(cx - 3, 200); ctx.lineTo(cx - 3, 222); ctx.lineTo(cx + 3, 222); ctx.lineTo(cx + 3, 200); ctx.stroke();
        if (drop > 0) { ctx.fillStyle = '#9BB8DE'; ctx.beginPath(); ctx.arc(cx, 230 + (20 - drop) * 2.5, 4, 0, 7); ctx.fill(); drop--; }
        const col = p >= 8.3 ? mix('#FCE4EC', '#E91E8C', Math.min(1, (p - 8.3) / 1.5)) : '#F5F8FC'; ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(cx - 14, 270); ctx.lineTo(cx - 70, 350); ctx.lineTo(cx + 70, 350); ctx.lineTo(cx + 14, 270); ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(cx - 14, 250); ctx.lineTo(cx - 14, 270); ctx.lineTo(cx - 75, 355); ctx.lineTo(cx + 75, 355); ctx.lineTo(cx + 14, 270); ctx.lineTo(cx + 14, 250); ctx.stroke();
        ctx.fillStyle = C.mute; ctx.font = '12px "Plus Jakarta Sans",sans-serif'; ctx.fillText('NaOH 0,1 M', cx + 16, 30); ctx.fillText('25 mL asam + 3 tetes PP', cx + 80, 330); }
      let anim = () => { if (drop > 0) draw(pH()); raf = requestAnimationFrame(anim); };
      root.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { V = Math.min(50, V + +b.dataset.d); drop = 20; up(); });
      root.querySelector('#rs').onclick = reset; root.querySelector('#s').onchange = reset;
      root.querySelector('#cek').onclick = () => { const g = +root.querySelector('#g').value; const ok = Math.abs(g - Ca) / Ca < .03; root.querySelector('#fb').innerHTML = ok ? `<b style="color:${C.ok}">Tepat!</b> Konsentrasi sebenarnya ${n2(Ca, 3)} M.` : `<b style="color:${C.bad}">Belum tepat.</b> Gunakan M<sub>a</sub> × V<sub>a</sub> = M<sub>b</sub> × V<sub>b</sub> dengan V<sub>b</sub> saat warna berubah.`; };
      reset(); anim(); return () => cancelAnimationFrame(raf);
    },
  };

  // ---- XI-6b Hidrolisis garam ----
  S['XI-6b'] = {
    title: 'Pembentuk Garam & Hidrolisis', intro: 'Pilih asam dan basa pembentuk garam. Simulasi menampilkan rumus garam, ion yang terhidrolisis, reaksi, sifat, dan pH larutan 0,1 M.',
    mount(root) {
      const A = { HCl: ['HCl', 'kuat', null, 'Cl⁻'], CH3COOH: ['CH₃COOH', 'lemah', 1.8e-5, 'CH₃COO⁻'], HCN: ['HCN', 'lemah', 4.9e-10, 'CN⁻'] };
      const Bs = { NaOH: ['NaOH', 'kuat', null, 'Na⁺', 'Na'], NH3: ['NH₃ (NH₄OH)', 'lemah', 1.8e-5, 'NH₄⁺', 'NH₄'] };
      root.innerHTML = `<div class="sim-grid"><div class="sim-panel"><label class="sim-ctl"><span>Asam</span><select id="a">${Object.keys(A).map(k => `<option value="${k}">${A[k][0]} (asam ${A[k][1]})</option>`).join('')}</select></label><label class="sim-ctl"><span>Basa</span><select id="b">${Object.keys(Bs).map(k => `<option value="${k}">${Bs[k][0]} (basa ${Bs[k][1]})</option>`).join('')}</select></label><div class="sim-out big" id="ho"></div></div><canvas class="sim-canvas" id="hc" style="height:260px"></canvas></div>`;
      function up() {
        const a = A[root.querySelector('#a').value], b = Bs[root.querySelector('#b').value]; const anion = a[3].replace('⁻', ''), garam = anion === 'CH₃COO' ? anion + b[4] : b[4] + anion; const M = .1, Kw = 1e-14;
        let pH, sifat, hid, rx;
        if (a[1] === 'kuat' && b[1] === 'kuat') { pH = 7; sifat = 'netral'; hid = 'tidak terhidrolisis'; rx = 'Na⁺ dan Cl⁻ tidak bereaksi dengan air'; }
        else if (a[1] === 'lemah' && b[1] === 'kuat') { const OH = Math.sqrt(Kw / a[2] * M); pH = 14 + Math.log10(OH); sifat = 'basa'; hid = 'hidrolisis parsial (anion)'; rx = `${a[3]} + H₂O ⇌ ${a[0]} + OH⁻`; }
        else if (a[1] === 'kuat' && b[1] === 'lemah') { const H = Math.sqrt(Kw / b[2] * M); pH = -Math.log10(H); sifat = 'asam'; hid = 'hidrolisis parsial (kation)'; rx = 'NH₄⁺ + H₂O ⇌ NH₃ + H₃O⁺'; }
        else { const H = Math.sqrt(Kw * a[2] / b[2]); pH = -Math.log10(H); sifat = pH < 6.95 ? 'asam' : pH > 7.05 ? 'basa' : 'netral'; hid = 'hidrolisis total (kation dan anion)'; rx = `NH₄⁺ + ${a[3]} + H₂O ⇌ NH₃ + ${a[0]} + H₂O`; }
        const { ctx, w, h } = fit(root.querySelector('#hc')); ctx.clearRect(0, 0, w, h); for (let i = 0; i < 14; i++) { const s = [[0, '#C62828'], [4, '#FB8C00'], [7, '#43A047'], [10, '#1E88E5'], [14, '#6A1B9A']]; let c = '#6A1B9A'; for (let j = 0; j < s.length - 1; j++) if (i + .5 <= s[j + 1][0]) { c = mix(s[j][1], s[j + 1][1], (i + .5 - s[j][0]) / (s[j + 1][0] - s[j][0])); break; } ctx.fillStyle = c; ctx.fillRect(16 + i * (w - 32) / 14, 150, (w - 32) / 14, 30); }
        const px = 16 + pH / 14 * (w - 32); ctx.fillStyle = C.ink; ctx.beginPath(); ctx.moveTo(px, 146); ctx.lineTo(px - 9, 126); ctx.lineTo(px + 9, 126); ctx.fill(); ctx.font = '700 22px "Plus Jakarta Sans",sans-serif'; ctx.fillText('pH ' + n2(pH, 2), Math.min(w - 110, Math.max(10, px - 40)), 112); ctx.font = '600 16px "Plus Jakarta Sans",sans-serif'; ctx.fillStyle = C.a; ctx.fillText('Garam: ' + garam + ' 0,1 M', 16, 40); ctx.fillStyle = C.mute; ctx.font = '12px "Plus Jakarta Sans",sans-serif'; ctx.fillText('asam', 16, 200); ctx.fillText('basa', w - 46, 200); ctx.fillText('netral', w / 2 - 16, 200);
        root.querySelector('#ho').innerHTML = `<div class="kv"><span>Garam</span><b>${garam}</b></div><div class="kv"><span>Hidrolisis</span><b>${hid}</b></div><div class="kv"><span>Reaksi</span><b>${rx}</b></div><div class="kv"><span>Sifat larutan</span><b>${sifat}</b></div><div class="kv"><span>pH (0,1 M)</span><b>${n2(pH, 2)}</b></div>`;
      }
      root.querySelectorAll('select').forEach(s => s.onchange = up); up(); return onResize(up);
    },
  };

  // ---- XI-6c Penyangga darah ----
  S['XI-6c'] = {
    title: 'Penyangga Karbonat dalam Darah', intro: 'pH darah dijaga oleh pasangan H₂CO₃/HCO₃⁻. Ubah laju pernapasan (mengatur CO₂) dan kerja ginjal (mengatur HCO₃⁻), lalu amati pH darah.',
    mount(root) {
      root.innerHTML = `<div class="sim-grid"><div class="sim-panel">${slider('co2', 'Tekanan CO₂ darah (pCO₂)', 20, 70, 1, 40, 'mmHg')}${slider('hco3', 'Kadar HCO₃⁻ (diatur ginjal)', 12, 36, 1, 24, 'mM')}<div class="chips"><button class="chip" data-p="40,24">Normal</button><button class="chip" data-p="25,24">Hiperventilasi (panik)</button><button class="chip" data-p="60,24">Napas tertahan</button><button class="chip" data-p="40,14">Diare berat</button><button class="chip" data-p="40,34">Muntah berulang</button></div><div class="sim-out big" id="bo"></div></div><canvas class="sim-canvas" id="bc" style="height:300px"></canvas></div>`;
      function up() {
        const p = +root.querySelector('#co2').value, b = +root.querySelector('#hco3').value; root.querySelector('#co2-v').textContent = p; root.querySelector('#hco3-v').textContent = b;
        const h2co3 = 0.03 * p; const pH = 6.1 + Math.log10(b / h2co3);
        let st = 'Normal', ex = 'pH darah berada pada rentang normal 7,35–7,45.';
        if (pH < 7.35) { st = p > 45 ? 'Asidosis respiratorik' : 'Asidosis metabolik'; ex = p > 45 ? 'CO₂ menumpuk karena napas tertahan/lambat; H₂CO₃ bertambah sehingga pH turun.' : 'HCO₃⁻ berkurang (misalnya diare berat) sehingga kemampuan menetralkan asam menurun.'; }
        if (pH > 7.45) { st = p < 35 ? 'Alkalosis respiratorik' : 'Alkalosis metabolik'; ex = p < 35 ? 'Napas terlalu cepat membuang banyak CO₂; H₂CO₃ berkurang sehingga pH naik.' : 'HCO₃⁻ berlebih (misalnya kehilangan asam lambung karena muntah).'; }
        const { ctx, w, h } = fit(root.querySelector('#bc')); ctx.clearRect(0, 0, w, h); const cx = w / 2, cy = h * .72, R = Math.min(w / 2 - 30, h * .6);
        const ang = v => Math.PI + (v - 6.9) / (7.9 - 6.9) * Math.PI; const zone = (a, b, c) => { ctx.strokeStyle = c; ctx.lineWidth = 26; ctx.beginPath(); ctx.arc(cx, cy, R, ang(a), ang(b)); ctx.stroke(); };
        zone(6.9, 7.35, '#E57373'); zone(7.35, 7.45, '#66BB6A'); zone(7.45, 7.9, '#64B5F6');
        const a = ang(Math.max(6.9, Math.min(7.9, pH))); ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * (R - 20), cy + Math.sin(a) * (R - 20)); ctx.stroke(); ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(cx, cy, 8, 0, 7); ctx.fill();
        ctx.font = '700 28px "Plus Jakarta Sans",sans-serif'; ctx.fillText('pH ' + n2(pH, 2), cx - 60, cy + 40); ctx.font = '12px "Plus Jakarta Sans",sans-serif'; ctx.fillStyle = C.mute; ctx.fillText('asidosis', cx - R - 10, cy + 22); ctx.fillText('alkalosis', cx + R - 40, cy + 22); ctx.fillText('normal', cx - 18, cy - R - 18);
        root.querySelector('#bo').innerHTML = `<div>pH = 6,1 + log ([HCO₃⁻] ÷ (0,03 × pCO₂))</div><div>= 6,1 + log (${b} ÷ ${n2(h2co3, 2)}) = <b>${n2(pH, 2)}</b></div><div class="kv"><span>Status</span><b style="color:${st === 'Normal' ? C.ok : C.bad}">${st}</b></div><div class="note">${ex}</div>`;
      }
      root.querySelectorAll('input').forEach(e => e.addEventListener('input', up)); root.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { const [p, c] = b.dataset.p.split(','); root.querySelector('#co2').value = p; root.querySelector('#hco3').value = c; up(); });
      up(); return onResize(up);
    },
  };

  // daftar simulasi per bab (urutan tampilan)
  window.SIM_LIST = {
    'XI-1': ['XI-1b', 'XI-1c', 'XI-1d', 'XI-1', 'XI-1e'],
    'XI-2': ['XI-2b', 'XI-2', 'XI-2c', 'XI-2d'],
    'XI-3': ['XI-3', 'XI-3b', 'XI-3c'],
    'XI-4': ['XI-4', 'XI-4b', 'XI-4c'],
    'XI-5': ['XI-5d', 'XI-5c', 'XI-5', 'XI-5e'],
    'XI-6': ['XI-6b', 'XI-6', 'XI-6c'],
  };
})();
</script>
<script>/* Aplikasi halaman kelas: presentasi bergambar, simulasi (beberapa per bab), kuis, panduan guru */
(function () {
  const D = window.KELAS;
  const $ = (s, r = document) => r.querySelector(s);
  let cur = null, tab = 'presentasi', slideI = 0, slides = [], cleanup = null, simSel = null, shownSim = null;
  const TABS = [['presentasi', 'Presentasi'], ['simulasi', 'Simulasi'], ['kuis', 'Kuis'], ['panduan', 'Panduan Guru & LKPD']];
  const TAGN = { M: 'Memahami', A: 'Mengaplikasi', R: 'Merefleksi' };
  const simsOf = b => (window.SIM_LIST && window.SIM_LIST[b.kode]) || [b.kode];

  function side() {
    const el = $('#side'); let html = '';
    [1, 2].forEach(s => {
      html += `<h2>Semester ${s}</h2><div class="grid">`;
      D.bab.filter(b => b.sem === s).forEach(b => { html += `<button class="tile" data-k="${b.kode}" aria-label="Bab ${b.no}: ${b.judul}"><span class="z">${b.no}</span><span class="ms">${b.jp} JP</span><span class="sym">${b.sym}</span><span class="nm">${b.judul}</span></button>`; });
      html += '</div>';
    });
    el.innerHTML = html;
    el.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => go(t.dataset.k, tab)));
  }

  // ---------- slides ----------
  const fig = (im, cls = '') => im ? `<figure class="ph ${cls}"><img data-f="${im.f}" data-u="${im.url}" alt="${im.alt}" onerror="this.parentNode.classList.add('noimg')"><figcaption>${im.cap ? '<span>' + im.cap + '</span>' : ''}<a href="${im.src}" target="_blank" rel="noopener">Foto: Wikimedia Commons</a></figcaption></figure>` : '';
  const simBtn = (id, label) => id && SIMS[id] ? `<p><button class="btn" data-sim="${id}">${label || 'Coba simulasi: ' + SIMS[id].title}</button></p>` : '';
  function buildSlides(b) {
    if (!b.slides) return autoSlides(b);
    return b.slides.map(s => {
      const body = Array.isArray(s.body) ? `<ul>${s.body.map(x => `<li>${x}</li>`).join('')}</ul>` : (s.body ? `<p class="lead">${s.body}</p>` : '');
      if (s.lay === 'hero') return { cls: 'bleed', html: `<div class="slide hero">${fig(s.img, 'bg')}<div class="hero-txt"><p class="kicker">${s.k || ''}</p><h3>${s.t}</h3>${body}${simBtn(s.sim)}</div></div>` };
      if (s.lay === 'split' || s.lay === 'splitR') return { cls: 'bleed', html: `<div class="slide split ${s.lay === 'splitR' ? 'rev' : ''}">${fig(s.img)}<div class="txt"><p class="kicker">${s.k || 'Materi'}</p><h3>${s.t}</h3>${s.html || body}${simBtn(s.sim)}</div></div>` };
      if (s.lay === 'gallery') return { cls: '', html: `<div class="slide gallery"><p class="kicker">${s.k || ''}</p><h3>${s.t}</h3><div class="gal">${s.imgs.map(im => fig(im)).join('')}</div>${s.html ? `<div class="gal-txt">${s.html}</div>` : body}${simBtn(s.sim)}</div>` };
      if (s.lay === 'contoh') return { cls: '', html: `<div class="slide"><p class="kicker">Contoh soal</p><h3>Ayo hitung bersama</h3><p class="lead">${s.q}</p><div class="reveal"><button class="btn ghost" data-rev>Tampilkan pembahasan</button><div class="ans">${s.a}</div></div></div>` };
      if (s.lay === 'refleksi') return { cls: '', html: `<div class="slide"><p class="kicker">Merefleksi</p><h3>Refleksi 3–2–1</h3><ol><li>Tuliskan <b>3</b> hal yang kamu pelajari dari bab ini.</li><li>Tuliskan <b>2</b> hal yang menurutmu menarik atau bermanfaat.</li><li>Tuliskan <b>1</b> pertanyaan yang masih ingin kamu ketahui.</li></ol><p class="lead" style="margin-top:1em"><b>Alur konsep:</b> ${b.rangkuman}</p><p><button class="btn" data-go="kuis">Kerjakan kuis</button> <button class="btn ghost" data-go="simulasi">Buka semua simulasi</button></p></div>` };
      return { cls: '', html: `<div class="slide"><p class="kicker">${s.k || 'Materi'}</p><h3>${s.t}</h3>${s.html || body}${simBtn(s.sim)}</div>` };
    }).concat([{ cls: '', html: `<div class="slide"><p class="kicker">Tujuan pembelajaran bab ini</p><h3>Sudahkah kita mencapainya?</h3><ul>${b.tp.map(t => `<li><b>${t.k}</b> ${t.t}</li>`).join('')}</ul></div>` }]);
  }
  function autoSlides(b) {
    const S = [];
    S.push(`<div class="slide cover"><div class="big-no">${b.no}</div><p class="kicker">Kimia Kelas ${D.kelas}, Semester ${b.sem}</p><h3>${b.judul}</h3><p>${b.topik}</p></div>`);
    S.push(`<div class="slide"><p class="kicker">Mari berpikir</p><h3>Pertanyaan pemantik</h3><ol>${b.pemantik.map(x => `<li>${x}</li>`).join('')}</ol></div>`);
    S.push(`<div class="slide"><p class="kicker">Yang akan kita capai</p><h3>Tujuan pembelajaran</h3><ul>${b.tp.map(t => `<li><b>${t.k}</b> ${t.t}</li>`).join('')}</ul></div>`);
    b.materi.forEach(m => S.push(`<div class="slide"><p class="kicker">Materi</p><h3>${m.h}</h3>${m.html}</div>`));
    b.contoh.forEach((c, i) => S.push(`<div class="slide"><p class="kicker">Contoh soal ${i + 1}</p><h3>Ayo hitung bersama</h3><p>${c.q}</p><div class="reveal"><button class="btn ghost" data-rev>Tampilkan pembahasan</button><div class="ans">${c.a}</div></div></div>`));
    S.push(`<div class="slide cover"><p class="kicker">Mengaplikasi</p><h3>${SIMS[b.kode].title}</h3><p>${SIMS[b.kode].intro}</p><p><button class="btn" data-go="simulasi">Buka simulasi</button></p></div>`);

  }
  function renderDeck(root) {

    $('#prev').onclick = () => showSlide(slideI - 1); $('#next').onclick = () => showSlide(slideI + 1);
    $('#fs').onclick = () => { const d = $('#deck'); if (document.fullscreenElement) document.exitFullscreen(); else if (d.requestFullscreen) d.requestFullscreen(); };

  }
  function showSlide(i) {
    slideI = Math.max(0, Math.min(slides.length - 1, i)); const st = $('#stage'); if (!st) return;
    st.className = 'stage ' + slides[slideI].cls; st.innerHTML = slides[slideI].html; st.scrollTop = 0;
    setTimeout(() => { if (window.KIMIA_IMG) KIMIA_IMG.hydrate(st); else st.querySelectorAll('img[data-f]').forEach(i => { i.src = i.dataset.u; }); }, 0);
    $('#cnt').textContent = `Slide ${slideI + 1} dari ${slides.length}`; $('#pg').style.width = ((slideI + 1) / slides.length * 100) + '%';
    $('#prev').disabled = slideI === 0; $('#next').disabled = slideI === slides.length - 1;
    st.querySelectorAll('[data-rev]').forEach(b => b.onclick = () => { b.parentElement.classList.toggle('open'); b.textContent = b.parentElement.classList.contains('open') ? 'Sembunyikan pembahasan' : 'Tampilkan pembahasan'; });

  }

    if (cleanup) { try { cleanup(); } catch (e) { } cleanup = null; }

    $('#tabs').innerHTML = TABS.map(([k, n]) => `<button role="tab" aria-selected="${k === t}" data-t="${k}">${n}</button>`).join('');
    $('#tabs').querySelectorAll('button').forEach(x => x.onclick = () => go(b.kode, x.dataset.t));
    const v = $('#view');
    if (t === 'presentasi') renderDeck(v);
    if (t === 'simulasi') renderSims(v, b);
    if (t === 'kuis') renderQuiz(v, b);
    if (t === 'panduan') renderGuide(v, b);
    if (push) history.replaceState(null, '', `#${b.kode}/${t}${t === 'simulasi' && simSel ? '/' + simSel : ''}`);
    document.title = `Bab ${b.no} ${b.judul.replace(/<[^>]+>/g, '')} — Kimia Kelas ${D.kelas}`;
  }
  document.addEventListener('keydown', e => { if (tab !== 'presentasi' || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return; if (e.key === 'ArrowRight' || e.key === 'PageDown') showSlide(slideI + 1); if (e.key === 'ArrowLeft' || e.key === 'PageUp') showSlide(slideI - 1); });
  window.addEventListener('hashchange', () => { const [k, t, s] = location.hash.slice(1).split('/'); if (s) simSel = s; if (k && (k !== cur.kode || t !== tab || (t === 'simulasi' && s && s !== shownSim))) go(k, t, false, s || null); });
  side();
  const [k0, t0, s0] = location.hash.slice(1).split('/'); if (s0) simSel = s0; go(k0 || D.bab[0].kode, t0 || 'presentasi');
})();
</script>

  const urls = new Map();

  // ---------- tampilan ----------
  function setImg(img) { const f = img.dataset.f; const u = urls.get(f); if (u) { if (img.src !== u) img.src = u; } else if (!img.getAttribute('src')) img.src = img.dataset.u || netURL(f); }
  window.KIMIA_IMG = {
    hydrate(root) { const imgs = (root || document).querySelectorAll('img[data-f]'); if (db || urls.size) imgs.forEach(setImg); ready.then(() => imgs.forEach(setImg)); },
    count: () => urls.size, total: FILES.length,
  };
