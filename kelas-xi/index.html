<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kimia Kelas XI — Media Belajar Interaktif</title><meta name="description" content="Presentasi, simulasi, dan kuis Kimia Kelas XI Fase F"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='8' fill='%236B3FA0'/%3E%3Ctext x='32' y='43' font-size='30' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3EKi%3C/text%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet"><style>:root{
  --ink:#1B2A4A; --mute:#5B6B86; --line:#D5DDEA; --paper:#F6F8FB; --card:#FFFFFF;
  --xi:#6B3FA0; --xii:#14798C; --ok:#2E8B57; --bad:#C0392B; --soft:#EEF2F8;
  --acc:var(--xi);
  --r-s:6px; --r-m:12px;
  font-family:"Plus Jakarta Sans",system-ui,sans-serif; color:var(--ink); background:var(--paper);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-size:16px;line-height:1.6;background:var(--paper)}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
sub,sup{font-size:.72em;line-height:0}
button,select,input{font:inherit;color:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* pH stripe — signature element */
.ph-stripe{display:grid;grid-template-columns:repeat(14,1fr);height:10px}
.ph-stripe span:nth-child(1){background:#C62828}.ph-stripe span:nth-child(2){background:#E53935}.ph-stripe span:nth-child(3){background:#F4511E}.ph-stripe span:nth-child(4){background:#FB8C00}.ph-stripe span:nth-child(5){background:#FDD835}.ph-stripe span:nth-child(6){background:#C0CA33}.ph-stripe span:nth-child(7){background:#43A047}.ph-stripe span:nth-child(8){background:#00897B}.ph-stripe span:nth-child(9){background:#1E88E5}.ph-stripe span:nth-child(10){background:#3949AB}.ph-stripe span:nth-child(11){background:#5E35B1}.ph-stripe span:nth-child(12){background:#6A1B9A}.ph-stripe span:nth-child(13){background:#7B1FA2}.ph-stripe span:nth-child(14){background:#4A148C}

/* element tile */
.tile{position:relative;display:grid;grid-template-rows:auto 1fr auto;aspect-ratio:1/1;border:2px solid var(--ink);background:var(--card);padding:8px 10px;text-decoration:none;border-radius:var(--r-s);transition:transform .15s}
.tile .z{font-size:.8rem;font-weight:700}
.tile .sym{font-size:2.1rem;font-weight:800;line-height:1;align-self:center;letter-spacing:-.02em}
.tile .nm{font-size:.72rem;line-height:1.2;color:var(--mute)}
.tile .ms{position:absolute;top:8px;right:10px;font-size:.72rem;color:var(--mute)}

/* ---------- landing ---------- */
.land-wrap{max-width:1100px;margin:0 auto;padding:48px 24px 64px}
.land-hero{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:end;margin-top:28px}
.land-hero h1{font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.05;margin:0 0 16px;letter-spacing:-.025em;font-weight:800}
.land-hero p{max-width:56ch;color:var(--mute);margin:0}
.land-classes{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cls{display:block;text-decoration:none;border:3px solid var(--ink);border-radius:var(--r-m);background:var(--card);padding:16px 18px 18px;position:relative;transition:transform .15s,box-shadow .15s}
.cls:hover{transform:translateY(-3px);box-shadow:6px 6px 0 var(--c)}
.cls .z{font-weight:700}
.cls .ms{position:absolute;top:16px;right:18px;color:var(--mute);font-size:.9rem}
.cls .sym{display:block;font-size:clamp(4rem,10vw,6.5rem);font-weight:800;line-height:1;color:var(--c);letter-spacing:-.04em;margin:18px 0 8px}
.cls .nm{font-weight:700;font-size:1.15rem}
.cls ul{margin:8px 0 0;padding-left:18px;color:var(--mute);font-size:.92rem}
.land-how{margin-top:56px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;border-top:2px solid var(--ink);padding-top:24px}
.land-how h3{margin:0 0 4px;font-size:1.05rem}
.land-how p{margin:0;color:var(--mute);font-size:.95rem}
.land-how b{color:var(--ink)}
footer.foot{max-width:1100px;margin:0 auto;padding:20px 24px 40px;color:var(--mute);font-size:.88rem}

/* ---------- class app ---------- */
.top{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top a.home{text-decoration:none;font-weight:600;color:var(--mute)}
.top h1{font-size:1.1rem;margin:0;font-weight:800}
.top .badge{margin-left:auto;font-size:.85rem;color:var(--mute)}
.app{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--line);padding:18px 16px;background:var(--card)}
.side h2{font-size:.85rem;color:var(--mute);font-weight:600;margin:12px 0 8px}
.side .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.side .tile{cursor:pointer;aspect-ratio:auto;height:96px;min-width:0;overflow:hidden;text-align:left;color:var(--ink)}
.side .tile .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.68rem}
.side .tile .sym{font-size:1.5rem}
.side .tile.on{background:var(--acc);border-color:var(--acc);color:#fff}
.side .tile.on .nm,.side .tile.on .ms{color:#E9E2F5}
.main{padding:24px clamp(16px,3vw,40px) 60px;min-width:0}
.bab-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.bab-head h2{font-size:clamp(1.5rem,3vw,2.2rem);margin:0;letter-spacing:-.02em;font-weight:800}
.bab-head .meta{color:var(--mute);font-size:.92rem}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:18px 0 22px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 16px;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--acc)}

/* slides */
.deck{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;display:flex;flex-direction:column}
.deck:fullscreen{border:0;border-radius:0;font-size:1.35rem}
.stage{aspect-ratio:16/9;padding:clamp(20px,4vw,56px);overflow:auto;position:relative}
.deck:fullscreen .stage{aspect-ratio:auto;flex:1}
.slide h3{font-size:clamp(1.4rem,2.6vw,2.2rem);margin:0 0 .6em;letter-spacing:-.015em;line-height:1.15;font-weight:800}
.slide p,.slide li{font-size:clamp(1rem,1.55vw,1.3rem);max-width:70ch}
.slide ul,.slide ol{padding-left:1.2em}
.slide li{margin:.35em 0}
.slide .kicker{color:var(--acc);font-weight:700;font-size:1rem;margin:0 0 .4em}
.slide.cover{display:grid;align-content:center;height:100%}
.slide.cover h3{font-size:clamp(2rem,5vw,3.8rem);max-width:18ch}
.slide.cover .big-no{font-size:clamp(4rem,10vw,8rem);font-weight:800;color:var(--acc);line-height:.9;letter-spacing:-.05em}
.formula{background:#F2F7FC;border-left:5px solid var(--acc);padding:.55em .9em;margin:.6em 0;font-size:clamp(1rem,1.5vw,1.25rem);font-weight:600;max-width:70ch}
.slide table,.panel table{border-collapse:collapse;margin:.6em 0;font-size:clamp(.9rem,1.3vw,1.1rem)}
.slide th,.slide td,.panel th,.panel td{border:1px solid var(--line);padding:.4em .7em;text-align:left;vertical-align:top}
.slide th,.panel th{background:var(--soft)}
.reveal{margin-top:.8em}
.reveal .ans{display:none;margin-top:.6em;padding:.7em 1em;background:#EEF8F1;border-left:5px solid var(--ok)}
.reveal.open .ans{display:block}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--card)}
.ctrl .count{color:var(--mute);font-size:.9rem;margin-right:auto}
.prog{height:4px;background:var(--soft)}
.prog i{display:block;height:100%;background:var(--acc);transition:width .2s}
.btn{border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--r-s);padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--acc);border-color:var(--acc)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:flex;gap:8px;margin:10px 0}
.btns.wrap{flex-wrap:wrap}

/* sims */
.sim-intro{max-width:75ch;color:var(--mute);margin:0 0 16px}
.sim-grid{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:20px;align-items:start}
.sim-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:16px}
.sim-panel h4{margin:0 0 8px}
.sim-canvas{width:100%;display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m)}
.sim-ctl{display:grid;gap:4px;margin:10px 0;font-size:.93rem}
.sim-ctl.row{display:flex;align-items:center;gap:8px}
.sim-ctl select,.sim-ctl input[type=number]{padding:7px 8px;border:1px solid var(--line);border-radius:var(--r-s);background:#fff}
.sim-ctl input[type=range]{width:100%;accent-color:var(--acc)}
.sim-out{margin-top:10px;font-size:.95rem;display:grid;gap:4px}
.sim-out.big{font-size:1rem}
.sim-out .kv{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:3px 0}
.sim-out .kv span{color:var(--mute)}
.sim-out .kv b{text-align:right}
.note{color:var(--mute);font-size:.9rem}
.eq{font-weight:700;font-size:1.1rem;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}

/* quiz */
.quiz{max-width:800px}
.q{border:1px solid var(--line);background:var(--card);border-radius:var(--r-m);padding:16px 18px;margin-bottom:14px}
.q .qt{font-weight:600;margin:0 0 10px}
.q .opts{display:grid;gap:6px}
.q .opts button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:var(--r-s);padding:8px 12px;cursor:pointer}
.q .opts button:hover:not(:disabled){border-color:var(--acc)}
.q .opts button.right{border-color:var(--ok);background:#EAF6EF}
.q .opts button.wrong{border-color:var(--bad);background:#FBECEA}
.q .ex{margin-top:10px;font-size:.93rem;color:var(--mute)}
.score{position:sticky;top:70px;background:var(--ink);color:#fff;border-radius:var(--r-m);padding:10px 16px;display:flex;gap:16px;align-items:center;margin-bottom:14px;z-index:5}

/* guide */
.panel{max-width:900px}
.panel h3{margin:28px 0 8px}
details.meet{border:1px solid var(--line);background:var(--card);border-radius:var(--r-m);margin:8px 0;padding:0 16px}
details.meet summary{cursor:pointer;padding:12px 0;font-weight:600}
details.meet ol{margin:0 0 14px}
.tag{display:inline-block;font-size:.78rem;font-weight:700;padding:1px 8px;border-radius:999px;margin-right:6px;color:#fff}
.tag.M{background:#2F6FD6}.tag.A{background:#2E8B57}.tag.R{background:#B7791F}

@media (max-width:900px){
  .land-hero,.land-classes,.land-how{grid-template-columns:1fr}
  .app{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}
  .side .grid{display:flex;overflow-x:auto;gap:8px}
  .side .tile{flex:0 0 86px}
  .side h2{display:none}
  .top .badge{display:none}
  .sim-grid{grid-template-columns:1fr}
  .stage{aspect-ratio:auto;min-height:60vh}
}
@media print{.top,.side,.tabs,.ctrl,.prog{display:none}.app{display:block}}

/* ---------- slide bergambar ---------- */
.stage.bleed{padding:0;overflow:hidden}
.slide .lead{font-size:clamp(1.05rem,1.8vw,1.45rem);max-width:60ch}
.ph{margin:0;position:relative;background:linear-gradient(135deg,#E8E2F3,#DDEBF0);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font-size:.78rem;color:#fff;background:linear-gradient(transparent,rgba(10,20,40,.75));display:flex;gap:10px;justify-content:space-between;align-items:flex-end}
.ph figcaption a{color:#E9E2F5;white-space:nowrap}
.ph.noimg img{display:none}
.ph.noimg::before{content:"Gambar memerlukan koneksi internet";position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:.9rem;padding:20px;text-align:center}
.slide.hero{position:relative;height:100%;min-height:100%}
.slide.hero .ph.bg{position:absolute;inset:0}
.slide.hero .ph.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,24,48,.85) 0%,rgba(15,24,48,.55) 45%,rgba(15,24,48,.05) 100%)}
.slide.hero .ph.bg figcaption{z-index:2;background:none;justify-content:flex-end}
.slide.hero .hero-txt{position:relative;z-index:2;color:#fff;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(24px,5vw,64px);max-width:62%}
.slide.hero .hero-txt h3{font-size:clamp(2rem,5vw,4rem);color:#fff;margin:0 0 .3em}
.slide.hero .kicker{color:#E4D7F7}
.slide.hero .lead{color:#EEF2F8}
.slide.hero .btn{background:#fff;color:var(--ink);border-color:#fff}
.slide.split{display:grid;grid-template-columns:1fr 1fr;height:100%}
.slide.split.rev .ph{order:2}
.slide.split .ph{height:100%}
.slide.split .txt{padding:clamp(20px,3.5vw,48px);overflow:auto}
.slide.split .txt h3{font-size:clamp(1.3rem,2.4vw,2rem)}
.slide.split .txt p,.slide.split .txt li{font-size:clamp(.95rem,1.35vw,1.15rem)}
.slide.split .formula{font-size:clamp(.95rem,1.3vw,1.1rem)}
.slide.split table{font-size:clamp(.8rem,1.1vw,1rem)}
.slide.gallery .gal{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:6px 0 14px}
.slide.gallery .gal .ph{aspect-ratio:4/3;border-radius:var(--r-s)}
.deck:fullscreen .stage.bleed{padding:0}
.simnav{display:flex;gap:8px;overflow-x:auto;margin:0 0 18px;padding-bottom:4px}
.simtab{flex:0 0 auto;max-width:240px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:var(--r-m);padding:8px 12px;cursor:pointer;font-weight:700;line-height:1.3}
.simtab span{display:block;font-size:.75rem;font-weight:600;color:var(--mute)}
.simtab.on{border-color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc)}
.sim-panel table{border-collapse:collapse;font-size:.9rem;margin:6px 0}
.sim-panel th,.sim-panel td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.sim-panel th{background:var(--soft)}
@media (max-width:900px){
  .slide.split{grid-template-columns:1fr;grid-template-rows:42vh auto;height:auto}
  .slide.split.rev .ph{order:0}
  .stage.bleed{overflow:auto}
  .slide.hero{min-height:70vh}
  .slide.hero .hero-txt{max-width:100%;min-height:70vh}
  .slide.gallery .gal{grid-template-columns:1fr}
  .ctrl{flex-wrap:wrap}
  .ctrl .count{flex-basis:100%}
}

.gal-txt{columns:2;column-gap:28px;font-size:.95rem}
.gal-txt p,.gal-txt li{font-size:clamp(.9rem,1.2vw,1.05rem)}
@media (max-width:900px){.gal-txt{columns:1}}

.offline-pill{margin-left:auto;font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--mute);white-space:nowrap}
.offline-pill.done{background:#EAF6EF;color:var(--ok)}
.offline-pill.warn{background:#FFF5E0;color:#8A5A00}
.offline-pill.float{position:fixed;left:16px;bottom:16px;z-index:50;box-shadow:0 2px 8px rgba(27,42,74,.15)}
.offline-pill:not([hidden])+.badge{margin-left:12px}
@media (max-width:900px){.offline-pill{font-size:.72rem;white-space:normal}}
</style></head>

<script>window.KELAS={"kelas":"XI","bab":[{"kode":"XI-1","no":1,"sem":1,"jp":30,"judul":"Stoikiometri","sym":"St","topik":"Berapa banyak \"partikel\" dalam sesendok gula? Menghitung zat untuk kehidupan sehari-hari","pemantik":["Berapa banyak molekul gula dalam satu sendok teh?","Bagaimana petani mengetahui banyaknya pupuk yang diperlukan untuk satu hektar sawah?","Mengapa industri berusaha memperoleh persen hasil reaksi setinggi mungkin?"],"pemahaman":"Zat yang sangat kecil dan berjumlah sangat banyak dapat \"dihitung\" dengan satuan mol, sehingga kita dapat menakar bahan secara tepat untuk keperluan pertanian, kesehatan, dan industri tanpa pemborosan.","tp":[{"k":"11.1.1","t":"Menjelaskan konsep mol serta hubungannya dengan jumlah partikel (bilangan Avogadro), massa molar, dan volume molar gas"},{"k":"11.1.2","t":"Menentukan rumus empiris dan rumus molekul senyawa berdasarkan data persen massa atau hasil analisis"},{"k":"11.1.3","t":"Menentukan rumus senyawa hidrat berdasarkan data percobaan pemanasan"},{"k":"11.1.4","t":"Menyelesaikan perhitungan stoikiometri reaksi termasuk pereaksi pembatas dan persen hasil"},{"k":"11.1.5","t":"Menerapkan konsep molaritas dalam perhitungan stoikiometri larutan"}],"materi":[{"h":"Konsep Mol","html":"<p>Mol adalah satuan jumlah zat. Satu mol zat mengandung 6,02 × 10<sup>23</sup> partikel (atom, molekul, atau ion). Bilangan ini disebut bilangan Avogadro (L). Seperti \"lusin\" yang berarti 12 buah, \"mol\" berarti 6,02 × 10<sup>23</sup> partikel.</p><div class=\"formula\">Jumlah partikel (N) = n × L</div><div class=\"formula\">Massa (m) = n × Mr (atau Ar)</div><div class=\"formula\">Volume gas STP (0 °C, 1 atm): V = n × 22,4 L;   RTP (25 °C, 1 atm): V = n × 24 L</div><div class=\"formula\">Gas pada kondisi lain: PV = nRT (R = 0,082 L atm mol<sup>−1</sup> K<sup>−1</sup>)</div><p>Peta konversi: jumlah partikel ⇄ <b>mol</b> ⇄ massa; mol ⇄ volume gas. Semua perhitungan selalu \"lewat\" mol.</p>"},{"h":"Kadar Zat, Rumus Empiris, dan Rumus Molekul","html":"<div class=\"formula\">% unsur dalam senyawa = (jumlah atom × Ar unsur ÷ Mr senyawa) × 100%</div><p>Rumus empiris (RE) menyatakan perbandingan mol atom paling sederhana. Rumus molekul (RM) = (RE)<sub>n</sub>, dengan n = Mr senyawa ÷ Mr RE.</p><ul><li>Langkah: ubah % atau massa setiap unsur menjadi mol → bandingkan → sederhanakan menjadi bilangan bulat → tentukan n dari Mr.</li><li>Contoh: urea CO(NH<sub>2</sub>)<sub>2</sub> (Mr 60) mengandung N = (2 × 14 / 60) × 100% = 46,7%.</li></ul>"},{"h":"Senyawa Hidrat","html":"<p>Hidrat adalah padatan yang mengikat molekul air kristal, misalnya terusi CuSO<sub>4</sub>·5H<sub>2</sub>O, gipsum CaSO<sub>4</sub>·2H<sub>2</sub>O, dan soda kristal Na<sub>2</sub>CO<sub>3</sub>·10H<sub>2</sub>O. Nilai x ditentukan dari perbandingan mol garam anhidrat dan mol air yang lepas saat pemanasan.</p><div class=\"formula\">x = mol H<sub>2</sub>O ÷ mol garam anhidrat</div>"},{"h":"Stoikiometri Reaksi, Pereaksi Pembatas, dan Persen Hasil","html":"<p>Koefisien reaksi setara menyatakan perbandingan mol zat-zat yang bereaksi.</p><ul><li>Langkah umum: setarakan reaksi → ubah data ke mol → gunakan perbandingan koefisien → ubah ke satuan yang ditanya.</li><li>Pereaksi pembatas: bagi mol setiap pereaksi dengan koefisiennya; hasil bagi terkecil adalah pereaksi pembatas.</li></ul><div class=\"formula\">Persen hasil = (hasil nyata ÷ hasil teoretis) × 100%</div>"},{"h":"Stoikiometri Larutan","html":"<div class=\"formula\">Molaritas: M = n ÷ V (L) = (massa ÷ Mr) × (1000 ÷ mL)</div><div class=\"formula\">Pengenceran: M<sub>1</sub>V<sub>1</sub> = M<sub>2</sub>V<sub>2</sub></div><p>Mol zat dalam larutan dihitung dari n = M × V, lalu digunakan dalam perbandingan koefisien seperti biasa.</p>"}],"contoh":[{"q":"Berapa gram gas oksigen yang diperlukan untuk membakar sempurna 1,6 g CH<sub>4</sub>? (Ar C = 12, H = 1, O = 16)","a":"CH<sub>4</sub> + 2O<sub>2</sub> → CO<sub>2</sub> + 2H<sub>2</sub>O. n CH<sub>4</sub> = 1,6/16 = 0,1 mol → n O<sub>2</sub> = 0,2 mol → m = 0,2 × 32 = 6,4 g."},{"q":"Sebanyak 5,4 g Al (Ar 27) direaksikan dengan 0,3 mol HCl: 2Al + 6HCl → 2AlCl<sub>3</sub> + 3H<sub>2</sub>. Tentukan pereaksi pembatas dan volume H<sub>2</sub> pada STP.","a":"n Al = 0,2 mol; Al: 0,2/2 = 0,1; HCl: 0,3/6 = 0,05 → HCl pembatas. n H<sub>2</sub> = 3/6 × 0,3 = 0,15 mol → V = 3,36 L."}],"rangkuman":"Mol → hubungan mol dengan jumlah partikel, massa, dan volume → kadar zat → rumus empiris &amp; molekul → rumus hidrat → stoikiometri reaksi → pereaksi pembatas &amp; persen hasil → stoikiometri larutan.","lkpd":{"judul":"Menentukan Rumus Senyawa Hidrat Terusi (CuSO<sub>4</sub>·xH<sub>2</sub>O)","tujuan":"Menentukan jumlah molekul air kristal (x) dalam terusi melalui percobaan pemanasan.","dasar":"Senyawa hidrat adalah senyawa padat yang mengikat sejumlah molekul air dalam kristalnya. Jika dipanaskan, air kristal akan lepas sehingga massa padatan berkurang. Terusi berwarna biru, sedangkan CuSO<sub>4</sub> anhidrat berwarna putih. Perbandingan mol CuSO<sub>4</sub> dan mol H<sub>2</sub>O yang lepas menunjukkan nilai x.","alat":["Cawan porselen","Neraca digital (ketelitian 0,01 g)","Pembakar spiritus/bunsen","Kaki tiga dan segitiga porselen","Penjepit cawan","Spatula","Desikator (bila ada)"],"bahan":["Kristal terusi CuSO<sub>4</sub>·xH<sub>2</sub>O ± 2–3 g"],"keselamatan":["Gunakan jas laboratorium, kacamata pelindung, dan sarung tangan.","Jangan menyentuh cawan panas dengan tangan; gunakan penjepit.","Terusi bersifat iritan dan beracun bagi organisme air; buang sisa bahan ke wadah limbah yang disediakan."],"langkah":["Timbang cawan porselen kosong yang bersih dan kering. Catat sebagai m<sub>1</sub>.","Masukkan ± 2–3 g kristal terusi ke dalam cawan, lalu timbang. Catat sebagai m<sub>2</sub>.","Panaskan cawan berisi terusi di atas pembakar dengan nyala sedang sambil sesekali diaduk hingga seluruh kristal berubah warna dari biru menjadi putih keabu-abuan.","Dinginkan cawan (sebaiknya dalam desikator) kemudian timbang. Catat sebagai m<sub>3</sub>.","Ulangi pemanasan selama 2–3 menit, dinginkan, dan timbang kembali hingga massa tetap (selisih ≤ 0,01 g)."],"pertanyaan":["Hitunglah mol CuSO<sub>4</sub> anhidrat (Mr = 159,5) dan mol H<sub>2</sub>O (Mr = 18) dari data percobaanmu.","Tentukan nilai x dan tuliskan rumus senyawa hidrat tersebut.","Bandingkan hasilmu dengan nilai teoretis (x = 5). Hitung persentase kesalahannya.","Sebutkan dua kemungkinan sumber kesalahan dan cara memperbaikinya.","Mengapa pemanasan harus diulang sampai massa tetap?"]},"quiz":[{"q":"Jumlah molekul yang terdapat dalam 0,5 mol air adalah … (L = 6,02 × 10<sup>23</sup>)","o":["1,20 × 10<sup>23</sup>","3,01 × 10<sup>23</sup>","6,02 × 10<sup>23</sup>","1,20 × 10<sup>24</sup>","3,01 × 10<sup>24</sup>"],"a":"B","b":"N = n × L = 0,5 × 6,02 × 10<sup>23</sup> = 3,01 × 10<sup>23</sup> molekul."},{"q":"Massa dari 0,25 mol CaCO<sub>3</sub> (Mr = 100) adalah …","o":["2,5 g","4 g","25 g","40 g","250 g"],"a":"C","b":"m = n × Mr = 0,25 × 100 = 25 g."},{"q":"Volume 8,8 g gas CO<sub>2</sub> (Mr = 44) pada keadaan STP adalah …","o":["2,24 L","4,48 L","6,72 L","8,96 L","11,2 L"],"a":"B","b":"n = 8,8/44 = 0,2 mol; V = 0,2 × 22,4 = 4,48 L."},{"q":"Suatu hidrokarbon mengandung 80% karbon dan 20% hidrogen. Jika Mr senyawa = 30, rumus molekulnya adalah …","o":["CH<sub>3</sub>","C<sub>2</sub>H<sub>4</sub>","C<sub>2</sub>H<sub>6</sub>","C<sub>3</sub>H<sub>8</sub>","CH<sub>4</sub>"],"a":"C","b":"C : H = 80/12 : 20/1 = 6,67 : 20 = 1 : 3 → RE CH<sub>3</sub> (15); n = 30/15 = 2 → C<sub>2</sub>H<sub>6</sub>."},{"q":"Sebanyak 14 g N<sub>2</sub> direaksikan dengan 6 g H<sub>2</sub> menurut reaksi N<sub>2</sub> + 3H<sub>2</sub> → 2NH<sub>3</sub>. Massa NH<sub>3</sub> maksimum yang terbentuk adalah … (Ar N = 14, H = 1)","o":["8,5 g","17 g","20 g","34 g","51 g"],"a":"B","b":"n N<sub>2</sub> = 0,5 mol; n H<sub>2</sub> = 3 mol. Untuk 0,5 mol N<sub>2</sub> diperlukan 1,5 mol H<sub>2</sub> sehingga N<sub>2</sub> pereaksi pembatas. n NH<sub>3</sub> = 1 mol → 17 g."},{"q":"Sebanyak 4 g NaOH (Mr = 40) dilarutkan dalam air hingga volume 250 mL. Molaritas larutan tersebut adalah …","o":["0,01 M","0,1 M","0,4 M","1 M","4 M"],"a":"C","b":"n = 4/40 = 0,1 mol; M = 0,1/0,25 = 0,4 M."},{"q":"Pemanasan 4,99 g CuSO<sub>4</sub>·xH<sub>2</sub>O menghasilkan 3,19 g CuSO<sub>4</sub> (Mr = 159,5). Nilai x adalah …","o":["2","3","4","5","7"],"a":"D","b":"n CuSO<sub>4</sub> = 0,02 mol; massa air = 1,80 g → 0,1 mol; x = 0,1/0,02 = 5."},{"q":"Pemanasan 10 g CaCO<sub>3</sub> (Mr = 100) menghasilkan 4,48 g CaO (Mr = 56). Persen hasil reaksi tersebut adalah …","o":["44,8%","56%","75%","80%","90%"],"a":"D","b":"Hasil teoretis = 0,1 mol × 56 = 5,6 g; % hasil = 4,48/5,6 × 100% = 80%."}],"pertemuan":[{"tp":"11.1.1","jp":3,"sub":"Konsep mol dan bilangan Avogadro","aps":"Permainan \"Tebak Satuan\": 1 lusin = 12 buah, 1 rim = 500 lembar. Bagaimana menyatakan jumlah partikel yang sangat banyak?","inti":[{"tag":"M","t":"Peserta didik menyimak video singkat dan bacaan tentang bilangan Avogadro, lalu mendiskusikan analogi mol dengan lusin/rim."},{"tag":"M","t":"Guru memodelkan contoh konversi mol ⇄ jumlah partikel (worked example) dan peserta didik mencoba soal serupa berpasangan."},{"tag":"A","t":"Peserta didik menyelesaikan latihan berjenjang (mudah–sedang–menantang) secara mandiri; guru mendampingi peserta didik yang memerlukan bantuan."},{"tag":"R","t":"Peserta didik menuliskan satu analogi mol versi mereka sendiri di kartu refleksi."}],"form":"Exit ticket 3 soal konversi mol–partikel"},{"tp":"11.1.1","jp":3,"sub":"Massa molar: hubungan mol dan massa","aps":"Guru memperlihatkan sesendok garam dan sesendok gula. \"Mana yang mengandung partikel lebih banyak?\"","inti":[{"tag":"M","t":"Peserta didik mengkaji hubungan Ar/Mr dengan massa molar melalui tabel data."},{"tag":"A","t":"Kelompok menimbang garam, gula, dan 18 mL air, lalu menghitung mol dan jumlah partikel setiap zat."},{"tag":"A","t":"Kelompok menuliskan hasil di papan dan membandingkan dengan dugaan awal."},{"tag":"R","t":"Diskusi kelas: mengapa massa sama belum tentu jumlah partikelnya sama?"}],"form":"Lembar kerja penimbangan dan perhitungan"},{"tp":"11.1.1","jp":2,"sub":"Volume molar gas dan peta konversi mol","aps":"Guru meniup balon. \"Bagaimana menghitung jumlah mol gas dalam balon ini?\"","inti":[{"tag":"M","t":"Peserta didik mempelajari volume molar gas pada STP, RTP, dan persamaan gas ideal."},{"tag":"A","t":"Kelompok menyusun peta konversi mol (partikel–massa–volume) dan menyelesaikan soal gabungan."},{"tag":"R","t":"Peserta didik memeriksa peta konversi kelompok lain dan memberi satu saran perbaikan."}],"form":"Kuis daring 5 soal"},{"tp":"11.1.2","jp":3,"sub":"Kadar unsur dalam senyawa","aps":"Guru menunjukkan karung pupuk urea bertuliskan \"N 46%\". \"Dari mana angka ini diperoleh?\"","inti":[{"tag":"M","t":"Peserta didik menurunkan rumus persen massa unsur dari contoh urea."},{"tag":"A","t":"Kelompok menganalisis label produk (urea, ZA, garam beriodium) dan menghitung kadar unsurnya."},{"tag":"A","t":"Kelompok menghitung kebutuhan pupuk untuk lahan contoh berdasarkan kadar N."},{"tag":"R","t":"Peserta didik mengaitkan perhitungan kadar dengan penggunaan pupuk yang bijak bagi lingkungan."}],"form":"Hasil analisis label produk"},{"tp":"11.1.2","jp":2,"sub":"Rumus empiris dan rumus molekul","aps":"Glukosa C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> dan asam asetat C<sub>2</sub>H<sub>4</sub>O<sub>2</sub> memiliki rumus empiris sama, yaitu CH<sub>2</sub>O. Bagaimana mungkin?","inti":[{"tag":"M","t":"Guru memodelkan langkah penentuan rumus empiris dan rumus molekul."},{"tag":"A","t":"Peserta didik menyelesaikan soal berpasangan dari data persen massa dan data pembakaran."},{"tag":"R","t":"Peserta didik mengidentifikasi kesalahan umum (pembulatan, lupa membagi Ar) dari contoh jawaban keliru."}],"form":"Tiga soal rumus empiris/molekul"},{"tp":"11.1.3","jp":3,"sub":"Praktikum rumus hidrat terusi","aps":"Guru menunjukkan terusi biru dan CuSO<sub>4</sub> anhidrat putih. \"Ke mana perginya warna biru?\"","inti":[{"tag":"M","t":"Guru menjelaskan prosedur dan keselamatan kerja praktikum."},{"tag":"A","t":"Kelompok melakukan praktikum pemanasan terusi sesuai LKPD dan mencatat data massa."},{"tag":"A","t":"Kelompok menghitung nilai x dan persentase kesalahan."},{"tag":"R","t":"Kelompok membandingkan nilai x antar-kelompok dan mendiskusikan sumber kesalahan serta perbaikannya."}],"form":"LKPD dan rubrik observasi praktikum"},{"tp":"11.1.4","jp":3,"sub":"Perbandingan koefisien dalam perhitungan reaksi","aps":"Resep roti: 2 butir telur untuk 1 gelas tepung. \"Berapa telur untuk 3 gelas tepung?\"","inti":[{"tag":"M","t":"Peserta didik menyimpulkan bahwa koefisien reaksi menyatakan perbandingan mol."},{"tag":"M","t":"Guru memodelkan langkah stoikiometri: setarakan → mol → perbandingan koefisien → satuan yang ditanya."},{"tag":"A","t":"Peserta didik menyelesaikan soal massa–massa dan massa–volume secara bertahap."},{"tag":"R","t":"Peserta didik menuliskan langkah umum stoikiometri dengan bahasanya sendiri."}],"form":"Kuis 4 soal stoikiometri"},{"tp":"11.1.4","jp":3,"sub":"Pereaksi pembatas","aps":"Dari 10 lembar roti dan 3 lembar keju, berapa sandwich (2 roti + 1 keju) yang bisa dibuat? Bahan apa yang tersisa?","inti":[{"tag":"M","t":"Peserta didik bereksplorasi dengan simulasi PhET \"Reactants, Products and Leftovers\"."},{"tag":"A","t":"Kelompok menyelesaikan soal pereaksi pembatas dan menuliskannya di kertas plano."},{"tag":"A","t":"Gallery walk: kelompok saling memeriksa dan memberi komentar pada jawaban kelompok lain."},{"tag":"R","t":"Diskusi kesalahan yang paling sering ditemukan saat gallery walk."}],"form":"Rubrik gallery walk dan hasil kerja kelompok"},{"tp":"11.1.4","jp":3,"sub":"Persen hasil dan stoikiometri kontekstual","aps":"Sebuah pabrik kapur memanaskan 1 ton batu kapur tetapi hanya memperoleh 500 kg CaO. \"Apakah prosesnya efisien?\"","inti":[{"tag":"M","t":"Peserta didik membedakan hasil teoretis dan hasil nyata."},{"tag":"A","t":"Kelompok menyelesaikan studi kasus industri (produksi CaO, pupuk) termasuk pereaksi pembatas dan persen hasil."},{"tag":"R","t":"Peserta didik merefleksikan nilai hemat bahan dan dampak limbah bagi lingkungan."}],"form":"Penilaian penyelesaian studi kasus"},{"tp":"11.1.5","jp":3,"sub":"Molaritas, pengenceran, dan stoikiometri larutan","aps":"Satu sachet oralit dilarutkan dalam 200 mL air. \"Mengapa takarannya harus tepat?\"","inti":[{"tag":"M","t":"Peserta didik mempelajari molaritas dan pengenceran."},{"tag":"A","t":"Kelompok membuat larutan gula/garam 0,1 M sebanyak 100 mL dan mengencerkannya menjadi 0,05 M."},{"tag":"A","t":"Peserta didik menghitung stoikiometri larutan (misalnya Mg + HCl)."},{"tag":"R","t":"Peserta didik menyusun peta konsep seluruh bab dan menandai bagian yang belum dikuasai."}],"form":"Produk larutan dan soal stoikiometri larutan"}],"media":[["PhET \"Reactants, Products and Leftovers\"","Simulasi interaktif","Visualisasi pereaksi pembatas dan sisa pereaksi (phet.colorado.edu)"],["Kartu peta konversi mol","Alat peraga cetak","Panduan alur perhitungan mol"],["Label kemasan pupuk urea, garam, gula","Benda nyata","Konteks perhitungan kadar dan rumus"],["Kristal terusi dan neraca digital","Alat praktikum","Praktikum rumus hidrat"],["Tayangan slide/papan tulis","Media presentasi","Contoh soal bertahap (worked example)"]],"glosarium":[["Mol","Satuan jumlah zat yang mengandung 6,02 × 10<sup>23</sup> partikel."],["Bilangan Avogadro (L)","Jumlah partikel dalam 1 mol zat, yaitu 6,02 × 10<sup>23</sup>."],["Rumus empiris","Rumus yang menyatakan perbandingan bilangan bulat paling sederhana dari atom-atom penyusun senyawa."],["Pereaksi pembatas","Pereaksi yang habis lebih dahulu dan menentukan jumlah produk."],["Molaritas","Jumlah mol zat terlarut dalam 1 liter larutan."]],"slides":[{"lay":"hero","k":"Bab 1","t":"Stoikiometri","sim":"","img":{"f":"Copper_sulfate_pentahydrate_crystals.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Copper_sulfate_pentahydrate_crystals.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Copper_sulfate_pentahydrate_crystals.jpg","alt":"Copper sulfate pentahydrate crystals","cap":""},"body":"Menghitung zat yang tak terlihat untuk kehidupan sehari-hari"},{"lay":"split","k":"Pertanyaan pemantik","t":"Berapa banyak molekul gula dalam satu sendok teh?","sim":"","img":{"f":"Sugar_closeup.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Sugar_closeup.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Sugar_closeup.jpg","alt":"Sugar closeup","cap":""},"body":["Satu sendok teh gula (± 4 g) berisi sekitar 7 × 10<sup>21</sup> molekul sukrosa.","Bagaimana ilmuwan menghitung sesuatu sebanyak itu tanpa menghitung satu per satu?","Bagaimana petani menakar pupuk untuk satu hektar sawah?"]},{"lay":"splitR","k":"Tokoh","t":"Avogadro dan satuan mol","sim":"","img":{"f":"Avogadro_Amedeo.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Avogadro_Amedeo.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Avogadro_Amedeo.jpg","alt":"Amedeo Avogadro (1776–1856)","cap":"Amedeo Avogadro (1776–1856)"},"body":["Avogadro mengemukakan bahwa gas bervolume sama (pada suhu dan tekanan sama) mengandung jumlah molekul yang sama.","Untuk menghormatinya, jumlah partikel dalam 1 mol disebut <b>bilangan Avogadro</b>: 6,02 × 10<sup>23</sup>.","Seperti 1 lusin = 12 buah, <b>1 mol = 6,02 × 10<sup>23</sup> partikel</b>."]},{"lay":"split","k":"Materi","t":"Konsep Mol","sim":"XI-1b","img":{"f":"Analytical_balance_mettler_ae-260.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Analytical_balance_mettler_ae-260.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Analytical_balance_mettler_ae-260.jpg","alt":"Neraca analitik","cap":"Neraca analitik"},"html":"<p>Mol adalah satuan jumlah zat. Satu mol zat mengandung 6,02 × 10<sup>23</sup> partikel (atom, molekul, atau ion). Bilangan ini disebut bilangan Avogadro (L). Seperti \"lusin\" yang berarti 12 buah, \"mol\" berarti 6,02 × 10<sup>23</sup> partikel.</p><div class=\"formula\">Jumlah partikel (N) = n × L</div><div class=\"formula\">Massa (m) = n × Mr (atau Ar)</div><div class=\"formula\">Volume gas STP (0 °C, 1 atm): V = n × 22,4 L;   RTP (25 °C, 1 atm): V = n × 24 L</div><div class=\"formula\">Gas pada kondisi lain: PV = nRT (R = 0,082 L atm mol<sup>−1</sup> K<sup>−1</sup>)</div><p>Peta konversi: jumlah partikel ⇄ <b>mol</b> ⇄ massa; mol ⇄ volume gas. Semua perhitungan selalu \"lewat\" mol.</p>"},{"lay":"split","k":"Materi","t":"Kadar Zat, Rumus Empiris, dan Rumus Molekul","sim":"XI-1c","img":{"f":"Sample_of_Urea.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Sample_of_Urea.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Sample_of_Urea.jpg","alt":"Urea, CO(NH₂)₂","cap":"Urea, CO(NH₂)₂"},"html":"<div class=\"formula\">% unsur dalam senyawa = (jumlah atom × Ar unsur ÷ Mr senyawa) × 100%</div><p>Rumus empiris (RE) menyatakan perbandingan mol atom paling sederhana. Rumus molekul (RM) = (RE)<sub>n</sub>, dengan n = Mr senyawa ÷ Mr RE.</p><ul><li>Langkah: ubah % atau massa setiap unsur menjadi mol → bandingkan → sederhanakan menjadi bilangan bulat → tentukan n dari Mr.</li><li>Contoh: urea CO(NH<sub>2</sub>)<sub>2</sub> (Mr 60) mengandung N = (2 × 14 / 60) × 100% = 46,7%.</li></ul>"},{"lay":"splitR","k":"Materi","t":"Senyawa Hidrat","sim":"XI-1d","img":{"f":"CuSO4_(5aq).jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/CuSO4_(5aq).jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:CuSO4_(5aq).jpg","alt":"Terusi, CuSO₄·5H₂O","cap":"Terusi, CuSO₄·5H₂O"},"html":"<p>Hidrat adalah padatan yang mengikat molekul air kristal, misalnya terusi CuSO<sub>4</sub>·5H<sub>2</sub>O, gipsum CaSO<sub>4</sub>·2H<sub>2</sub>O, dan soda kristal Na<sub>2</sub>CO<sub>3</sub>·10H<sub>2</sub>O. Nilai x ditentukan dari perbandingan mol garam anhidrat dan mol air yang lepas saat pemanasan.</p><div class=\"formula\">x = mol H<sub>2</sub>O ÷ mol garam anhidrat</div>"},{"lay":"split","k":"Materi","t":"Stoikiometri Reaksi, Pereaksi Pembatas, dan Persen Hasil","sim":"XI-1","img":{"f":"Lab_glassware.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Lab_glassware.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Lab_glassware.jpg","alt":"Peralatan laboratorium","cap":"Peralatan laboratorium"},"html":"<p>Koefisien reaksi setara menyatakan perbandingan mol zat-zat yang bereaksi.</p><ul><li>Langkah umum: setarakan reaksi → ubah data ke mol → gunakan perbandingan koefisien → ubah ke satuan yang ditanya.</li><li>Pereaksi pembatas: bagi mol setiap pereaksi dengan koefisiennya; hasil bagi terkecil adalah pereaksi pembatas.</li></ul><div class=\"formula\">Persen hasil = (hasil nyata ÷ hasil teoretis) × 100%</div>"},{"lay":"splitR","k":"Materi","t":"Stoikiometri Larutan","sim":"XI-1e","img":{"f":"Spoon_Sugar_Solution_with_Glass.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Spoon_Sugar_Solution_with_Glass.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Spoon_Sugar_Solution_with_Glass.jpg","alt":"Membuat larutan gula","cap":"Membuat larutan gula"},"html":"<div class=\"formula\">Molaritas: M = n ÷ V (L) = (massa ÷ Mr) × (1000 ÷ mL)</div><div class=\"formula\">Pengenceran: M<sub>1</sub>V<sub>1</sub> = M<sub>2</sub>V<sub>2</sub></div><p>Mol zat dalam larutan dihitung dari n = M × V, lalu digunakan dalam perbandingan koefisien seperti biasa.</p>"},{"lay":"contoh","k":"","t":"","sim":"","q":"Berapa gram gas oksigen yang diperlukan untuk membakar sempurna 1,6 g CH<sub>4</sub>? (Ar C = 12, H = 1, O = 16)","a":"CH<sub>4</sub> + 2O<sub>2</sub> → CO<sub>2</sub> + 2H<sub>2</sub>O. n CH<sub>4</sub> = 1,6/16 = 0,1 mol → n O<sub>2</sub> = 0,2 mol → m = 0,2 × 32 = 6,4 g."},{"lay":"contoh","k":"","t":"","sim":"","q":"Sebanyak 5,4 g Al (Ar 27) direaksikan dengan 0,3 mol HCl: 2Al + 6HCl → 2AlCl<sub>3</sub> + 3H<sub>2</sub>. Tentukan pereaksi pembatas dan volume H<sub>2</sub> pada STP.","a":"n Al = 0,2 mol; Al: 0,2/2 = 0,1; HCl: 0,3/6 = 0,05 → HCl pembatas. n H<sub>2</sub> = 3/6 × 0,3 = 0,15 mol → V = 3,36 L."},{"lay":"hero","k":"Praktikum","t":"Menentukan rumus hidrat terusi","sim":"XI-1d","img":{"f":"Copper_sulfate.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Copper_sulfate.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Copper_sulfate.jpg","alt":"Copper sulfate","cap":""},"body":"Panaskan terusi biru hingga menjadi putih, timbang, lalu hitung nilai x pada CuSO₄·xH₂O."},{"lay":"refleksi","k":"","t":"","sim":""}]},{"kode":"XI-2","no":2,"sem":1,"jp":30,"judul":"Ikatan Kimia dan Interaksi Antarpartikel","sym":"Ik","topik":"Mengapa minyak dan air tidak bisa bersatu? Menyingkap rahasia ikatan dan gaya antarpartikel","pemantik":["Mengapa minyak dan air tidak dapat bercampur?","Mengapa garam dapur keras, sedangkan lilin lunak?","Mengapa air mendidih pada 100 °C, padahal H<sub>2</sub>S yang mirip sudah berupa gas pada suhu ruang?"],"pemahaman":"Sifat zat yang kita lihat (keras, mudah larut, mudah menguap) ditentukan oleh cara partikel-partikelnya berikatan dan saling menarik, sehingga dengan memahami ikatan kita dapat menjelaskan dan meramalkan sifat bahan di sekitar kita.","tp":[{"k":"11.2.1","t":"Menganalisis pembentukan ikatan ion, kovalen, dan logam serta hubungannya dengan sifat fisik zat"},{"k":"11.2.2","t":"Meramalkan bentuk molekul menggunakan teori VSEPR (domain elektron)"},{"k":"11.2.3","t":"Menentukan kepolaran molekul berdasarkan keelektronegatifan dan bentuk molekul"},{"k":"11.2.4","t":"Menganalisis gaya antarmolekul (gaya London, dipol-dipol, ikatan hidrogen) dan pengaruhnya terhadap titik didih dan kelarutan"},{"k":"11.2.5","t":"Merancang dan melakukan percobaan untuk membuktikan hubungan jenis ikatan dan interaksi antarpartikel dengan sifat fisik zat"}],"materi":[{"h":"Kestabilan Atom dan Struktur Lewis","html":"<p>Atom cenderung mencapai konfigurasi elektron seperti gas mulia (aturan oktet/duplet) dengan melepas, menerima, atau memakai bersama elektron. Struktur Lewis menggambarkan elektron valensi dengan titik atau silang.</p><ul><li>Pengecualian aturan oktet: BF<sub>3</sub> (B hanya 6 elektron), PCl<sub>5</sub> dan SF<sub>6</sub> (oktet berkembang).</li></ul>"},{"h":"Jenis Ikatan dan Sifat Zat","html":"<ul><li><b>Ikatan ion:</b> serah terima elektron antara logam dan nonlogam (NaCl, MgO). Sifat: padat, titik leleh tinggi, keras tetapi rapuh, lelehan/larutannya menghantarkan listrik.</li><li><b>Ikatan kovalen:</b> pemakaian bersama pasangan elektron antarnonlogam (H<sub>2</sub>O, CO<sub>2</sub>). Dapat tunggal, rangkap dua, rangkap tiga, atau kovalen koordinasi (NH<sub>4</sub><sup>+</sup>). Titik leleh umumnya rendah.</li><li><b>Ikatan logam:</b> kation logam dalam \"lautan elektron\" yang bebas bergerak. Sifat: menghantarkan listrik dan panas, dapat ditempa, mengilap.</li></ul>"},{"h":"Bentuk Molekul (Teori VSEPR)","html":"<p>Pasangan elektron di sekitar atom pusat saling tolak sehingga menempati posisi sejauh mungkin. Notasi AX<sub>n</sub>E<sub>m</sub>: A = atom pusat, X = pasangan elektron ikatan (PEI), E = pasangan elektron bebas (PEB). Urutan tolakan: PEB–PEB &gt; PEB–PEI &gt; PEI–PEI.</p><table><tr><th>Notasi</th><th>Bentuk molekul</th><th>Sudut ikatan</th><th>Contoh</th></tr><tr><td>AX<sub>2</sub></td><td>Linear</td><td>180°</td><td>CO<sub>2</sub>, BeCl<sub>2</sub></td></tr><tr><td>AX<sub>3</sub></td><td>Segitiga datar</td><td>120°</td><td>BF<sub>3</sub></td></tr><tr><td>AX<sub>4</sub></td><td>Tetrahedral</td><td>109,5°</td><td>CH<sub>4</sub>, CCl<sub>4</sub></td></tr><tr><td>AX<sub>3</sub>E</td><td>Piramida segitiga</td><td>± 107°</td><td>NH<sub>3</sub></td></tr><tr><td>AX<sub>2</sub>E<sub>2</sub></td><td>Bentuk V</td><td>± 104,5°</td><td>H<sub>2</sub>O</td></tr><tr><td>AX<sub>5</sub></td><td>Bipiramida segitiga</td><td>90°, 120°</td><td>PCl<sub>5</sub></td></tr><tr><td>AX<sub>6</sub></td><td>Oktahedral</td><td>90°</td><td>SF<sub>6</sub></td></tr></table>"},{"h":"Kepolaran Molekul","html":"<p>Ikatan polar terjadi bila terdapat perbedaan keelektronegatifan. Molekul polar bila resultan momen dipolnya tidak nol, yaitu bila ikatannya polar <b>dan</b> bentuknya tidak simetris (atau atom pusat memiliki PEB).</p><ul><li>Polar: H<sub>2</sub>O, NH<sub>3</sub>, HCl, CHCl<sub>3</sub>. Nonpolar: CO<sub>2</sub>, CH<sub>4</sub>, CCl<sub>4</sub>, BF<sub>3</sub>.</li></ul>"},{"h":"Gaya Antarmolekul","html":"<ul><li><b>Gaya London (dispersi):</b> dimiliki semua molekul, makin kuat bila Mr makin besar dan rantai makin panjang/lurus.</li><li><b>Dipol–dipol:</b> antarmolekul polar.</li><li><b>Ikatan hidrogen:</b> antara atom H yang terikat pada F, O, atau N dengan atom F, O, atau N molekul lain; paling kuat di antara gaya antarmolekul. Menyebabkan titik didih H<sub>2</sub>O, HF, NH<sub>3</sub> jauh lebih tinggi dari hidrida segolongannya.</li></ul><p>Makin kuat gaya antarmolekul → titik didih dan viskositas makin tinggi. Zat larut dalam pelarut yang sejenis kepolarannya (<i>like dissolves like</i>).</p>"}],"contoh":[{"q":"Tentukan bentuk molekul SO<sub>2</sub> (S pusat, 6 elektron valensi; ikatan rangkap dihitung satu domain).","a":"S membentuk 2 domain ikatan dengan O dan memiliki 1 PEB → AX<sub>2</sub>E → bentuk V (sudut ± 119°), molekul polar."},{"q":"Urutkan titik didih HF, HCl, HBr, dan HI. Jelaskan.","a":"HF &gt; HI &gt; HBr &gt; HCl. HF memiliki ikatan hidrogen; untuk HCl–HI, gaya London makin kuat seiring kenaikan Mr."}],"rangkuman":"Elektron valensi → aturan oktet &amp; struktur Lewis → ikatan ion, kovalen, logam → teori VSEPR &amp; bentuk molekul → kepolaran → gaya antarmolekul → sifat fisik zat.","lkpd":{"judul":"Hubungan Jenis Ikatan dan Interaksi Antarpartikel dengan Sifat Fisik Zat","tujuan":"Membuktikan hubungan jenis ikatan dan kepolaran zat dengan daya hantar listrik dan kelarutannya.","dasar":"Senyawa ion dapat menghantarkan listrik dalam bentuk lelehan atau larutan karena ion-ionnya bebas bergerak. Senyawa kovalen polar tertentu dapat menghantarkan listrik bila terionisasi dalam air, sedangkan senyawa kovalen nonpolar tidak. Zat polar cenderung larut dalam pelarut polar, sedangkan zat nonpolar larut dalam pelarut nonpolar (<i>like dissolves like</i>).","alat":["Alat uji elektrolit (baterai, lampu/LED, kabel, elektrode karbon)","Gelas kimia 100 mL (6 buah)","Tabung reaksi dan rak","Pengaduk","Gelas ukur"],"bahan":["Garam dapur (NaCl)","Gula pasir","Lilin/parafin (diserut)","Etanol 70%","Akuades","Minyak goreng","Larutan cuka (asam asetat)"],"keselamatan":["Etanol mudah terbakar; jauhkan dari api.","Jangan menyentuh elektrode saat rangkaian tersambung.","Bersihkan elektrode dengan akuades setiap berganti larutan."],"langkah":["<b>Bagian A – Daya hantar listrik:</b> Larutkan masing-masing 1 sendok garam dan gula dalam 50 mL akuades. Siapkan juga 50 mL etanol, akuades, dan larutan cuka.","Celupkan elektrode alat uji ke dalam setiap cairan. Amati nyala lampu dan gelembung gas pada elektrode. Catat hasilnya.","<b>Bagian B – Kelarutan:</b> Masukkan sedikit garam, gula, dan serutan lilin ke dalam tabung berisi 5 mL air, lalu kocok.","Ulangi dengan pelarut minyak goreng. Amati apakah zat larut, sedikit larut, atau tidak larut.","Catat seluruh pengamatan pada tabel."],"pertanyaan":["Kelompokkan zat-zat yang diuji berdasarkan daya hantar listriknya. Jelaskan alasannya dari sudut pandang partikel penyusunnya.","Mengapa larutan gula tidak menghantarkan listrik walaupun gula larut dalam air?","Mengapa lilin larut dalam minyak tetapi tidak larut dalam air?","Bagaimana larutan cuka dapat menghantarkan listrik padahal asam asetat merupakan senyawa kovalen?","Kaitkan hasil percobaan dengan konsep <i>like dissolves like</i>."]},"quiz":[{"q":"Pasangan senyawa berikut yang keduanya berikatan ion adalah …","o":["HCl dan NH<sub>3</sub>","CO<sub>2</sub> dan H<sub>2</sub>O","NaCl dan MgO","CH<sub>4</sub> dan NaCl","Cl<sub>2</sub> dan KBr"],"a":"C","b":"NaCl dan MgO terbentuk dari logam dan nonlogam melalui serah terima elektron."},{"q":"Molekul NH<sub>3</sub> memiliki 3 pasangan elektron ikatan dan 1 pasangan elektron bebas. Bentuk molekulnya adalah …","o":["Segitiga datar","Tetrahedral","Piramida segitiga (trigonal piramida)","Bentuk V","Linear"],"a":"C","b":"Notasi AX<sub>3</sub>E → piramida segitiga."},{"q":"Bentuk molekul H<sub>2</sub>O adalah bentuk V karena …","o":["atom O tidak memiliki pasangan elektron bebas","atom O memiliki 2 PEI dan 2 PEB","atom H memiliki pasangan elektron bebas","terdapat ikatan rangkap","molekulnya nonpolar"],"a":"B","b":"AX<sub>2</sub>E<sub>2</sub>: dua PEB menekan PEI sehingga bentuknya V dengan sudut ± 104,5°."},{"q":"Molekul berikut memiliki ikatan kovalen polar tetapi bersifat nonpolar adalah …","o":["H<sub>2</sub>O","NH<sub>3</sub>","HCl","CO<sub>2</sub>","HF"],"a":"D","b":"CO<sub>2</sub> berbentuk linear dan simetris sehingga momen dipolnya saling meniadakan."},{"q":"Titik didih H<sub>2</sub>O (100 °C) jauh lebih tinggi daripada H<sub>2</sub>S (−60 °C). Penyebab utamanya adalah …","o":["Mr H<sub>2</sub>O lebih besar","adanya ikatan hidrogen antarmolekul H<sub>2</sub>O","ikatan kovalen O–H lebih lemah","H<sub>2</sub>O bersifat nonpolar","adanya ikatan ion pada H<sub>2</sub>O"],"a":"B","b":"Ikatan hidrogen antarmolekul air jauh lebih kuat daripada gaya dipol-dipol pada H<sub>2</sub>S."},{"q":"Urutan titik didih yang benar untuk CH<sub>4</sub>, C<sub>2</sub>H<sub>6</sub>, dan C<sub>3</sub>H<sub>8</sub> adalah …","o":["CH<sub>4</sub> &gt; C<sub>2</sub>H<sub>6</sub> &gt; C<sub>3</sub>H<sub>8</sub>","C<sub>3</sub>H<sub>8</sub> &gt; C<sub>2</sub>H<sub>6</sub> &gt; CH<sub>4</sub>","C<sub>2</sub>H<sub>6</sub> &gt; CH<sub>4</sub> &gt; C<sub>3</sub>H<sub>8</sub>","ketiganya sama","CH<sub>4</sub> &gt; C<sub>3</sub>H<sub>8</sub> &gt; C<sub>2</sub>H<sub>6</sub>"],"a":"B","b":"Makin besar Mr, makin kuat gaya London sehingga titik didih makin tinggi."},{"q":"Suatu zat padat bertitik leleh tinggi, tidak menghantarkan listrik dalam keadaan padat, tetapi menghantarkan listrik dalam bentuk lelehan. Zat tersebut kemungkinan adalah …","o":["logam","senyawa kovalen polar","senyawa kovalen nonpolar","senyawa ion","unsur gas mulia"],"a":"D","b":"Ion-ion senyawa ion terikat kuat dalam padatan, tetapi bebas bergerak dalam lelehan."},{"q":"Molekul PCl<sub>5</sub> (5 PEI, tanpa PEB pada atom pusat) memiliki bentuk …","o":["Tetrahedral","Oktahedral","Segitiga datar","Bipiramida segitiga","Jungkat-jungkit"],"a":"D","b":"AX<sub>5</sub> → bipiramida segitiga (trigonal bipiramida)."}],"pertemuan":[{"tp":"11.2.1","jp":3,"sub":"Aturan oktet dan struktur Lewis","aps":"Permainan \"Mencari Pasangan Elektron\" dengan kartu unsur.","inti":[{"tag":"M","t":"Peserta didik meninjau konfigurasi elektron dan elektron valensi."},{"tag":"M","t":"Guru memodelkan penggambaran struktur Lewis."},{"tag":"A","t":"Peserta didik menggambar struktur Lewis H<sub>2</sub>O, NH<sub>3</sub>, CO<sub>2</sub>, N<sub>2</sub> dan memeriksanya berpasangan."},{"tag":"R","t":"Peserta didik menuliskan langkah menggambar struktur Lewis."}],"form":"Lembar latihan struktur Lewis"},{"tp":"11.2.1","jp":2,"sub":"Ikatan ion dan ikatan kovalen","aps":"Mengapa natrium (logam reaktif) dan klorin (gas beracun) membentuk garam dapur yang aman dikonsumsi?","inti":[{"tag":"M","t":"Peserta didik membandingkan pembentukan ikatan ion dan kovalen (tunggal, rangkap, koordinasi)."},{"tag":"A","t":"Peserta didik mengklasifikasikan 10 senyawa ke dalam jenis ikatan beserta alasannya."},{"tag":"R","t":"Diskusi singkat miskonsepsi tentang ikatan."}],"form":"Tabel klasifikasi jenis ikatan"},{"tp":"11.2.1","jp":2,"sub":"Ikatan logam dan hubungan jenis ikatan dengan sifat zat","aps":"Mengapa kabel listrik terbuat dari tembaga, bukan garam?","inti":[{"tag":"M","t":"Peserta didik mempelajari model lautan elektron pada ikatan logam."},{"tag":"A","t":"Kelompok menyusun tabel perbandingan sifat senyawa ion, kovalen, dan logam dengan contoh benda di sekitar."},{"tag":"R","t":"Peserta didik menjawab pertanyaan pemantik dengan konsep ikatan."}],"form":"Tabel perbandingan sifat zat"},{"tp":"11.2.2","jp":3,"sub":"Teori VSEPR dan notasi AX<sub>n</sub>E<sub>m</sub>","aps":"Guru menunjukkan balon-balon yang diikat bersama; balon tersusun saling menjauh.","inti":[{"tag":"M","t":"Peserta didik menemukan prinsip tolakan pasangan elektron dari analogi balon."},{"tag":"M","t":"Peserta didik mempelajari langkah menentukan notasi AX<sub>n</sub>E<sub>m</sub> dan bentuk molekul."},{"tag":"A","t":"Peserta didik menentukan bentuk molekul 8 senyawa menggunakan tabel VSEPR."},{"tag":"R","t":"Peserta didik membandingkan sudut ikatan CH<sub>4</sub>, NH<sub>3</sub>, H<sub>2</sub>O dan menjelaskan pengaruh PEB."}],"form":"Latihan penentuan bentuk molekul"},{"tp":"11.2.2","jp":3,"sub":"Model molekul tiga dimensi","aps":"Apakah molekul benar-benar datar seperti gambar di buku?","inti":[{"tag":"A","t":"Kelompok membuat model molekul dari plastisin/balon dan tusuk sate (CH<sub>4</sub>, NH<sub>3</sub>, H<sub>2</sub>O, BF<sub>3</sub>, PCl<sub>5</sub>, SF<sub>6</sub>)."},{"tag":"A","t":"Kelompok menguji modelnya dengan simulasi PhET \"Molecule Shapes\"."},{"tag":"R","t":"Pameran model; kelompok lain memberi umpan balik ketepatan bentuk."}],"form":"Rubrik produk model molekul"},{"tp":"11.2.3","jp":2,"sub":"Keelektronegatifan dan momen dipol","aps":"Dalam tarik tambang, siapa yang menang bila kekuatan kedua tim berbeda?","inti":[{"tag":"M","t":"Peserta didik mempelajari keelektronegatifan dan ikatan kovalen polar."},{"tag":"A","t":"Peserta didik menentukan kepolaran ikatan berdasarkan selisih keelektronegatifan."},{"tag":"R","t":"Peserta didik mengaitkan analogi tarik tambang dengan ikatan polar."}],"form":"Kuis kepolaran ikatan"},{"tp":"11.2.3","jp":2,"sub":"Kepolaran molekul","aps":"Demonstrasi: aliran air dari buret dibelokkan oleh penggaris yang digosok ke rambut.","inti":[{"tag":"M","t":"Peserta didik menjelaskan hasil demonstrasi dengan konsep molekul polar."},{"tag":"A","t":"Peserta didik menggunakan PhET \"Molecule Polarity\" untuk menguji kepolaran CO<sub>2</sub>, H<sub>2</sub>O, BF<sub>3</sub>, NH<sub>3</sub>."},{"tag":"R","t":"Peserta didik menyimpulkan syarat molekul polar."}],"form":"Lembar kerja simulasi kepolaran"},{"tp":"11.2.4","jp":3,"sub":"Gaya London dan gaya dipol-dipol","aps":"Mengapa LPG berwujud gas, bensin cair, dan lilin padat padahal semuanya hidrokarbon?","inti":[{"tag":"M","t":"Peserta didik mempelajari jenis gaya antarmolekul."},{"tag":"A","t":"Peserta didik menganalisis data titik didih alkana dan senyawa polar-nonpolar dengan Mr serupa."},{"tag":"R","t":"Peserta didik menjawab pertanyaan pemantik."}],"form":"Analisis data titik didih"},{"tp":"11.2.4","jp":2,"sub":"Ikatan hidrogen","aps":"Grafik titik didih hidrida golongan VIA: mengapa H<sub>2</sub>O \"melompat\" jauh lebih tinggi?","inti":[{"tag":"M","t":"Peserta didik mempelajari syarat terbentuknya ikatan hidrogen."},{"tag":"A","t":"Kelompok menganalisis grafik titik didih hidrida golongan IVA–VIIA dan menjelaskan anomalinya."},{"tag":"R","t":"Peserta didik mengaitkan ikatan hidrogen dengan kehidupan (air, DNA)."}],"form":"Penjelasan tertulis analisis grafik"},{"tp":"11.2.4","jp":2,"sub":"Kelarutan dan cara kerja sabun","aps":"Mengapa noda minyak di baju hilang dengan sabun, tetapi tidak dengan air saja?","inti":[{"tag":"M","t":"Peserta didik mempelajari prinsip <i>like dissolves like</i>."},{"tag":"A","t":"Peserta didik menjelaskan cara kerja sabun dengan gambar molekul sabun (kepala polar, ekor nonpolar)."},{"tag":"R","t":"Peserta didik kembali ke pertanyaan minyak dan air pada awal bab."}],"form":"Gambar penjelasan cara kerja sabun"},{"tp":"11.2.5","jp":2,"sub":"Praktikum hubungan ikatan dengan sifat fisik zat","aps":"Prediksi: zat mana yang menghantarkan listrik dan larut dalam air?","inti":[{"tag":"A","t":"Kelompok menuliskan prediksi lalu melakukan praktikum uji daya hantar dan kelarutan sesuai LKPD."},{"tag":"A","t":"Kelompok mencatat data dan menjawab pertanyaan analisis."}],"form":"LKPD dan rubrik praktikum"},{"tp":"11.2.5","jp":2,"sub":"Presentasi hasil praktikum","aps":"Apakah prediksi kelompokmu terbukti?","inti":[{"tag":"A","t":"Setiap kelompok mempresentasikan hasil dan analisis praktikum."},{"tag":"R","t":"Diskusi kelas tentang data yang berbeda antar-kelompok."},{"tag":"R","t":"Refleksi 3-2-1 untuk seluruh bab."}],"form":"Rubrik presentasi"}],"media":[["PhET \"Molecule Shapes\"","Simulasi interaktif","Visualisasi 3D bentuk molekul dan pengaruh PEB"],["PhET \"Molecule Polarity\"","Simulasi interaktif","Momen dipol dan kepolaran"],["Plastisin/balon dan tusuk sate","Alat peraga buatan","Model molekul VSEPR"],["Alat uji elektrolit sederhana","Alat praktikum","Hubungan jenis ikatan dan daya hantar"],["Grafik titik didih hidrida golongan IVA–VIIA","Media cetak/slide","Analisis ikatan hidrogen"]],"glosarium":[["Struktur Lewis","Gambaran elektron valensi atom dalam molekul menggunakan titik atau garis."],["VSEPR","Teori tolakan pasangan elektron kulit valensi untuk meramalkan bentuk molekul."],["Keelektronegatifan","Kecenderungan atom menarik pasangan elektron ikatan."],["Gaya London","Gaya tarik lemah akibat dipol sesaat antarmolekul."],["Ikatan hidrogen","Interaksi kuat antara atom H yang terikat pada F, O, atau N dengan atom F, O, atau N molekul lain."]],"slides":[{"lay":"hero","k":"Bab 2","t":"Ikatan Kimia dan Interaksi Antarpartikel","sim":"","img":{"f":"Halite_crystal.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Halite_crystal.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Halite_crystal.jpg","alt":"Halite crystal","cap":""},"body":"Rahasia di balik kerasnya garam dan bandelnya minyak dalam air"},{"lay":"split","k":"Pertanyaan pemantik","t":"Mengapa minyak dan air tidak mau bercampur?","sim":"","img":{"f":"Water_and_oil.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Water_and_oil.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Water_and_oil.jpg","alt":"Water and oil","cap":""},"body":["Mengapa garam dapur keras, sedangkan lilin lunak?","Mengapa air mendidih pada 100 °C, padahal H₂S sudah berupa gas pada suhu ruang?"]},{"lay":"split","k":"Materi","t":"Kestabilan Atom dan Struktur Lewis","sim":"XI-2b","img":{"f":"Sodium-chloride-3D-ionic.png","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Sodium-chloride-3D-ionic.png?width=1280","src":"https://commons.wikimedia.org/wiki/File:Sodium-chloride-3D-ionic.png","alt":"Kisi kristal NaCl: Na⁺ (ungu) dan Cl⁻ (hijau)","cap":"Kisi kristal NaCl: Na⁺ (ungu) dan Cl⁻ (hijau)"},"html":"<p>Atom cenderung mencapai konfigurasi elektron seperti gas mulia (aturan oktet/duplet) dengan melepas, menerima, atau memakai bersama elektron. Struktur Lewis menggambarkan elektron valensi dengan titik atau silang.</p><ul><li>Pengecualian aturan oktet: BF<sub>3</sub> (B hanya 6 elektron), PCl<sub>5</sub> dan SF<sub>6</sub> (oktet berkembang).</li></ul>"},{"lay":"splitR","k":"Materi","t":"Jenis Ikatan dan Sifat Zat","sim":"XI-2b","img":{"f":"Copper_wire_comparison.JPG","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Copper_wire_comparison.JPG?width=1280","src":"https://commons.wikimedia.org/wiki/File:Copper_wire_comparison.JPG","alt":"Kawat tembaga: ikatan logam","cap":"Kawat tembaga: ikatan logam"},"html":"<ul><li><b>Ikatan ion:</b> serah terima elektron antara logam dan nonlogam (NaCl, MgO). Sifat: padat, titik leleh tinggi, keras tetapi rapuh, lelehan/larutannya menghantarkan listrik.</li><li><b>Ikatan kovalen:</b> pemakaian bersama pasangan elektron antarnonlogam (H<sub>2</sub>O, CO<sub>2</sub>). Dapat tunggal, rangkap dua, rangkap tiga, atau kovalen koordinasi (NH<sub>4</sub><sup>+</sup>). Titik leleh umumnya rendah.</li><li><b>Ikatan logam:</b> kation logam dalam \"lautan elektron\" yang bebas bergerak. Sifat: menghantarkan listrik dan panas, dapat ditempa, mengilap.</li></ul>"},{"lay":"split","k":"Materi","t":"Bentuk Molekul (Teori VSEPR)","sim":"XI-2","img":{"f":"VSEPR_geometries.PNG","url":"https://commons.wikimedia.org/wiki/Special:FilePath/VSEPR_geometries.PNG?width=1280","src":"https://commons.wikimedia.org/wiki/File:VSEPR_geometries.PNG","alt":"Bentuk-bentuk molekul VSEPR","cap":"Bentuk-bentuk molekul VSEPR"},"html":"<p>Pasangan elektron di sekitar atom pusat saling tolak sehingga menempati posisi sejauh mungkin. Notasi AX<sub>n</sub>E<sub>m</sub>: A = atom pusat, X = pasangan elektron ikatan (PEI), E = pasangan elektron bebas (PEB). Urutan tolakan: PEB–PEB &gt; PEB–PEI &gt; PEI–PEI.</p><table><tr><th>Notasi</th><th>Bentuk molekul</th><th>Sudut ikatan</th><th>Contoh</th></tr><tr><td>AX<sub>2</sub></td><td>Linear</td><td>180°</td><td>CO<sub>2</sub>, BeCl<sub>2</sub></td></tr><tr><td>AX<sub>3</sub></td><td>Segitiga datar</td><td>120°</td><td>BF<sub>3</sub></td></tr><tr><td>AX<sub>4</sub></td><td>Tetrahedral</td><td>109,5°</td><td>CH<sub>4</sub>, CCl<sub>4</sub></td></tr><tr><td>AX<sub>3</sub>E</td><td>Piramida segitiga</td><td>± 107°</td><td>NH<sub>3</sub></td></tr><tr><td>AX<sub>2</sub>E<sub>2</sub></td><td>Bentuk V</td><td>± 104,5°</td><td>H<sub>2</sub>O</td></tr><tr><td>AX<sub>5</sub></td><td>Bipiramida segitiga</td><td>90°, 120°</td><td>PCl<sub>5</sub></td></tr><tr><td>AX<sub>6</sub></td><td>Oktahedral</td><td>90°</td><td>SF<sub>6</sub></td></tr></table>"},{"lay":"gallery","k":"Model molekul","t":"Dari tetrahedral ke bentuk V","sim":"XI-2","imgs":[{"f":"Methane-3D-balls.png","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Methane-3D-balls.png?width=1280","src":"https://commons.wikimedia.org/wiki/File:Methane-3D-balls.png","alt":"CH₄ tetrahedral, 109,5°","cap":"CH₄ tetrahedral, 109,5°"},{"f":"Ammonia-3D-balls.png","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Ammonia-3D-balls.png?width=1280","src":"https://commons.wikimedia.org/wiki/File:Ammonia-3D-balls.png","alt":"NH₃ piramida segitiga, ± 107°","cap":"NH₃ piramida segitiga, ± 107°"},{"f":"Water-3D-balls.png","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Water-3D-balls.png?width=1280","src":"https://commons.wikimedia.org/wiki/File:Water-3D-balls.png","alt":"H₂O bentuk V, ± 104,5°","cap":"H₂O bentuk V, ± 104,5°"}],"body":"Pasangan elektron bebas menolak lebih kuat sehingga sudut ikatan makin kecil."},{"lay":"splitR","k":"Materi","t":"Kepolaran Molekul","sim":"XI-2b","img":{"f":"Water-elpot-transparent-3D-balls.png","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Water-elpot-transparent-3D-balls.png?width=1280","src":"https://commons.wikimedia.org/wiki/File:Water-elpot-transparent-3D-balls.png","alt":"Peta potensial listrik molekul air","cap":"Peta potensial listrik molekul air"},"html":"<p>Ikatan polar terjadi bila terdapat perbedaan keelektronegatifan. Molekul polar bila resultan momen dipolnya tidak nol, yaitu bila ikatannya polar <b>dan</b> bentuknya tidak simetris (atau atom pusat memiliki PEB).</p><ul><li>Polar: H<sub>2</sub>O, NH<sub>3</sub>, HCl, CHCl<sub>3</sub>. Nonpolar: CO<sub>2</sub>, CH<sub>4</sub>, CCl<sub>4</sub>, BF<sub>3</sub>.</li></ul>"},{"lay":"split","k":"Materi","t":"Gaya Antarmolekul","sim":"XI-2c","img":{"f":"Hydrogen-bonding-in-water-2D.png","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Hydrogen-bonding-in-water-2D.png?width=1280","src":"https://commons.wikimedia.org/wiki/File:Hydrogen-bonding-in-water-2D.png","alt":"Ikatan hidrogen antarmolekul air","cap":"Ikatan hidrogen antarmolekul air"},"html":"<ul><li><b>Gaya London (dispersi):</b> dimiliki semua molekul, makin kuat bila Mr makin besar dan rantai makin panjang/lurus.</li><li><b>Dipol–dipol:</b> antarmolekul polar.</li><li><b>Ikatan hidrogen:</b> antara atom H yang terikat pada F, O, atau N dengan atom F, O, atau N molekul lain; paling kuat di antara gaya antarmolekul. Menyebabkan titik didih H<sub>2</sub>O, HF, NH<sub>3</sub> jauh lebih tinggi dari hidrida segolongannya.</li></ul><p>Makin kuat gaya antarmolekul → titik didih dan viskositas makin tinggi. Zat larut dalam pelarut yang sejenis kepolarannya (<i>like dissolves like</i>).</p>"},{"lay":"contoh","k":"","t":"","sim":"","q":"Tentukan bentuk molekul SO<sub>2</sub> (S pusat, 6 elektron valensi; ikatan rangkap dihitung satu domain).","a":"S membentuk 2 domain ikatan dengan O dan memiliki 1 PEB → AX<sub>2</sub>E → bentuk V (sudut ± 119°), molekul polar."},{"lay":"contoh","k":"","t":"","sim":"","q":"Urutkan titik didih HF, HCl, HBr, dan HI. Jelaskan.","a":"HF &gt; HI &gt; HBr &gt; HCl. HF memiliki ikatan hidrogen; untuk HCl–HI, gaya London makin kuat seiring kenaikan Mr."},{"lay":"hero","k":"Praktikum","t":"Like dissolves like","sim":"XI-2d","img":{"f":"Separatory_funnel_with_oil_and_colored_water.jpg","url":"https://commons.wikimedia.org/wiki/Special:FilePath/Separatory_funnel_with_oil_and_colored_water.jpg?width=1280","src":"https://commons.wikimedia.org/wiki/File:Separatory_funnel_with_oil_and_colored_water.jpg","alt":"Separatory funnel with oil and colored water","cap":""},"body":"Zat polar larut dalam pelarut polar, zat nonpolar larut dalam pelarut nonpolar."},{"lay":"refleksi","k":"","t":"","sim":""}]},{"kode":"XI-3","no":3,"sem":1,"jp":20,"judul":"Laju Reaksi","sym":"Lj","topik":"Mengapa makanan cepat basi? Mengungkap rahasia cepat-lambatnya reaksi","pemantik":["Mengapa makanan lebih cepat basi di luar lemari es?","Mengapa kayu bakar dibelah kecil-kecil agar cepat menyala?","Bagaimana enzim membantu pencernaan?"],"pemahaman":"Cepat atau lambatnya reaksi bergantung pada seberapa sering partikel bertumbukan secara efektif, sehingga kita dapat mengatur laju reaksi untuk mengawetkan makanan, mempercepat produksi, atau menyelamatkan nyawa.","tp":[{"k":"11.3.1","t":"Menjelaskan konsep laju reaksi dan menentukan laju reaksi dari data percobaan"},{"k":"11.3.2","t":"Menjelaskan faktor-faktor yang memengaruhi laju reaksi berdasarkan teori tumbukan"},{"k":"11.3.3","t":"Menentukan orde reaksi dan persamaan laju reaksi dari data percobaan"},{"k":"11.3.4","t":"Merancang dan melakukan percobaan untuk menyelidiki faktor-faktor yang memengaruhi laju reaksi"}],"materi":[{"h":"Pengertian Laju Reaksi","html":"<p>Laju reaksi adalah berkurangnya konsentrasi pereaksi atau bertambahnya konsentrasi produk per satuan waktu.</p><div class=\"formula\">Untuk reaksi pA → qB:  v = −Δ[A]/Δt = +Δ[B]/Δt  (satuan M s<sup>−1</sup>)</div><p>Perbandingan laju zat-zat sama dengan perbandingan koefisiennya.</p>"},{"h":"Teori Tumbukan dan Energi Aktivasi","html":"<p>Reaksi terjadi bila partikel bertumbukan dengan energi yang cukup (≥ energi aktivasi, Ea) dan orientasi yang tepat (tumbukan efektif). Energi aktivasi adalah \"bukit\" yang harus dilewati pada diagram energi.</p>"},{"h":"Faktor-Faktor yang Memengaruhi Laju","html":"<ul><li><b>Konsentrasi:</b> makin besar, jumlah partikel per volume makin banyak → tumbukan makin sering.</li><li><b>Luas permukaan:</b> zat berbentuk serbuk memiliki bidang sentuh lebih luas → tumbukan makin sering.</li><li><b>Suhu:</b> energi kinetik naik → fraksi partikel berenergi ≥ Ea bertambah. Umumnya laju naik 2 kali setiap kenaikan 10 °C:</li></ul><div class=\"formula\">v<sub>2</sub> = v<sub>1</sub> × 2<sup>(T2 − T1)/10</sup></div><ul><li><b>Katalis:</b> menyediakan jalur reaksi lain dengan Ea lebih rendah, tidak ikut habis bereaksi. Contoh: enzim, Fe pada proses Haber, konverter katalitik.</li></ul>"},{"h":"Persamaan Laju dan Orde Reaksi","html":"<div class=\"formula\">Untuk aA + bB → produk:  v = k[A]<sup>x</sup>[B]<sup>y</sup></div><p>x dan y adalah orde reaksi yang ditentukan dari <b>percobaan</b>, tidak dari koefisien. Orde total = x + y.</p><ul><li>Menentukan orde: pilih dua data dengan konsentrasi zat lain tetap, lalu (v<sub>2</sub>/v<sub>1</sub>) = ([A]<sub>2</sub>/[A]<sub>1</sub>)<sup>x</sup>.</li><li>Grafik: orde 0 → laju tetap; orde 1 → laju sebanding konsentrasi; orde 2 → laju sebanding kuadrat konsentrasi.</li></ul>"}],"contoh":[{"q":"Reaksi 2NO + Br<sub>2</sub> → 2NOBr. Jika [NO] dijadikan 2 kali, laju menjadi 4 kali; jika [Br<sub>2</sub>] dijadikan 2 kali, laju menjadi 2 kali. Tentukan persamaan laju dan orde totalnya.","a":"2<sup>x</sup> = 4 → x = 2; 2<sup>y</sup> = 2 → y = 1. v = k[NO]<sup>2</sup>[Br<sub>2</sub>], orde total 3."}],"rangkuman":"Konsep laju → teori tumbukan &amp; energi aktivasi → faktor-faktor laju → persamaan laju &amp; orde reaksi → penyelidikan eksperimen.","lkpd":{"judul":"Pengaruh Suhu dan Luas Permukaan terhadap Laju Reaksi Tablet Effervescent","tujuan":"Menyelidiki pengaruh suhu dan luas permukaan terhadap laju reaksi.","dasar":"Tablet effervescent mengandung asam (misalnya asam sitrat) dan natrium bikarbonat. Ketika dimasukkan ke dalam air, keduanya bereaksi menghasilkan gas CO<sub>2</sub>. Waktu yang diperlukan hingga tablet habis bereaksi dapat digunakan sebagai ukuran laju reaksi (laju ≈ 1/waktu).","alat":["Gelas kimia/gelas bening 250 mL (4 buah)","Termometer","Stopwatch","Gelas ukur 100 mL","Mortar dan alu (atau sendok)","Pemanas air/termos"],"bahan":["Tablet effervescent (vitamin C) 4 buah, merek dan ukuran sama","Air es, air suhu ruang, dan air hangat ± 50 °C"],"keselamatan":["Hati-hati menggunakan air panas.","Larutan hasil percobaan tidak untuk diminum karena alat laboratorium tidak steril."],"langkah":["<b>Rumusan masalah:</b> Tuliskan rumusan masalah dan hipotesis kelompok sebelum percobaan.","<b>Variasi suhu:</b> Isi tiga gelas masing-masing dengan 100 mL air pada suhu berbeda (± 10 °C, ± 28 °C, ± 50 °C). Ukur suhunya.","Masukkan satu tablet utuh ke setiap gelas, lalu catat waktu hingga tablet habis bereaksi (tidak ada gelembung lagi).","<b>Variasi luas permukaan:</b> Gerus satu tablet menjadi serbuk, masukkan ke 100 mL air suhu ruang, catat waktunya, lalu bandingkan dengan tablet utuh pada suhu ruang.","Tentukan variabel bebas, terikat, dan kontrol untuk setiap percobaan."],"pertanyaan":["Buatlah grafik hubungan suhu terhadap laju relatif (1/t).","Bagaimana pengaruh suhu terhadap laju reaksi? Jelaskan dengan teori tumbukan.","Bagaimana pengaruh luas permukaan terhadap laju reaksi? Jelaskan dengan teori tumbukan.","Apakah hipotesis kelompokmu terbukti? Jelaskan.","Sebutkan dua penerapan hasil percobaan ini dalam kehidupan sehari-hari."]},"quiz":[{"q":"Pada reaksi A → B, konsentrasi A berkurang dari 0,8 M menjadi 0,2 M dalam waktu 20 detik. Laju berkurangnya A adalah …","o":["0,01 M/s","0,02 M/s","0,03 M/s","0,04 M/s","0,05 M/s"],"a":"C","b":"v = Δ[A]/Δt = (0,8 − 0,2)/20 = 0,03 M/s."},{"q":"Serbuk pualam bereaksi lebih cepat dengan HCl dibandingkan bongkahan pualam karena …","o":["energi aktivasinya lebih tinggi","luas bidang sentuh lebih besar sehingga tumbukan makin sering","konsentrasi HCl bertambah","suhu sistem turun","serbuk berfungsi sebagai katalis"],"a":"B","b":"Luas permukaan besar memperbanyak tumbukan antara partikel pereaksi."},{"q":"Katalis mempercepat laju reaksi dengan cara …","o":["menaikkan suhu","memperbesar konsentrasi","menurunkan energi aktivasi","menambah jumlah produk","menggeser kesetimbangan"],"a":"C","b":"Katalis menyediakan jalur reaksi alternatif dengan energi aktivasi lebih rendah."},{"q":"Setiap kenaikan suhu 10 °C, laju reaksi menjadi 2 kali lebih cepat. Jika suhu dinaikkan dari 20 °C menjadi 50 °C, laju reaksi menjadi … kali semula.","o":["3","4","6","8","16"],"a":"D","b":"ΔT = 30 °C → 3 kali kenaikan → 2<sup>3</sup> = 8 kali."},{"q":"Data percobaan reaksi A + B → C:<br>[A] 0,1; [B] 0,1; v = 2 M/s | [A] 0,2; [B] 0,1; v = 8 M/s | [A] 0,1; [B] 0,2; v = 4 M/s.<br>Persamaan laju reaksi tersebut adalah …","o":["v = k[A][B]","v = k[A]<sup>2</sup>[B]","v = k[A][B]<sup>2</sup>","v = k[A]<sup>2</sup>[B]<sup>2</sup>","v = k[A]<sup>2</sup>"],"a":"B","b":"[A] ×2 → v ×4 (orde 2); [B] ×2 → v ×2 (orde 1)."},{"q":"Berdasarkan data soal nomor 5, nilai tetapan laju (k) adalah …","o":["20","200","2.000","20.000","0,2"],"a":"C","b":"k = v/([A]<sup>2</sup>[B]) = 2/(0,01 × 0,1) = 2.000 M<sup>−2</sup> s<sup>−1</sup>."},{"q":"Kenaikan suhu mempercepat laju reaksi karena …","o":["energi aktivasi menurun","jumlah partikel bertambah","fraksi partikel yang memiliki energi ≥ energi aktivasi bertambah","konsentrasi pereaksi bertambah","luas permukaan bertambah"],"a":"C","b":"Energi kinetik meningkat sehingga lebih banyak tumbukan efektif."},{"q":"Menyimpan sayuran di dalam lemari es bertujuan untuk …","o":["menaikkan energi aktivasi","memperlambat reaksi pembusukan dengan menurunkan suhu","menambah katalis","memperkecil luas permukaan","mempercepat reaksi"],"a":"B","b":"Suhu rendah mengurangi energi kinetik partikel dan aktivitas mikroorganisme."}],"pertemuan":[{"tp":"11.3.1","jp":2,"sub":"Konsep laju reaksi","aps":"Demonstrasi tablet effervescent dalam air panas dan dingin.","inti":[{"tag":"M","t":"Peserta didik mengidentifikasi reaksi cepat dan lambat di sekitar."},{"tag":"M","t":"Peserta didik merumuskan definisi dan ungkapan laju reaksi."},{"tag":"R","t":"Peserta didik menuliskan contoh reaksi dan perkiraan lajunya."}],"form":"Tanya jawab dan kartu contoh reaksi"},{"tp":"11.3.1","jp":2,"sub":"Menentukan laju dari data","aps":"Data konsentrasi terhadap waktu: bagaimana mengubahnya menjadi grafik dan laju?","inti":[{"tag":"A","t":"Peserta didik mengolah data konsentrasi–waktu menjadi grafik dengan spreadsheet."},{"tag":"A","t":"Peserta didik menghitung laju rata-rata dan perbandingan laju berdasarkan koefisien."},{"tag":"R","t":"Peserta didik menafsirkan makna kemiringan grafik."}],"form":"Grafik dan lembar perhitungan"},{"tp":"11.3.2","jp":3,"sub":"Teori tumbukan dan energi aktivasi","aps":"Mengapa korek api harus digesek agar menyala?","inti":[{"tag":"M","t":"Peserta didik mengamati simulasi PhET \"Reactions &amp; Rates\" untuk membedakan tumbukan efektif dan tidak efektif."},{"tag":"M","t":"Peserta didik mempelajari diagram energi dan energi aktivasi."},{"tag":"A","t":"Peserta didik menggambar diagram energi reaksi dengan dan tanpa katalis."},{"tag":"R","t":"Peserta didik menjawab pertanyaan korek api dengan konsep Ea."}],"form":"Diagram energi dan kuis"},{"tp":"11.3.2","jp":2,"sub":"Faktor-faktor yang memengaruhi laju reaksi","aps":"Mengapa gula pasir lebih cepat larut daripada gula batu?","inti":[{"tag":"M","t":"Kelompok berdiskusi tentang pengaruh konsentrasi, luas permukaan, suhu, dan katalis dengan teori tumbukan."},{"tag":"A","t":"Kelompok menyusun poster mini contoh penerapan setiap faktor dalam kehidupan."},{"tag":"R","t":"Galeri poster dan umpan balik antarkelompok."}],"form":"Rubrik poster mini"},{"tp":"11.3.3","jp":3,"sub":"Persamaan laju dan orde reaksi","aps":"Apakah melipatgandakan konsentrasi selalu melipatgandakan laju?","inti":[{"tag":"M","t":"Guru memodelkan cara menentukan orde dari tabel data."},{"tag":"A","t":"Peserta didik menentukan orde, persamaan laju, dan nilai k dari beberapa set data secara berpasangan."},{"tag":"R","t":"Peserta didik membandingkan orde dengan koefisien reaksi dan menyimpulkan bahwa orde ditentukan dari percobaan."}],"form":"Latihan penentuan orde"},{"tp":"11.3.3","jp":2,"sub":"Grafik orde reaksi dan latihan mandiri","aps":"Bagaimana bentuk grafik laju terhadap konsentrasi untuk orde 0, 1, dan 2?","inti":[{"tag":"M","t":"Peserta didik mencocokkan grafik dengan orde reaksi."},{"tag":"A","t":"Peserta didik mengerjakan latihan mandiri berjenjang."},{"tag":"R","t":"Peserta didik menilai sendiri pemahamannya dengan skala 1–4."}],"form":"Kuis daring orde reaksi"},{"tp":"11.3.4","jp":2,"sub":"Merancang dan melakukan percobaan faktor laju","aps":"Bagaimana cara membuktikan bahwa suhu memengaruhi laju reaksi?","inti":[{"tag":"A","t":"Kelompok merumuskan masalah, hipotesis, dan variabel pada LKPD."},{"tag":"A","t":"Kelompok melakukan percobaan tablet effervescent dengan variasi suhu dan luas permukaan."}],"form":"Rubrik praktikum dan LKPD"},{"tp":"11.3.4","jp":2,"sub":"Pengolahan data dan presentasi","aps":"Apakah hipotesis kelompokmu terbukti?","inti":[{"tag":"A","t":"Kelompok mengolah data menjadi grafik 1/t terhadap suhu."},{"tag":"A","t":"
